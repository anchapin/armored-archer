version: '3'

services:
  postgres:
    image: postgres:14-alpine
    container_name: armored_archer_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-nakama}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - data:/var/lib/postgresql/data
    expose:
      - "8080"
      - "5432"
    ports:
      - "5432:5432"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-nakama}"]
      interval: 3s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: armored_archer_prometheus
    restart: unless_stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - backend-network

  grafana:
    image: grafana/grafana:10.1.0
    container_name: armored_archer_grafana
    restart: unless_stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - backend-network
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:v1.6.1
    container_name: armored_archer_node_exporter
    restart: unless_stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - backend-network
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  nakama:
    image: heroiclabs/nakama:3.21.1
    container_name: armored_archer_server
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        echo "Starting Nakama with environment validation..." &&
        /nakama/nakama migrate up --database.address ${DATABASE_ADDRESS:-postgres:changeme@postgres:5432/nakama} &&
        exec /nakama/nakama --config /nakama/data/nakama.yml
    restart: always
    environment:
      - NAKAMA_SERVER_KEY=${NAKAMA_SERVER_KEY:-defaultkey}
      - NAKAMA_SERVER_PORT=${NAKAMA_SERVER_PORT:-7350}
      - NAKAMA_CONSOLE_PORT=${NAKAMA_CONSOLE_PORT:-7351}
      - DATABASE_ADDRESS=${DATABASE_ADDRESS:-postgres:changeme@postgres:5432/nakama}
      - SESSION_ENCRYPTION_KEY=${SESSION_ENCRYPTION_KEY:-default-token-key}
      - REFRESH_ENCRYPTION_KEY=${REFRESH_ENCRYPTION_KEY:-default-refresh-key}
    links:
      - "postgres:db"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./nakama.yml:/nakama/data/nakama.yml
      - ./build:/nakama/data/build
      - ./modules:/nakama/data/modules
      - ./data:/nakama/data/migrations
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
  prometheus_data:
  grafana_data:

networks:
  backend-network:
    driver: bridge
