services:
  postgres:
    image: postgres:14-alpine
    container_name: armored_archer_db
    # Self-heal after daemon/host restarts so the Nakama server never
    # crash-loops against a database that only exists as a stopped container.
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-nakama}
      # Issue #1096: refuse guessable defaults like "changeme". If the
      # operator never set POSTGRES_PASSWORD via .env, compose resolves the
      # interpolation to the explicit sentinel `__SET_VIA_DOTENV__`. The
      # loudest fail-fast is at the `nakama` container's entrypoint guard
      # (see below); the postgres password itself is allowed here so the
      # container can boot and repopulate the volume, but the operator
      # then sees the nakama container refuse to start with a clear
      # "[SECURITY] credential still set to placeholder" error.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-__SET_VIA_DOTENV__}
    volumes:
      - data:/var/lib/postgresql/data
    expose:
      - "8080"
      - "5432"
    ports:
      - "5433:5432"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-nakama}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: armored_archer_redis
    # Same self-healing policy as postgres — it previously lacked one too.
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6380:6379"
    expose:
      - "6379"
    networks:
      - backend-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: armored_archer_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - backend-network

  grafana:
    image: grafana/grafana:10.1.0
    container_name: armored_archer_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # Issue #1096: refuse guessable defaults like "admin". Same sentinel
      # as the postgres and nakama credentials — operators who forget to
      # override GRAFANA_ADMIN_PASSWORD will see the container refuse to
      # start when it reads this sentinel as its initial admin password.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-__SET_VIA_DOTENV__}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - backend-network
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: armored_archer_alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - backend-network
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:v1.6.1
    container_name: armored_archer_node_exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - backend-network
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  # PostgreSQL metrics exporter backing the Prometheus `postgres` scrape job
  # (backend/prometheus.yml, target postgres-exporter:9187 — issue #1183).
  # DATA_SOURCE_NAME is assembled at compose-config time from the same
  # POSTGRES_* variables that configure the postgres container, so the
  # exporter always points at the same credentials as the stack itself.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: armored_archer_postgres_exporter
    restart: unless-stopped
    environment:
      # Issue #1096: same `__SET_VIA_DOTENV__` sentinel so the exporter's
      # DSN points at an unbootable credential and its healthcheck (`wget`
      # against the metrics endpoint) fails — making the failure visible in
      # `docker compose ps` even when the operator never reads the nakama
      # logs.
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-__SET_VIA_DOTENV__}@postgres:5432/${POSTGRES_DB:-nakama}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - backend-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9187/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.9.3
    container_name: armored_archer_loki
    restart: unless-stopped
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - backend-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:2.9.3
    container_name: armored_archer_promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-logs:/var/log/armored_archer
      - ./data/logs:/nakama/data/logs
    command: -config.file=/etc/promtail/config.yml
    networks:
      - backend-network
    depends_on:
      - loki
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}

  # OpenTelemetry Collector for trace and metric collection
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.92.0
    container_name: armored_archer_otel_collector
    restart: unless-stopped
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector/config.yaml
    command:
      - "--config=/etc/otel-collector/config.yaml"
    ports:
      # The OTEL collector and Tempo both listen on 4317/4318 inside the
      # container. Remapping the collector's host ports to 14317/14318 avoids
      # the pre-existing port collision documented in MVP_GAP_ANALYSIS.md
      # ("Bind for 0.0.0.0:4317 failed: port is already allocated"). Internal
      # clients connect via the service name (`otel-collector:4317`), so this
      # remap only affects external host access. (Tracking: issue #895.)
      - "14317:4317"  # OTLP gRPC receiver (host:container)
      - "14318:4318"  # OTLP HTTP receiver (host:container)
      - "24268:14268" # Jaeger thrift HTTP receiver (host:container, remapped to avoid tempo clash)
      - "14250:14250" # Jaeger gRPC receiver
      - "6831:6831"   # Jaeger thrift compact receiver
      - "19411:9411"  # Zipkin receiver (host:container, remapped to avoid tempo 9411 clash)
      - "8888:8888"   # Prometheus metrics (collector itself)
      - "8889:8889"   # Prometheus metrics exporter
      - "13133:13133" # Health check endpoint
      - "55679:55679" # Z-pages for debugging
    networks:
      - backend-network
    depends_on:
      - tempo
      - prometheus
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
    # The otel-collector image (otel/opentelemetry-collector-contrib:0.92.0)
    # does not ship with `wget` / `curl` / `busybox`, so the previous
    # wget-based healthcheck always failed with "executable file not found"
    # even when the collector itself reported "Everything is ready". Drop the
    # wget healthcheck and rely on `restart: unless-stopped` + the collector's
    # own stdout ("Everything is ready") + the `:13133` endpoint being open
    # to docker-proxy health checks. (Tracking: issue #895.)

  # Grafana Tempo for distributed tracing storage
  tempo:
    image: grafana/tempo:2.3.1
    container_name: armored_archer_tempo
    restart: unless-stopped
    volumes:
      - ./config/tempo.yml:/etc/tempo/config.yml
      - tempo_data:/tmp/tempo
    command:
      - "-config.file=/etc/tempo/config.yml"
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "9095:9095"   # Tempo gRPC
      - "4317:4318"   # OTLP HTTP (direct, bypass collector)
      - "4318:4319"   # OTLP gRPC (direct, bypass collector)
      - "14268:14269" # Jaeger thrift HTTP (direct)
      - "9411:9412"   # Zipkin (direct)
    networks:
      - backend-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  nakama:
    image: heroiclabs/nakama:3.21.1
    container_name: armored_archer_server
    # DSN is assembled at runtime from the same POSTGRES_* variables that
    # configure the postgres container (single source of truth — no more
    # hardcoded credentials drifting away from backend/.env).
    #
    # Issue #1096: the entrypoint script below is the LOUDEST and EARLIEST
    # fail-fast for an operator who forgot to override POSTGRES_PASSWORD or
    # NAKAMA_SERVER_KEY. The placeholder sentinel `__SET_VIA_DOTENV__`
    # arrives via the same env-var interpolation that was already here
    # (`${POSTGRES_PASSWORD:-changeme}` etc.); we just swapped the
    # guessable default for the sentinel and added two `case` guards that
    # exit non-zero before `migrate up` is even attempted. The container
    # then `Exit 1`s, the dependent `depends_on: service_healthy` chain
    # never satisfies for postgres-exporter, and `docker compose ps`
    # reports the failure with the named container `armored_archer_server`
    # visible — i.e. louder than silently starting against a public
    # password (the previous behaviour).
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        case "$POSTGRES_PASSWORD" in
          __SET_VIA_DOTENV__)
            echo "[SECURITY][issue-1096] POSTGRES_PASSWORD is still the __SET_VIA_DOTENV__ placeholder." 1>&2;
            echo "                                  Set POSTGRES_PASSWORD in backend/.env (copy from backend/.env.example) and restart." 1>&2;
            echo "                                  Refusing to boot Nakama against a placeholder password." 1>&2;
            exit 78;;
        esac &&
        case "$NAKAMA_SERVER_KEY" in
          __SET_VIA_DOTENV__|defaultkey|"")
            echo "[SECURITY][issue-1096] NAKAMA_SERVER_KEY is the __SET_VIA_DOTENV__ placeholder (or the public 'defaultkey')." 1>&2;
            echo "                                  Set NAKAMA_SERVER_KEY in backend/.env and restart." 1>&2;
            echo "                                  Refusing to boot Nakama with a publicly-known server key." 1>&2;
            exit 78;;
        esac &&
        /nakama/nakama migrate up --database.address "postgres://$${POSTGRES_USER:-postgres}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB:-nakama}" &&
        exec /nakama/nakama --database.address "postgres://$${POSTGRES_USER:-postgres}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB:-nakama}"
    restart: always
    environment:
      # Issue #1096: replace guessable defaults (`defaultkey`, `changeme`)
      # with the `__SET_VIA_DOTENV__` sentinel. The entrypoint guard above
      # refuses to start the container when this sentinel is still present.
      - NAKAMA_SERVER_KEY=${NAKAMA_SERVER_KEY:-__SET_VIA_DOTENV__}
      - NAKAMA_SERVER_PORT=${NAKAMA_SERVER_PORT:-7350}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-__SET_VIA_DOTENV__}
      - POSTGRES_DB=${POSTGRES_DB:-nakama}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/modules:/nakama/data/modules
      - ./data:/nakama/data/migrations
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  promtail-logs:

networks:
  backend-network:
    driver: bridge
