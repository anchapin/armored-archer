version: '3'

services:
  postgres:
    image: postgres:14-alpine
    container_name: armored_archer_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-nakama}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - data:/var/lib/postgresql/data
    expose:
      - "8080"
      - "5432"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-nakama}"]
      interval: 3s
      timeout: 3s
      retries: 5

  nakama:
    image: heroiclabs/nakama:3.21.1
    container_name: armored_archer_server
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        echo "Starting Nakama with environment validation..." &&
        /nakama/nakama migrate up --database.address ${DATABASE_ADDRESS:-postgres:changeme@postgres:5432/nakama} &&
        exec /nakama/nakama --config /nakama/data/nakama.yml
    restart: always
    environment:
      - NAKAMA_SERVER_KEY=${NAKAMA_SERVER_KEY:-defaultkey}
      - NAKAMA_SERVER_PORT=${NAKAMA_SERVER_PORT:-7350}
      - NAKAMA_CONSOLE_PORT=${NAKAMA_CONSOLE_PORT:-7351}
      - DATABASE_ADDRESS=${DATABASE_ADDRESS:-postgres:changeme@postgres:5432/nakama}
      - SESSION_ENCRYPTION_KEY=${SESSION_ENCRYPTION_KEY:-default-token-key}
      - REFRESH_ENCRYPTION_KEY=${REFRESH_ENCRYPTION_KEY:-default-refresh-key}
    links:
      - "postgres:db"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./nakama.yml:/nakama/data/nakama.yml
      - ./build:/nakama/data/build
      - ./modules:/nakama/data/modules
      - ./data:/nakama/data/migrations
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
