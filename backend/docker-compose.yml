  nakama:
    image: heroiclabs/nakama:3.21.1
    container_name: armored_archer_server
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address ${DATABASE_ADDRESS:-postgres://postgres:changeme@postgres:5432/nakama} &&
        exec /nakama/nakama --database.address ${DATABASE_ADDRESS:-postgres://postgres:changeme@postgres:5432/nakama}
    restart: always
    environment:
      - NAKAMA_SERVER_KEY=${NAKAMA_SERVER_KEY:-defaultkey}
      - NAKAMA_SERVER_PORT=${NAKAMA_SERVER_PORT:-7350}
      - NAKAMA_CONSOLE_PORT=${NAKAMA_CONSOLE_PORT:-7351}
      - DATABASE_ADDRESS=${DATABASE_ADDRESS:-postgres://postgres:changeme@postgres:5432/nakama}
      - SESSION_ENCRYPTION_KEY=${SESSION_ENCRYPTION_KEY:-default-token-key}
      - REFRESH_ENCRYPTION_KEY=${REFRESH_ENCRYPTION_KEY:-default-refresh-key}
    links:
      - "postgres:db"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /home/alex/armored-archer/backend/data:/nakama/data
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  nakama_data:

networks:
  backend-network:
    driver: bridge
