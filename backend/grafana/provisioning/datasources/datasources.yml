# Grafana datasource configuration
# Auto-provisioned datasources for Armored Archer

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: GET
    # Uncomment for production with authentication
    # basicAuth: false
    # basicAuthUser: admin
    # secureJsonData:
    #   basicAuthPassword: ${GRAFANA_ADMIN_PASSWORD}
