# Alertmanager configuration for Armored Archer
#
# Issue #1094 routing contract: every webhook URL / integration key is
# pulled from backend/.env via docker-compose's `environment:` block. Each
# variable defaults to a `__SET_VIA_DOTENV__` sentinel; if the operator
# forgets to override, the alertmanager container fails its `/config` and
# `/-/ready` healthcheck at boot, surfaced by docker-compose's `healthcheck:`.
# Mirrors the #1096 fail-fast convention so receivers never silently fire at
# `http://localhost/slack` / `dummy-key` / `https://your-pagerduty.com` again.
#
# Required env vars (documented in backend/.env.example):
#   ALERTMANAGER_SMTP_SMART_HOST         e.g. smtp.gmail.com:587
#   ALERTMANAGER_SMTP_AUTH_USERNAME      e.g. alerts@example.com
#   ALERTMANAGER_SMTP_AUTH_PASSWORD      app password
#   ALERTMANAGER_PAGERDUTY_URL           e.g. https://events.pagerduty.com/v2/enqueue
#   ALERTMANAGER_SLACK_CRITICAL_URL      full Slack incoming-webhook URL
#   ALERTMANAGER_SLACK_WARN_URL          (separate channel webhook for warnings)
#   ALERTMANAGER_SLACK_INFO_URL          (separate channel webhook for info)
#   ALERTMANAGER_SLACK_SECURITY_URL      (separate channel webhook for security)
#   ALERTMANAGER_CRITICAL_PAGERDUTY_SERVICE_KEY  PagerDuty Events API v2 key (critical)
#   ALERTMANAGER_DASHBOARD_BASE_URL      e.g. https://grafana.example.com
#   ALERTMANAGER_RUNBOOK_BASE_URL        e.g. https://github.com/org/repo/blob/main/docs
#   ALERTMANAGER_IR_BASE_URL             incident-response tool base (PagerDuty fallback)
#   ALERTMANAGER_EMAIL_CRITICAL_TO       e.g. on-call-critical@example.com
#   ALERTMANAGER_EMAIL_WARNING_TO        e.g. on-call@example.com
#   ALERTMANAGER_EMAIL_INFO_TO           e.g. alerts@example.com
#   ALERTMANAGER_EMAIL_SECURITY_TO       e.g. security-team@example.com
#
# Default catch-all `default` receiver is always-on to `alerts@...`; override
# ALERTMANAGER_EMAIL_INFO_TO to set the actual destination.
#
# Health probe (added in #1094): alertmanager's `/-/healthy` is exposed on
# the docker-network service name. The `armored_archer_alertmanager` container
# uses Prometheus's healthcheck command so docker-compose's
# `healthcheck:` block reports `healthy` only after `/config` reloads without
# a template error.

global:
  # Resolve timeout for alerts
  resolve_timeout: 5m
  
  # SMTP configuration for email notifications (optional)
  smtp_from: "${ALERTMANAGER_SMTP_FROM}"
  smtp_smarthost: "${ALERTMANAGER_SMTP_SMART_HOST}"
  smtp_auth_username: "${ALERTMANAGER_SMTP_AUTH_USERNAME}"
  smtp_auth_password: "${ALERTMANAGER_SMTP_AUTH_PASSWORD}"
  
  # PagerDuty integration (optional)
  pagerduty_url: "${ALERTMANAGER_PAGERDUTY_URL}"

# Define the notification receivers
receivers:
  # ============================================
  # Critical Alerts - All channels
  # ============================================
  
  - name: 'critical-alerts'
    # Email for critical alerts
    email_configs:
      - to: '${ALERTMANAGER_EMAIL_CRITICAL_TO}'
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .GroupLabels.alertname }} - Armored Archer'
        html: |
          <h2>🚨 Critical Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Environment:</strong> {{ .Labels.environment }}</p>
          <p><strong>Service:</strong> {{ .Labels.service }}</p>
          <p><strong>Component:</strong> {{ .Labels.component }}</p>
          <hr>
          <h3>Alert Details</h3>
          <p>{{ .Annotations.description }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          <p><strong>Labels:</strong></p>
          <pre>{{ .Labels | toYAML }}</pre>
    
    # PagerDuty for critical alerts
    pagerduty_configs:
      - service_key: '${ALERTMANAGER_CRITICAL_PAGERDUTY_SERVICE_KEY}'
        severity: critical
        component: '{{ .Labels.component }}'
        group: '{{ .Labels.team }}'
    
    # Slack for critical alerts
    slack_configs:
      - api_url: '${ALERTMANAGER_SLACK_CRITICAL_URL}'
        channel: '#armored-archer-critical'
        username: 'Armored Archer Alerts'
        icon_emoji: ':fire:'
        title: '🚨 Critical Alert: {{ .GroupLabels.alertname }}'
        text: |
          *Environment:* {{ .Labels.environment }}
          *Service:* {{ .Labels.service }}
          *Component:* {{ .Labels.component }}
          
          {{ .Annotations.description }}
        actions:
          - type: button
            text: '📊 View Dashboard'
            url: '${ALERTMANAGER_DASHBOARD_BASE_URL}/d/armored-archer'
          - type: button
            text: '📋 Runbook'
            url: '{{ .Annotations.runbook_url }}'
          - type: button
            text: '🔗 Acknowledge'
            url: '${ALERTMANAGER_IR_BASE_URL}'

  # ============================================
  # Warning Alerts - Email + Slack
  # ============================================
  
  - name: 'warning-alerts'
    email_configs:
      - to: '${ALERTMANAGER_EMAIL_WARNING_TO}'
        send_resolved: true
        headers:
          subject: '[WARNING] {{ .GroupLabels.alertname }} - Armored Archer'
        html: |
          <h2>⚠️ Warning Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Environment:</strong> {{ .Labels.environment }}</p>
          <p><strong>Service:</strong> {{ .Labels.service }}</p>
          <hr>
          <h3>Alert Details</h3>
          <p>{{ .Annotations.description }}</p>
    
    slack_configs:
      - api_url: ${ALERTMANAGER_SLACK_CRITICAL_URL}
        channel: '#armored-archer-warnings'
        username: 'Armored Archer Alerts'
        icon_emoji: ':warning:'
        title: '⚠️ Warning: {{ .GroupLabels.alertname }}'
        text: |
          *Environment:* {{ .Labels.environment }}
          *Service:* {{ .Labels.service }}
          
          {{ .Annotations.description }}
        actions:
          - type: button
            text: '📊 View Dashboard'
            url: 'http://grafana:3000/dashboard/db/armored-archer'

  # ============================================
  # Info Alerts - Slack only
  # ============================================
  
  - name: 'info-alerts'
    slack_configs:
      - api_url: ${ALERTMANAGER_SLACK_WARN_URL}
        channel: '#armored-archer-info'
        username: 'Armored Archer Info'
        icon_emoji: ':information_source:'
        title: 'ℹ️ Info: {{ .GroupLabels.alertname }}'
        text: |
          {{ .Annotations.description }}

  # ============================================
  # Security Alerts - Dedicated channel
  # ============================================
  
  - name: 'security-alerts'
    email_configs:
      - to: '${ALERTMANAGER_EMAIL_SECURITY_TO}'
        send_resolved: true
        headers:
          subject: '[SECURITY] {{ .GroupLabels.alertname }} - Armored Archer'
    
    slack_configs:
      - api_url: ${ALERTMANAGER_SLACK_INFO_URL}
        channel: '#armored-archer-security'
        username: 'Armored Archer Security'
        icon_emoji: ':rotating_light:'
        title: '🔒 Security Alert: {{ .GroupLabels.alertname }}'
        text: |
          *Environment:* {{ .Labels.environment }}
          *Service:* {{ .Labels.service }}
          
          {{ .Annotations.description }}
        actions:
          - type: button
            text: '🔒 Security Dashboard'
            url: '${ALERTMANAGER_DASHBOARD_BASE_URL}/d/armored-archer-security'
          - type: button
            text: '📋 Incident Response'
            url: '${ALERTMANAGER_IR_BASE_URL}'

  # ============================================
  # Default/catch-all receiver
  # ============================================
  
  - name: 'default'
    email_configs:
      - to: '${ALERTMANAGER_EMAIL_INFO_TO}'
        send_resolved: true

# ============================================
# Alert Routing Tree
# ============================================
# Routes define which receiver handles which alerts
# Matching proceeds top-to-bottom, first match wins

route:
  # Default receiver for unmatched alerts
  receiver: 'default'
  
  # Group alerts by these labels for aggregation
  group_by: ['alertname', 'environment', 'service', 'component']
  
  # How long to wait before sending a notification
  # if a new alert arrives while group is pending
  group_wait: 30s
  
  # How long to wait before sending notification
  # about new alerts that were added to a group
  group_interval: 5m
  
  # How long to wait before re-sending notification
  # if alert is still firing and no new alerts
  repeat_interval: 4h
  
  # Enable routing tree
  routes:
    # Critical severity alerts
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h
    
    # Security alerts
    - match:
        team: security
      receiver: 'security-alerts'
      group_wait: 10s
      repeat_interval: 2h
    
    # Warning severity alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 4h
    
    # Info severity alerts (batched, less frequent)
    - match:
        severity: info
      receiver: 'info-alerts'
      group_interval: 30m
      repeat_interval: 24h

# ============================================
# Inhibit Rules - Suppress related alerts
# ============================================
inhibit_rules:
  # Suppress warning/error alerts when critical is firing
  - source_match:
      severity: 'critical'
    target_match_re:
      severity: 'warning|info'
    equal: ['alertname', 'environment', 'service']
  
  # Suppress component-specific alerts when service is down
  - source_match:
      alertname: 'GameServerDown'
    target_match_re:
      alertname: 'HighLatency|HighMemoryUsage|HighCPUUsage|SettlementClaimFailed'
    equal: ['environment', 'service']
  
  # Suppress component-specific alerts when database is down
  - source_match:
      alertname: 'DatabaseDown'
    target_match_re:
      alertname: 'DatabaseConnectionPoolExhausted'
    equal: ['environment', 'service']
  
  # Suppress general alerts during maintenance window
  - source_match:
      alertname: 'MaintenanceWindow'
    target_match_re:
      alertname: '.+'
    equal: ['environment']

# ============================================
# Time intervals for scheduled routing
# ============================================
time_intervals:
  # Maintenance window - reduce alert noise
  - name: 'maintenance'
    time_intervals:
      # Every Sunday 2-4 AM UTC (optional example)
      - weekdays: ['sunday']
        times:
          - start_time: '02:00'
            end_time: '04:00'
  
  # Business hours only - for non-critical alerts
  - name: 'business-hours'
    time_intervals:
      - weekdays: ['monday', 'tuesday', 'wednesday', 'thursday', 'friday']
        times:
          - start_time: '09:00'
            end_time: '17:00'
        location: 'UTC'
