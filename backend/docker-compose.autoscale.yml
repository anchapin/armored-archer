# Auto-scale policy override for the Nakama service (issue #1351,
# PD-2026-04-12 A6). Policy text: docs/AUTOSCALING.md.
#
# Intended path: Docker Swarm, where replicas/resources are enforced:
#   docker stack deploy -c docker-compose.yml -c docker-compose.autoscale.yml armored_archer
# (Swarm ignores the base file's container_name with a warning; published
# ports move to the ingress mesh, so multiple replicas work.)
#
# Plain `docker compose up` applies the cpus/memory limits to the single
# dev container. `--scale` is NOT supported on the base stack: the service
# pins container_name and fixed host ports (7349-7351). Multi-replica dev
# testing needs those removed first; production scale-out is the swarm path.
#
# Scaling adds stateless Nakama nodes ONLY. The Postgres pool ceiling is
# governed by #1350 and does not change on scale events.
services:
  nakama:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
