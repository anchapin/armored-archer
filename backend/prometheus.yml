# Prometheus configuration for Armored Archer
# Scrape configurations for collecting metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'armored-archer'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # Node Exporter for system metrics
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  # Nakama server metrics
  - job_name: 'nakama'
    metrics_path: '/metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['nakama:7350']
        labels:
          service: 'nakama'
          component: 'game-server'