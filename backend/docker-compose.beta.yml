# ============================================
# Docker Compose Override - Beta Environment
# Armored Archer - Go Module Deployment
# ============================================
# This override file configures Docker Compose for beta deployment
# with Go module support and production-ready settings.
# ============================================

version: '3'

services:
  nakama:
    container_name: armored_archer_beta
    environment:
      - NODE_ENV=beta
      - NAKAMA_SERVER_KEY=${NAKAMA_SERVER_KEY:-beta_server_key_production_ready}
      - NAKAMA_SERVER_PORT=${NAKAMA_SERVER_PORT:-7350}
      - NAKAMA_CONSOLE_PORT=${NAKAMA_CONSOLE_PORT:-7351}
      - NAKAMA_CONSOLE_PASSWORD=${NAKAMA_CONSOLE_PASSWORD:-beta_admin_secure_password}
      - DATABASE_ADDRESS=${DATABASE_ADDRESS:-postgres://postgres:beta_db_password@postgres:5432/nakama_beta}
      - SESSION_ENCRYPTION_KEY=${SESSION_ENCRYPTION_KEY:-beta-session-key-change-me}
      - REFRESH_ENCRYPTION_KEY=${REFRESH_ENCRYPTION_KEY:-beta-refresh-key-change-me}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-beta-token-key-change-me}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - ALLOW_HOST_LOOPBACK=${ALLOW_HOST_LOOPBACK:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=armored-archer-beta
    volumes:
      # Mount beta-specific Nakama configuration
      - ./data/nakama.beta.yml:/nakama/data/nakama.yml
      # Mount Go module
      - ./build/server.so:/nakama/data/modules/server.so:ro
      # Mount migrations
      - ./data:/nakama/data/migrations
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "7350:7350"
      - "7351:7351"
    depends_on:
      - postgres
      - redis

  postgres:
    container_name: armored_archer_beta_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-nakama_beta}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-beta_db_password_change_me}
    volumes:
      - beta_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    container_name: armored_archer_beta_redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - beta_redis_data:/data
    restart: unless-stopped

  prometheus:
    container_name: armored_archer_beta_prometheus
    volumes:
      - beta_prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    container_name: armored_archer_beta_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_beta_change_me}
    volumes:
      - beta_grafana_data:/var/lib/grafana
    restart: unless-stopped

  loki:
    container_name: armored_archer_beta_loki
    volumes:
      - beta_loki_data:/loki
    restart: unless-stopped

  promtail:
    container_name: armored_archer_beta_promtail
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-beta}
    restart: unless-stopped

  otel-collector:
    container_name: armored_archer_beta_otel
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    restart: unless-stopped

# Beta-specific volumes
volumes:
  beta_postgres_data:
  beta_redis_data:
  beta_prometheus_data:
  beta_grafana_data:
  beta_loki_data:
