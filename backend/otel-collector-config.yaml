# OpenTelemetry Collector Configuration for Armored Archer
# This configuration collects traces and metrics from the Go backend and Nakama server,
# then exports them to Grafana Tempo and Prometheus.

receivers:
  # OTLP receiver (primary protocol for Go backend)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  
  # Jaeger receiver (for compatibility with existing Jaeger clients)
  jaeger:
    protocols:
      thrift_http:
        endpoint: 0.0.0.0:14268
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_compact:
        endpoint: 0.0.0.0:6831
  
  # Zipkin receiver (alternative tracing format)
  zipkin:
    endpoint: 0.0.0.0:9411

processors:
  # Batch processor for efficient export
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024
  
  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  
  # Resource processor to add common attributes
  resource:
    attributes:
      - key: service.namespace
        value: armored-archer
        action: upsert
      - key: deployment.environment
        # The OpenTelemetry collector does NOT support compose-style `${VAR:default}` syntax
        # (it parses the `:` as a URI scheme separator and crashes with
        # "scheme \"ENVIRONMENT\" is not supported"). Use the `$$` escape so docker-compose
        # does NOT pre-expand this; the collector then resolves $ENVIRONMENT at startup
        # (docker-compose always sets it via the service `environment:` block with a
        # `-development` fallback, so the variable is guaranteed to be non-empty).
        value: $${ENVIRONMENT}
        action: upsert
  
  # Span processor to add metadata.
  # Go's RE2 regexp requires named capture groups to be plain identifiers
  # (no `.` / `-` / etc.); the previous patterns used dotted names (`rpc.name`,
  # `db.operation`, …) which RE2 rejects with "invalid regexp pattern".
  # (Tracking: issue #895.)
  span:
    name:
      to_attributes:
        rules:
          - ^(?P<rpc_name>rpc/.*)$
          - ^(?P<db_operation>db/.*)$
          - ^(?P<cache_operation>cache/.*)$
          - ^(?P<match_operation>match/.*)$
          - ^(?P<combat_operation>combat/.*)$
          - ^(?P<gear_operation>gear/.*)$
          - ^(?P<season_operation>season/.*)$
  
  # Sampling processor for production (1% sampling)
  # In development, use probability: 1.0 for full sampling
  probabilistic_sampler:
    sampling_percentage: 1.0
    hash_seed: 42
  
  # Attributes processor for trace-log correlation
  attributes:
    actions:
      - key: trace.trace_id
        from_attribute: trace_id
        action: upsert
      - key: trace.span_id
        from_attribute: span_id
        action: upsert

exporters:
  # Tempo exporter for traces
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true
  
  # Prometheus exporter for metrics
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otel
    resource_to_telemetry_conversion:
      enabled: true
  
  # Debug exporter for development (verbose logging)
  debug:
    verbosity: detailed
    sampling_initial: 1
    sampling_thereafter: 100
  
  # Logging exporter for trace summary
  logging:
    loglevel: info

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

  # Z-pages for debugging
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions:
    - health_check
    - zpages

  pipelines:
    # Traces pipeline: OTLP/Jaeger/Zipkin -> Processors -> Tempo
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors:
        - memory_limiter
        - resource
        - span
        - probabilistic_sampler
        - attributes
        - batch
      exporters:
        - otlphttp/tempo
        - logging
        - debug
    
    # Metrics pipeline: OTLP -> Processors -> Prometheus
    metrics:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource
        - batch
      exporters:
        - prometheus
        - logging

# Telemetry for the collector itself.
# The top-level `telemetry:` block was added in otel-collector v0.95.0; the
# 0.92.0 image we pin here rejects it as an invalid key. Internal metrics are
# still exposed via the `prometheus` exporter on port 8889 (see exporters section).
# (Tracking: issue #895 — config must validate against the pinned 0.92.0 image.)
