name: armored_archer_v2
console:
  port: 7351
  username: admin
  password: beta_admin_secure_password
  read_timeout: 10
  write_timeout: 10

runtime:
  env: []
  path: /nakama/data
  # Use JavaScript module for beta (Go module has compatibility issues)
  js_entrypoint: "modules/index.js"

socket:
  server_key: beta_server_key_production_ready
  port: 7350
  max_message_size_bytes: 4096
  read_buffer_size_bytes: 4096
  write_buffer_size_bytes: 4096
  read_timeout_ms: 10000
  write_timeout_ms: 10000
  idle_timeout_ms: 60000

session:
  expiry_sec: 7200
  refresh_encryption_key: beta-refresh-key-change-me
  token_encryption_key: beta-token-key-change-me

database:
  address: []
  conn_max_lifetime: 60
  max_open_conns: 25
  max_idle_conns: 10

social:
  enable_anonymous_auth: true
  enable_device_auth: true

leaderboard:
  enable_rank_cache: true
  rank_cache_size: 1000

logger:
  level: INFO
  format: json
  output: stdout

match:
  allow_host_loopback: false

metric:
  namespace: nakama
  prefix: nakama
  reporter:
    - type: prometheus
      port: 9100
