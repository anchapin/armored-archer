# Prometheus Alerting Rules for Armored Archer
# Critical alerts for game server monitoring
#
# Canonical alert-rule file (issue #1112): this is the ONLY copy — the former
# divergent backend/config/alert_rules.yml was deleted. Loaded by
# backend/prometheus.yml (rule_files) via the compose mount
# ./alerts.yml:/etc/prometheus/alerts.yml (backend/docker-compose.yml).
# docs/runbooks/README.md mirrors this file's alerts 1:1 — update both together.
#
# ---------------------------------------------------------------------------
# Planned-metric rule convention (issue #1092)
# ---------------------------------------------------------------------------
# Some rules in this file reference metrics that are NOT yet emitted by the
# backend. Those rules are kept here so the intent + runbook link survive the
# gap, but they are NEUTERED until the metric lands:
#
#   disabled: true   # Prometheus 3.0+ (issue #1092 tracking) honours this and
#                    # skips the rule.  We are currently on prom/prometheus:v2.47
#                    # (see backend/docker-compose.yml) which silently ignores
#                    # `disabled`, so each planned rule ALSO ships a no-op expr
#                    # (vector(0) > 1) so it never fires on Prometheus 2.47.
#
# Convention for a planned rule:
#
#   # __planned__: armored_archer_<metric_name> — short reason
#   # __issue__:    #1093 (umbrella for planned metrics expansion)
#   # __restore__:  Set disabled: false and replace expr with the documented
#   #               original PromQL when #1093 ships the metric.
#   - alert: SomeName
#     disabled: true
#     expr: vector(0) > 1
#     for: 1m
#     labels:
#       ...
#     annotations:
#       summary: "[PLANNED] ..."
#
# Active rules — those whose every referenced metric is emitted by backend/src
# or backend/metrics at HEAD — use the same YAML shape with disabled omitted
# and the real expr.  Audit last run: see the per-rule rationale comments.
# ---------------------------------------------------------------------------

groups:
  - name: armoured_archer_critical
    interval: 30s
    rules:
      # ============================================
      # CRITICAL - Immediate Action Required
      # ============================================

      # Game Server Down
      # Active: tracks the `up{job="nakama"}` gauge Prometheus exports for
      # the nakama scrape job defined in backend/prometheus.yml.
      - alert: GameServerDown
        expr: up{job="nakama"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
          component: game-server
        annotations:
          summary: "Game server (Nakama) is down"
          description: "Nakama server has been unavailable for more than 1 minute. Players cannot connect or play."
          runbook_url: "https://github.com/heroiclabs/nakama#troubleshooting"

      # Database Down
      # Active: tracks the `up{job="postgres"}` gauge for the postgres-exporter
      # scrape job (backend/docker-compose.yml, issue #1183).
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
          component: database
        annotations:
          summary: "PostgreSQL database is down"
          description: "Database has been unavailable for more than 1 minute. All game operations are affected."
          runbook_url: "https://www.postgresql.org/docs/current/static/app-pg-isready.html"

      # High Error Rate
      # Active: armored_archer_rpc_errors_total is emitted (Counter, see
      # backend/src/modules/metrics.ts). The denominator was renamed from
      # armored_archer_rpc_requests_total -> armored_archer_rpc_calls_total
      # (see backend/METRICS.md); the alert tracks call volume.
      - alert: HighErrorRate
        expr: rate(armored_archer_rpc_errors_total[5m]) / rate(armored_archer_rpc_calls_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          team: backend
          component: api
        annotations:
          summary: "High error rate on game API"
          description: "Error rate is above 5% for the past 5 minutes. Current: {{ $value | printf \"%.2f\" }}%"

      # Database Connection Pool Exhausted
      # Active: nakama_database_connections_{active,max} are exported by the
      # OSS Nakama 3.21 internal Prometheus registry.
      - alert: DatabaseConnectionPoolExhausted
        expr: nakama_database_connections_active / nakama_database_connections_max > 0.9
        for: 2m
        labels:
          severity: critical
          team: backend
          component: database
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Database connection usage is above 90%. Current: {{ $value | printf \"%.1f\" }}%"

      # Payment Processing Failure
      # __planned__: armored_archer_payment_failures_total — payment failure counter
      # __issue__:    #1093 (umbrella for planned metrics expansion)
      # __restore__:  Set disabled: false and replace expr with:
      #                  rate(armored_archer_payment_failures_total[5m]) > 0
      - alert: PaymentProcessingFailures
        disabled: true
        expr: vector(0) > 1
        for: 1m
        labels:
          severity: critical
          team: backend
          component: payments
        annotations:
          summary: "[PLANNED] Payment processing failures detected"
          description: "Payment failures occurring. This directly impacts revenue. Check payment gateway status. (Awaiting armored_archer_payment_failures_total — see #1093.)"

  - name: armored_archer_warning
    interval: 30s
    rules:
      # ============================================
      # WARNING - Attention Required
      # ============================================

      # High Latency
      # Active: histogram renamed from
      # armored_archer_rpc_request_duration_seconds -> armored_archer_rpc_duration_seconds
      # (prom-client auto-exposes _bucket/_sum/_count for histograms, so the
      # bucket series is armored_archer_rpc_duration_seconds_bucket).
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(armored_archer_rpc_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
          team: backend
          component: api
        annotations:
          summary: "High API latency detected"
          description: "95th percentile latency is above 2 seconds. Current: {{ $value | printf \"%.2f\" }}s"

      # High Memory Usage
      # Active: node_exporter standard metrics (see backend/docker-compose.yml).
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 5m
        labels:
          severity: warning
          team: backend
          component: infrastructure
        annotations:
          summary: "High memory usage on game server"
          description: "Memory usage is above 85%. Current: {{ $value | printf \"%.1f\" }}%"

      # High CPU Usage
      # Active: node_exporter standard metrics.
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          team: backend
          component: infrastructure
        annotations:
          summary: "High CPU usage on game server"
          description: "CPU usage is above 80%. Current: {{ $value | printf \"%.1f\" }}%"

      # Disk Space Low
      # Active: node_exporter standard metrics.
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
          team: backend
          component: infrastructure
        annotations:
          summary: "Low disk space on game server"
          description: "Available disk space is below 15%. Current: {{ $value | printf \"%.1f\" }}%"

      # Active Users Spike/Drop
      # __planned__: armored_archer_active_users — current DAU/CCU gauge
      # __planned__: armored_archer_active_users_offset_1h — derived recording
      #               rule (below) for the 1h-ago comparison.
      # __issue__:    #1093 (umbrella for planned metrics expansion)
      # __restore__:  Set disabled: false and replace expr with the
      #               original PromQL once armored_archer_active_users exists.
      - alert: ActiveUsersAnomaly
        disabled: true
        expr: vector(0) > 1
        for: 10m
        labels:
          severity: warning
          team: backend
          component: analytics
        annotations:
          summary: "[PLANNED] Unusual active users pattern"
          description: "Active users deviation is above 50% from 1 hour ago. Possible login issues or bot attack. (Awaiting armored_archer_active_users — see #1093.)"

      # Matchmaking Queue Building
      # Active: metric renamed from armored_archer_matchmaking_queue_size to
      # armored_archer_match_queue_size (see backend/src/modules/metrics.ts).
      - alert: MatchmakingQueueBuilding
        expr: armored_archer_match_queue_size > 100
        for: 5m
        labels:
          severity: warning
          team: backend
          component: matchmaking
        annotations:
          summary: "Matchmaking queue is building up"
          description: "There are {{ $value }} players waiting in matchmaking queue for more than 5 minutes."

      # Session Duration Anomaly
      # Active: depends on the recording rules `armored_archer_avg_session_duration`
      # and `armored_archer_avg_session_duration_offset_24h` defined later in this
      # file, both of which were updated to reference
      # armored_archer_player_session_duration_seconds (the emitted histogram).
      - alert: SessionDurationAnomaly
        expr: abs(armored_archer_avg_session_duration - armored_archer_avg_session_duration_offset_24h) / armored_archer_avg_session_duration_offset_24h > 0.3
        for: 30m
        labels:
          severity: warning
          team: backend
          component: analytics
        annotations:
          summary: "Unusual session duration pattern"
          description: "Average session duration deviation is above 30% from 24 hours ago. Possible game issues."

  - name: armored_archer_info
    interval: 60s
    rules:
      # ============================================
      # INFO - For Awareness
      # ============================================

      # Low Revenue
      # __planned__: armored_archer_revenue_cents_total — cumulative revenue
      #               counter labelled by product/sku.
      # __issue__:    #1093 (umbrella for planned metrics expansion)
      # __restore__:  Set disabled: false and replace expr with:
      #                  rate(armored_archer_revenue_cents_total[24h]) < 100
      - alert: LowRevenue
        disabled: true
        expr: vector(0) > 1
        for: 1h
        labels:
          severity: info
          team: product
          component: analytics
        annotations:
          summary: "[PLANNED] Revenue below expected threshold"
          description: "24-hour revenue rate is below $1/hour. Check for payment issues or player engagement. (Awaiting armored_archer_revenue_cents_total — see #1093.)"

      # Version Mismatch Warning
      # __planned__: armored_archer_active_users — labelled by client_version
      #               for this rule's count by (client_version) aggregation.
      # __issue__:    #1093 (umbrella for planned metrics expansion)
      # __restore__:  Set disabled: false and replace expr with:
      #                  count by (client_version) (armored_archer_active_users) > 10
      - alert: ClientVersionMismatch
        disabled: true
        expr: vector(0) > 1
        for: 10m
        labels:
          severity: info
          team: frontend
          component: client
        annotations:
          summary: "[PLANNED] Multiple client versions in use"
          description: "Version {{ $labels.client_version }} has {{ $value }} active users. Consider forcing updates. (Awaiting armored_archer_active_users — see #1093.)"

  - name: armored_archer_security
    interval: 30s
    rules:
      # ============================================
      # SECURITY - Critical Security Alerts
      # ============================================

      # Suspicious Login Activity
      # __planned__: armored_archer_failed_logins_total — failed-login counter
      #               labelled by reason (bad_password / unknown_user / …).
      # __issue__:    #1093 (umbrella for planned metrics expansion)
      # __restore__:  Set disabled: false and replace expr with:
      #                  rate(armored_archer_failed_logins_total[5m]) > 10
      - alert: SuspiciousLoginActivity
        disabled: true
        expr: vector(0) > 1
        for: 2m
        labels:
          severity: critical
          team: security
          component: authentication
        annotations:
          summary: "[PLANNED] Suspicious login activity detected"
          description: "More than 10 failed login attempts per minute. Possible brute force attack. (Awaiting armored_archer_failed_logins_total — see #1093.)"

      # Unusual API Call Pattern
      # Active: RPC call-rate denominator renamed from
      # armored_archer_rpc_requests_total -> armored_archer_rpc_calls_total.
      - alert: UnusualAPICallPattern
        expr: rate(armored_archer_rpc_calls_total[1m]) > 1000
        for: 5m
        labels:
          severity: warning
          team: security
          component: api
        annotations:
          summary: "Unusually high API call rate"
          description: "API request rate is very high ({{ $value }} req/min). Possible bot activity or DDoS."

      # Anti-Cheat Violation Spike
      # __planned__: armored_archer_anticheat_violations_total — violation
      #               counter labelled by violation_type.
      # __issue__:    #1093 (umbrella for planned metrics expansion)
      # __restore__:  Set disabled: false and replace expr with:
      #                  rate(armored_archer_anticheat_violations_total[5m]) > 5
      - alert: AntiCheatViolationSpike
        disabled: true
        expr: vector(0) > 1
        for: 2m
        labels:
          severity: warning
          team: security
          component: anti-cheat
        annotations:
          summary: "[PLANNED] Unusual anti-cheat violation spike"
          description: "High rate of anti-cheat violations detected ({{ $value }}/min). Review for new exploit. (Awaiting armored_archer_anticheat_violations_total — see #1093.)"

      # Admin Guard Rejection Spike (issue #1141)
      # Active: armored_archer_admin_rpc_access_denied_total is emitted.
      - alert: AdminAccessDeniedSpike
        expr: sum by (rpc_id) (rate(armored_archer_admin_rpc_access_denied_total[5m])) > 5 / 60
        for: 5m
        labels:
          severity: warning
          team: security
          component: admin-gate
        annotations:
          summary: "Spike in admin RPC access denials"
          description: "More than 5 admin-guard rejections per minute for 5 minutes on {{ $labels.rpc_id }}. Possible unauthorized admin-RPC probing or a broken ADMIN_USER_IDS deploy."
          runbook_url: "https://github.com/anchapin/armored-archer/blob/main/docs/runbooks/AdminAccessDeniedSpike.md"

      # Admin Allowlist Empty (issue #1141)
      # Active: armored_archer_admin_allowlist_size is emitted.
      - alert: AdminAllowlistEmpty
        expr: armored_archer_admin_allowlist_size == 0
        for: 1m
        labels:
          severity: critical
          team: security
          component: admin-gate
        annotations:
          summary: "Admin allowlist is empty — every admin RPC rejects every caller"
          description: "armored_archer_admin_allowlist_size is 0: ADMIN_USER_IDS is unset or blank, so the admin gate is fail-closed (ADR-0006). Set ADMIN_USER_IDS and restart; operators cannot use admin tooling until then."
          runbook_url: "https://github.com/anchapin/armored-archer/blob/main/docs/runbooks/AdminAccessDeniedSpike.md"

# Recording Rules - Pre-computed metrics for faster queries
  - name: armored_archer_recording
    interval: 60s
    rules:
      # Active users offset for anomaly detection
      # __planned__: armored_archer_active_users — source gauge is missing.
      # __issue__:    #1093 (umbrella for planned metrics expansion)
      # __restore__:  Set disabled: false and replace expr with:
      #                  armored_archer_active_users offset 1h
      - record: armored_archer_active_users_offset_1h
        disabled: true
        expr: vector(0)

      # Session duration offset for anomaly detection
      # Active: histogram renamed from
      # armored_archer_session_duration_seconds ->
      # armored_archer_player_session_duration_seconds (see
      # backend/src/modules/metrics.ts).
      - record: armored_archer_avg_session_duration
        expr: avg(armored_archer_player_session_duration_seconds)

      - record: armored_archer_avg_session_duration_offset_24h
        expr: avg(armored_archer_player_session_duration_seconds offset 24h)

      # Error rate (5m rate)
      # Active: RPC call-rate denominator renamed from
      # armored_archer_rpc_requests_total -> armored_archer_rpc_calls_total.
      - record: armored_archer_error_rate_5m
        expr: rate(armored_archer_rpc_errors_total[5m]) / rate(armored_archer_rpc_calls_total[5m])

      # Request rate per second
      # Active: denominator renamed from
      # armored_archer_rpc_requests_total -> armored_archer_rpc_calls_total.
      - record: armored_archer_request_rate
        expr: rate(armored_archer_rpc_calls_total[1m])

  # ============================================
  # WEBHOOK LEDGER (issue #1140)
  # Observability surface for the RevenueCat webhook RPC and its durable
  # event ledger (issue #1067). All alerts route to the payments runbook.
  # ============================================
  - name: armored_archer_webhook_ledger
    interval: 30s
    rules:
      # Webhook Not Configured (liveness probe at startup)
      # Active: armored_archer_webhook_configured is emitted.
      - alert: WebhookNotConfigured
        expr: armored_archer_webhook_configured == 0
        for: 1m
        labels:
          severity: critical
          team: backend
          component: payments
        annotations:
          summary: "RevenueCat webhook RPC is fail-closed — REVENUECAT_WEBHOOK_SECRET is not configured"
          description: "armored_archer_webhook_configured is 0: the webhook RPC (issue #1067 fail-closed) rejects every event, so all IAP purchases silently fail to award gems. Set REVENUECAT_WEBHOOK_SECRET and restart Nakama."
          runbook_url: "https://github.com/anchapin/armored-archer/blob/main/docs/runbooks/PaymentProcessingFailures.md"

      # Webhook Lag High
      # Active: armored_archer_webhook_processing_seconds is emitted as a
      # Histogram, prom-client exposes _bucket/_sum/_count series.
      - alert: WebhookLagHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(armored_archer_webhook_processing_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
          component: payments
        annotations:
          summary: "RevenueCat webhook processing latency is high"
          description: "p95 webhook processing latency has been above 2s for 5 minutes — purchase awards and pending-award drains are slow. Current: {{ $value | printf \"%.2f\" }}s."
          runbook_url: "https://github.com/anchapin/armored-archer/blob/main/docs/runbooks/PaymentProcessingFailures.md"

      # Webhook Signature Failure Spike
      # Active: armored_archer_webhook_events_total is emitted with an
      # `outcome` label (accepted | rejected_invalid_signature | …).
      - alert: WebhookSignatureFailureSpike
        expr: sum(rate(armored_archer_webhook_events_total{outcome="rejected_invalid_signature"}[5m])) > 1 / 60
        for: 5m
        labels:
          severity: warning
          team: security
          component: payments
        annotations:
          summary: "Spike in RevenueCat webhook signature rejections"
          description: "More than 1 webhook per minute rejected for an invalid HMAC signature over 5 minutes — the webhook secret rotated out of sync, or someone is forging RevenueCat callbacks."
          runbook_url: "https://github.com/anchapin/armored-archer/blob/main/docs/runbooks/PaymentProcessingFailures.md"

      # Webhook Redis Degraded
      # Active: armored_archer_webhook_redis_errors_total is emitted.
      - alert: WebhookRedisDegraded
        expr: sum(rate(armored_archer_webhook_redis_errors_total[5m])) > 1 / 60
        for: 5m
        labels:
          severity: warning
          team: backend
          component: payments
        annotations:
          summary: "Redis errors on the webhook dedup fast path"
          description: "More than 1 Redis failure per minute for 5 minutes on the webhook event ledger (dedup lookup / outcome recording). Idempotency stays correct via durable storage, but every event pays extra storage round-trips — check Redis health."
          runbook_url: "https://github.com/anchapin/armored-archer/blob/main/docs/runbooks/PaymentProcessingFailures.md"

  # ============================================
  # PVP SETTLEMENT (issue #1143)
  # PromQL view for the complete_match settlement audit channels
  # (ADR-0002 server-declared settlement, issue #1078 exactly-once pipeline):
  # settlement_degraded -> SettlementDegradedSpike,
  # settlement_claim_failed -> SettlementClaimFailed.
  # Both alerts route to the settlement runbook.
  # ============================================
  - name: armored_archer_settlement
    interval: 30s
    rules:
      # Settlement Degraded Spike
      # Active: armored_archer_settlement_outcomes_total is emitted with a
      # `result` label (degraded | claim_failed | …).
      - alert: SettlementDegradedSpike
        expr: sum(rate(armored_archer_settlement_outcomes_total{result="degraded"}[5m])) > 0.5 / 60
        for: 5m
        labels:
          severity: warning
          team: backend
          component: pvp
        annotations:
          summary: "Partially-applied PvP settlements are spiking"
          description: "More than 0.5 settlements/min degraded after the settled-marker claim for 5 minutes — post-claim effects (Elo/XP/currency) may be partially applied while the match stays settled, so shortfalls need manual reconciliation per the runbook. Inverse of the idempotency guarantee in issue #1078."
          runbook_url: "https://github.com/anchapin/armored-archer/blob/main/docs/runbooks/SettlementDegraded.md"

      # Settlement Claim Failed
      # Active: armored_archer_settlement_outcomes_total is emitted.
      - alert: SettlementClaimFailed
        expr: sum(rate(armored_archer_settlement_outcomes_total{result="claim_failed"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
          team: backend
          component: pvp
        annotations:
          summary: "PvP settlement claim failures — matches cannot settle"
          description: "The versioned settled-marker storage write is failing (>0/min for 1m): no rewards, XP, or Elo are applied at all, though client retries remain safe. The claim is the FIRST settlement mutation, so check PostgreSQL/Nakama storage health. Inhibited while GameServerDown is firing."
          runbook_url: "https://github.com/anchapin/armored-archer/blob/main/docs/runbooks/SettlementDegraded.md"

  # ============================================
  # Stage-progression telemetry (issue #1139).
  # replay_rejected -> StageCompletionDuplicateSpike.
  # ============================================
  - name: armored_archer_stage_progression
    interval: 30s
    rules:
      # Stage Completion Duplicate Spike
      # Active: armored_archer_stage_completion_claims_total is emitted with
      # a `result` label (replay_rejected | …).
      - alert: StageCompletionDuplicateSpike
        expr: sum(rate(armored_archer_stage_completion_claims_total{result="replay_rejected"}[5m])) > 1 / 60
        for: 5m
        labels:
          severity: warning
          team: backend
          component: pve
        annotations:
          summary: "Stage-completion replays are spiking (possible replay attack or stuck client)"
          description: "More than 1 stage_complete request/min is being rejected as DUPLICATE_COMPLETION for 5 minutes (claim-first dedup marker, issue #1069). A stuck retry loop or a scripted replay attack both present this way — distinguish via the audit trail per the runbook. Correlate armored_archer_stage_complete_total{outcome=\"clamped\"} for out-of-range claim storms."
          runbook_url: "https://github.com/anchapin/armored-archer/blob/main/docs/runbooks/StageCompletionDuplicates.md"