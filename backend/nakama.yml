name: nakama1
console:
  port: 7351
  username: admin
  password: password
  read_timeout: 10
  write_timeout: 10

runtime:
  env: []
  path: /nakama/data

socket:
  server_key: defaultkey
  port: 7350
  max_message_size_bytes: 4096
  read_buffer_size_bytes: 4096
  write_buffer_size_bytes: 4096
  read_timeout_ms: 10000
  write_timeout_ms: 10000
  idle_timeout_ms: 60000

session:
  expiry_sec: 7200
  refresh_encryption_key: default-refresh-key
  token_encryption_key: default-token-key

database:
  address: []
  conn_max_lifetime: 60
  max_open_conns: 25
  max_idle_conns: 10

social:
  enable_anonymous_auth: true
  enable_device_auth: true

leaderboard:
  enable_rank_cache: true
  rank_cache_size: 1000

logger:
  level: DEBUG
  format: json
  output: stdout

match:
  allow_host_loopback: true

metric:
  namespace: nakama
  prefix: nakama
  reporter:
    - type: prometheus
      port: 9100
