# ============================================
# Loki Configuration - Armored Archer
# ============================================
# Centralized log aggregation for application, Nakama, and system logs
# ============================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  http_server_read_timeout: 600s
  http_server_write_timeout: 600s
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093
  storage:
    type: local
    local:
      directory: /tmp/loki/rules
  rule_path: /tmp/loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# Retention configuration
# Logs older than 30 days will be deleted
compactor:
  working_directory: /tmp/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# Per-tenant limits
limits_config:
  # Retention period: 30 days
  retention_period: 720h
  
  # Ingestion limits
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 24
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  
  # Query limits
  max_query_parallelism: 32
  max_query_series: 500
  max_entries_limit_per_query: 5000
  max_chunks_per_query: 2000000
  max_query_length: 721h
  
  # Cardinality limits
  cardinality_limit: 100000
  max_label_name_length: 1024
  max_label_value_length: 2048
  max_label_names_per_series: 30
  
  # Allow structured JSON logs
  allow_structured_metadata: true
  
  # Volume enabled for analytics
  volume_enabled: true

# Logging configuration for Loki itself
logging:
  format: json
  level: info
  backtrace: false

# Chunk storage configuration
chunk_store_config:
  max_look_back_period: 720h
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 512

# Query scheduler
query_scheduler:
  max_outstanding_requests_per_tenant: 32768

# Frontend cache
query_frontend:
  cache_results: true
  results_cache_config:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 256

# Overrides for specific tenants (optional)
# overrides:
#   tenant1:
#     retention_period: 8760h  # 1 year for tenant1
