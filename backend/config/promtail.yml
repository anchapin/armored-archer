# ============================================
# Promtail Configuration - Armored Archer
# ============================================
# Log collection agent for Loki
# Collects logs from application, Nakama, and system sources
# ============================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    timeout: 10s
    # Promtail 2.9.x uses `batchsize` / `batchwait` (no underscore) — `batch_size`
    # / `batch_wait` are deprecated CLI-flag names, not YAML field names.
    batchsize: 1048576  # 1MB
    batchwait: 10s
    # Static external labels applied to every pushed log line (replaces the
    # previously-broken top-level `common_labels:` block, which is not part of
    # the promtail Config struct). Promtail does NOT support compose-style
    # `${VAR:-default}` substitution — use `$$` to escape docker-compose's
    # variable expansion; docker-compose already guarantees the variable is
    # set via the service `environment:` block, so $${ENVIRONMENT} resolves
    # to the actual value at startup.
    external_labels:
      cluster: armored_archer
      environment: $${ENVIRONMENT}

scrape_configs:
  # ============================================
  # Application Logs (Go Backend)
  # ============================================
  - job_name: application
    static_configs:
      - targets:
          - localhost
        labels:
          job: armored_archer
          service: backend
          level: info
          __path__: /var/log/armored_archer/*.log

    # Pipeline stages for parsing structured JSON logs
    pipeline_stages:
      # Parse JSON format
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            context: context
            service: service
            requestId: requestId
            userId: userId
            rpcName: rpcName

      # Extract additional fields from context
      - json:
          expressions:
            operation: context.operation
            error: context.error
          source: context

      # Promote extracted fields to labels
      - labels:
          level:
          service:
          rpcName:
          operation:
          requestId:

      # Format timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano

      # Add static labels
      - static_labels:
          app: armored_archer
          component: go_backend

  # ============================================
  # Nakama Server Logs
  # ============================================
  - job_name: nakama
    static_configs:
      - targets:
          - localhost
        labels:
          job: nakama
          service: nakama
          level: info
          __path__: /nakama/data/logs/*.log

    # Nakama log format pipeline
    pipeline_stages:
      # Parse Nakama's JSON log format
      - json:
          expressions:
            timestamp: timestamp
            level: level
            msg: msg
            logger: logger

      # Extract logger name as label
      - labels:
          level:
          logger:

      # Add static labels
      - static_labels:
          app: nakama
          component: game_server

  # ============================================
  # Docker Container Logs
  # ============================================
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: [com.docker.compose.project=armored_archer]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

    pipeline_stages:
      # Parse JSON logs from containers
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
      - labels:
          level:

  # ============================================
  # System Logs (Journalctl)
  # ============================================
  - job_name: system
    journal:
      max_age: 12h
      labels:
        job: systemd
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'systemd_unit'
      - source_labels: ['__journal_syslog_identifier']
        target_label: 'syslog_identifier'
      - source_labels: ['__journal_priority']
        target_label: 'priority'

    pipeline_stages:
      - regex:
          expression: '(?P<level>INFO|WARN|ERROR|DEBUG)'
      - labels:
          level:

  # ============================================
  # Log Files from Specific Paths
  # ============================================
  - job_name: varlogs
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /var/log/*log
          job: varlogs

    pipeline_stages:
      - regex:
          expression: '.*(?P<level>(?i)info|warn|error|debug).*'
      - labels:
          level:

  # ============================================
  # Backend Build Logs
  # ============================================
  - job_name: build_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: build
          service: backend
          __path__: /home/alex/armored-archer/backend/logs/*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
      - labels:
          level:

# ============================================
# Target Discovery
# ============================================
# The promtail `target_config` (file.Config) only accepts `sync_period` and
# `stdin` — `max_targets` is not part of the struct, so removing it.
# (`scrape_config_defaults` is also not part of the promtail Config struct;
# the earlier duplicate `positions:` block and that defaults block were
# both rejected by -check-syntax.) (Tracking: issue #895.)
target_config:
  # How often to sync targets
  sync_period: 10s
