# Prometheus Alert Rules for Armored Archer Backend
# Phase 2.3 - Alert Configuration & Testing
# 
# This file contains 6 alert rules:
# - 2 Critical alerts (immediate action required)
# - 4 Warning alerts (attention needed)
#
# Location: /backend/config/alert_rules.yml
# Loaded by: /backend/config/prometheus.yml (rule_files)
#
# Testing: 
#   - Use backend/scripts/test-alerts.sh to trigger test alerts
#   - Monitor at http://prometheus:9090/alerts
#   - Check Alertmanager at http://alertmanager:9093

groups:
  # ================================================================
  # CRITICAL ALERTS - Immediate Action Required
  # ================================================================
  - name: armored_archer_critical
    interval: 30s
    rules:
      # Alert 1: Service Down - Nakama Not Responding
      # ============================================
      - alert: GameServerDown
        expr: up{job="nakama"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
          component: game-server
          service: nakama
          environment: "{{ $labels.environment }}"
        annotations:
          summary: "🚨 Game server (Nakama) is down"
          description: "Nakama server has been unavailable for more than 1 minute. Players cannot connect or play."
          runbook_url: "https://github.com/armored-archer/armored-archer/blob/main/docs/runbooks/GameServerDown.md"
          dashboard_url: "http://grafana:3000/d/nakama-server"
          impact: "All game operations are affected. Players cannot authenticate, play matches, or access game features."
          troubleshooting: |
            1. Check Nakama container: docker ps | grep nakama
            2. View logs: docker logs nakama --tail 100
            3. Check health: curl -f http://localhost:7350/health
            4. Restart if needed: docker restart nakama

      # Alert 2: High Error Rate
      # ============================================
      - alert: HighErrorRate
        expr: rate(armored_archer_rpc_errors_total[5m]) / rate(armored_archer_rpc_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          team: backend
          component: api
          service: armored-archer
          environment: "{{ $labels.environment }}"
        annotations:
          summary: "🚨 High error rate on game API"
          description: "Error rate is above 5% for the past 5 minutes. Current error rate: {{ $value | printf \"%.2f\" }}%. This indicates widespread API failures affecting player experience."
          runbook_url: "https://github.com/armored-archer/armored-archer/blob/main/docs/runbooks/HighErrorRate.md"
          dashboard_url: "http://grafana:3000/d/armored-archer-errors"
          impact: "Players are experiencing failures in game operations including matchmaking, combat, and progression."
          troubleshooting: |
            1. Check error breakdown: curl 'http://prometheus:9090/api/v1/query?query=topk(5, rate(armored_archer_rpc_errors_total[5m]))'
            2. Review recent deployments: docker ps
            3. Check Sentry: https://sentry.io/organizations/armored-archer/issues/
            4. Examine logs: docker logs nakama --tail 200 | grep -i error

  # ================================================================
  # WARNING ALERTS - Attention Required
  # ================================================================
  - name: armored_archer_warning
    interval: 30s
    rules:
      # Alert 3: High Latency - P95 > 500ms
      # ============================================
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(armored_archer_rpc_request_duration_seconds_bucket[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
          team: backend
          component: api
          service: armored-archer
          environment: "{{ $labels.environment }}"
        annotations:
          summary: "⚠️ High API latency detected"
          description: "95th percentile latency is above 500ms for the past 10 minutes. Current P95: {{ $value | printf \"%.2f\" }}s. Players are experiencing slow game responses."
          runbook_url: "https://github.com/armored-archer/armored-archer/blob/main/docs/runbooks/HighLatency.md"
          dashboard_url: "http://grafana:3000/d/armored-archer-latency"
          impact: "Degraded user experience with slow game responses, delayed combat actions, and laggy UI interactions."
          troubleshooting: |
            1. Check latency by endpoint: curl 'http://prometheus:9090/api/v1/query?query=histogram_quantile(0.95, rate(armored_archer_rpc_request_duration_seconds_bucket[5m]))'
            2. Check system resources: docker stats nakama --no-stream
            3. Check for slow queries: docker exec postgres psql -U postgres -c "SELECT * FROM pg_stat_statements ORDER BY mean_exec_time DESC LIMIT 10;"
            4. Profile if needed: go tool pprof http://nakama:7350/debug/pprof/profile?seconds=30

      # Alert 4: Low Disk Space - <10% Available
      # ============================================
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
        for: 5m
        labels:
          severity: warning
          team: backend
          component: infrastructure
          service: node-exporter
          environment: "{{ $labels.environment }}"
        annotations:
          summary: "⚠️ Low disk space on game server"
          description: "Available disk space is below 10%. Current: {{ $value | printf \"%.1f\" }}%. Risk of service failure if disk fills completely."
          runbook_url: "https://github.com/armored-archer/armored-archer/blob/main/docs/runbooks/DiskSpaceLow.md"
          dashboard_url: "http://grafana:3000/d/node-exporter"
          impact: "Risk of service failure, inability to write logs, database corruption potential."
          troubleshooting: |
            1. Check disk usage: df -h
            2. Find large files: du -ah / | sort -rh | head -20
            3. Check Docker disk: docker system df
            4. Clean up: docker system prune -a --volumes
            5. Check logs: ls -lh /var/log/*.log

      # Alert 5: High Memory Usage - >85% for 15 minutes
      # ============================================
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 15m
        labels:
          severity: warning
          team: backend
          component: infrastructure
          service: node-exporter
          environment: "{{ $labels.environment }}"
        annotations:
          summary: "⚠️ High memory usage on game server"
          description: "Memory usage is above 85% for 15 minutes. Current: {{ $value | printf \"%.1f\" }}%. Risk of OOM kills and service instability."
          runbook_url: "https://github.com/armored-archer/armored-archer/blob/main/docs/runbooks/HighMemoryUsage.md"
          dashboard_url: "http://grafana:3000/d/node-exporter"
          impact: "Risk of out-of-memory kills, service crashes, and degraded performance."
          troubleshooting: |
            1. Check memory by process: top -o %MEM
            2. Check Nakama memory: docker stats nakama --no-stream
            3. Check for memory leaks: curl -s http://nakama:7350/metrics | grep go_memstats
            4. Check Goroutines: curl -s http://nakama:7350/metrics | grep go_goroutines
            5. Profile heap: go tool pprof http://nakama:7350/debug/pprof/heap

      # Alert 6: Database Connection Pool Exhausted
      # ============================================
      - alert: DatabaseConnectionPoolExhausted
        expr: nakama_database_connections_active / nakama_database_connections_max > 0.9
        for: 2m
        labels:
          severity: warning
          team: backend
          component: database
          service: nakama
          environment: "{{ $labels.environment }}"
        annotations:
          summary: "⚠️ Database connection pool nearly exhausted"
          description: "Database connection pool usage is above 90%. Current: {{ $value | printf \"%.1f\" }}%. Risk of query failures and slow responses."
          runbook_url: "https://github.com/armored-archer/armored-archer/blob/main/docs/runbooks/DatabaseConnectionPoolExhausted.md"
          dashboard_url: "http://grafana:3000/d/database-monitoring"
          impact: "Slow database queries, potential request failures, degraded game performance."
          troubleshooting: |
            1. Check current connections: docker exec postgres psql -U postgres -c "SELECT count(*) FROM pg_stat_activity;"
            2. Check pool metrics: curl -s http://nakama:7350/metrics | grep nakama_database
            3. Find long queries: docker exec postgres psql -U postgres -c "SELECT pid, now() - query_start AS duration, query FROM pg_stat_activity WHERE state != 'idle' ORDER BY duration DESC LIMIT 10;"
            4. Check for leaks: docker exec postgres psql -U postgres -c "SELECT client_addr, count(*) FROM pg_stat_activity GROUP BY client_addr ORDER BY count DESC;"
            5. Increase pool size in config.yaml if needed

  # ================================================================
  # Recording Rules - Pre-computed Metrics for Faster Queries
  # ================================================================
  - name: armored_archer_recording
    interval: 60s
    rules:
      # Error rate recording
      - record: armored_archer_error_rate_5m
        expr: rate(armored_archer_rpc_errors_total[5m]) / rate(armored_archer_rpc_requests_total[5m])
        labels:
          component: api

      # Request rate recording
      - record: armored_archer_request_rate_1m
        expr: rate(armored_archer_rpc_requests_total[1m])
        labels:
          component: api

      # Latency percentiles
      - record: armored_archer_latency_p50
        expr: histogram_quantile(0.50, rate(armored_archer_rpc_request_duration_seconds_bucket[5m]))
        labels:
          component: api

      - record: armored_archer_latency_p95
        expr: histogram_quantile(0.95, rate(armored_archer_rpc_request_duration_seconds_bucket[5m]))
        labels:
          component: api

      - record: armored_archer_latency_p99
        expr: histogram_quantile(0.99, rate(armored_archer_rpc_request_duration_seconds_bucket[5m]))
        labels:
          component: api

      # Active users offset for anomaly detection
      - record: armored_archer_active_users_offset_1h
        expr: armored_archer_active_users offset 1h
        labels:
          component: analytics

      # Session duration offset for anomaly detection
      - record: armored_archer_avg_session_duration
        expr: avg(armored_archer_session_duration_seconds)
        labels:
          component: analytics

      - record: armored_archer_avg_session_duration_offset_24h
        expr: avg(armored_archer_session_duration_seconds offset 24h)
        labels:
          component: analytics
