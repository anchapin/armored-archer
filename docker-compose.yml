version: '3'

services:
  postgres:
    image: postgres:14-alpine
    container_name: armored_archer_db
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdbpassword
    volumes:
      - data:/var/lib/postgresql/data
    expose:
      - "8080"
      - "5432"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 5

  nakama:
    image: heroiclabs/nakama:3.21.1
    container_name: armored_archer_server
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdbpassword@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1 --database.address postgres:localdbpassword@postgres:5432/nakama --logger.level DEBUG --session.token_expiry_sec 7200 --console.port 7351
    restart: always
    links:
      - "postgres:db"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/nakama/data
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
