[project]
name = "armored-archer"
version = "0.1.0"
description = "Multiplayer action RPG game"
requires-python = ">=3.10"
dependencies = [
    "pyinstrument==0.10.1",
]

[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
    "C901",   # McCabe complexity
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function call in argument defaults
]

# Maximum complexity before Ruff reports an error
# See: https://docs.astral.sh/ruff/settings/#lint_mccabe
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["C901"]
".claude/**" = ["ALL"]
"app_store_assets/**" = ["ALL"]
".planning/**" = ["ALL"]
"scripts/analyze_repo.py" = ["C901"]
"scripts/generate_pixel_art.py" = ["C901"]
"scripts/generate_report.py" = ["C901"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
