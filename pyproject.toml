[tool.ruff]
# Ruff linter configuration for Python code quality
# Target Python 3.10+ for modern syntax support
target-version = "py310"

# Enable rule categories
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function call in argument defaults
    "C901",    # too complex
    "SIM108",  # use ternary operator
]

# Exclude directories from linting
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "node_modules",
    ".venv",
    "venv",
]

[tool.ruff.per-file-ignores]
# Allow specific exceptions per file pattern
"tests/*" = ["B011"]  # don't check assert statements in tests

[tool.ruff.format]
# Use ruff formatter for consistent code style
quote-style = "double"
indent-style = "space"
line-ending = "auto"
