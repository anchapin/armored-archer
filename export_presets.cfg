; Godot 4.6 Android debug playtest preset. No release signing credentials.
; Legacy iOS settings: docs/reference/ios-export-preset.legacy.cfg.
[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="export/android/armored-archer.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.armoredarcher.game"
package/name="Armored Archer"
package/signed=true
screen/immersive_mode=false
permissions/internet=true
permissions/vibrate=true

; Issue #1725: Play Store release preset (AAB, arm64 only). Release signing
; values stay empty here: Godot reads GODOT_ANDROID_KEYSTORE_RELEASE_PATH /
; _USER / _PASSWORD from the environment, so no credential is tracked.
; The Gradle build template is installed at build time, not committed.
[preset.1]

name="Android Release"
platform="Android"
runnable=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="export/android/armored-archer-release.aab"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=1
gradle_build/min_sdk=""
gradle_build/target_sdk="36"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.armoredarcher.game"
package/name="Armored Archer"
package/signed=true
screen/immersive_mode=false
permissions/internet=true
permissions/vibrate=true
