name: add-clamp-utility-function
description: Create utility library with clamp() and other helper functions
created: 2026-04-06
mode: errand
base_branch: main
pipeline:
  scope: errand
  compile:
    - prd-passthrough
  defaultBuild: &a1
    - implement
  defaultReview: &a2
    strategy: auto
    perspectives:
      - functionality
    maxRounds: 1
    evaluatorStrictness: lenient
  rationale: This PRD creates a single utility file with one simple function that
    wraps Godot's built-in clamp(). The task is well-defined, low-risk, and
    touches only one new file. Using errand scope with prd-passthrough is most
    efficient - the PRD itself serves as the implementation plan. No review
    cycle is needed since the implementation is trivial (wrapping a built-in
    function), has no security implications, and no existing code is being
    modified. The review configuration is provided for completeness but will not
    be executed in the minimal build pipeline.
plans:
  - id: plan-01-add-clamp-utility-function
    name: Create utility library with clamp() and other helper functions
    depends_on: []
    branch: add-clamp-utility-function/main
    build: *a1
    review: *a2
