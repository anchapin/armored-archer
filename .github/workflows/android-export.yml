name: Android Export Smoke

# Issue #1662: no CI built the Android APK, so export regressions (broken
# presets, missing assets, ETC2/ASTC misconfiguration) were only caught by a
# manual pre-release export. Nightly + on-demand. Emulator boot smoke is a
# possible future step; export success + non-trivial APK size already catches
# the common breakage class.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *' # nightly, off the top of the hour

permissions:
  contents: read

env:
  GODOT_VERSION: 4.6-stable
  GODOT_DIR: /tmp/godot
  ANDROID_SDK_ROOT: /tmp/android-sdk

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17 (required by apksigner/build-tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot headless
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$GODOT_DIR"
          chmod +x "$GODOT_DIR/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64"

      - name: Cache Godot export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ env.GODOT_VERSION }}

      - name: Install Godot export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/4.6.stable

      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Configure Godot editor settings (SDK paths + debug keystore)
        run: |
          keytool -genkeypair -keystore /tmp/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES

      - name: Export debug APK (proves the Android export pipeline)
        run: |
          mkdir -p export/android
          "$GODOT_DIR/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64" --headless --export-debug "Android" export/android/armored-archer.apk

      - name: Assert APK exists and is non-trivial
        run: |
          APK=export/android/armored-archer.apk
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: ${SIZE} bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::APK is suspiciously small (${SIZE} bytes) - export likely incomplete"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: armored-archer-debug-apk
          path: export/android/armored-archer.apk
          retention-days: 7
          if-no-files-found: error

  # Issue #1662 step 3: boot the exported APK in an emulator and assert the
  # engine comes up. The export presets ship arm-only APKs (armeabi-v7a +
  # arm64-v8a; x86/x86_64 disabled), so this job runs an arm64-v8a emulator
  # image under software emulation on the x86_64 host - slow boot (minutes,
  # not seconds) is expected and budgeted in the job timeout. Assertions:
  # process alive after a generous settle window + Godot engine banner in
  # logcat. An autoload crash on a device-only path kills the process and
  # fails the alive check. A boot screenshot is uploaded for human review.
  # A game-side boot marker print would be a stronger assertion; that is a
  # production code change and deliberately not bundled with this CI job.
  # First nightly run (Oct 20) hit "Timeout waiting for emulator to boot"
  # after 30m: the software-emulated arm64 image never booted on the x86_64
  # runner, so the job failed before touching the APK. Non-blocking until a
  # KVM-capable path exists, so a red main reflects real regressions only.
  # Check the job log for the screenshot and boot result by hand.
  boot-smoke:
    runs-on: ubuntu-latest
    needs: export
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v7
        with:
          name: armored-archer-debug-apk
          path: export/android

      - name: Enable KVM (best effort; arm images fall back to software emulation)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot APK in arm64 emulator and assert engine startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          disable-animations: true
          emulator-boot-timeout: 1800
          script: |
            set -e
            adb shell input keyevent 82 || true
            adb install -r export/android/armored-archer.apk
            adb logcat -c
            adb shell am start -n com.armoredarcher.game/com.godot.game.GodotApp
            echo "Launched; settling under software emulation..."
            sleep 120
            if ! adb shell pidof com.armoredarcher.game > /tmp/game.pid || [ ! -s /tmp/game.pid ]; then
              echo "::error::Game process not running 120s after launch (autoload crash on device path?)"
              adb logcat -d | tail -150
              exit 1
            fi
            echo "Game process alive: $(cat /tmp/game.pid)"
            if ! adb logcat -d | grep -q "Godot Engine v4.6"; then
              echo "::error::Godot engine banner not found in logcat"
              adb logcat -d | tail -150
              exit 1
            fi
            echo "Godot engine banner confirmed in logcat"
            adb exec-out screencap -p > boot-smoke.png

      - name: Upload boot screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-boot-smoke-screenshot
          path: boot-smoke.png
          retention-days: 7
          if-no-files-found: warn
