name: Benchmark Regression

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

# Issue #1031 re-baseline: the previous pipeline ran `go test -bench` via
# scripts/benchmark-tests.sh against the abandoned (and deleted) Go backend,
# compared with benchstat against backend/tests/benchmarks/baseline.txt, and
# pushed baseline updates from this workflow (hence the old contents: write).
# The TypeScript replacement gate is the self-contained performance-threshold
# suite backend/tests/integration/low_end_device_performance.test.ts, which
# needs no services. The Go baseline files (baseline.txt, compare.sh, new.txt)
# no longer exist; stack-dependent perf smoke tests remain covered by the
# integration job in ci.yml.
permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark Regression Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run benchmark suite
        env:
          SLOW_TEST_THRESHOLD: 100
        working-directory: backend
        run: npm run test:benchmark

      - name: Benchmark summary
        if: always()
        run: |
          echo "## Benchmark Regression Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Performance threshold suite passed (low_end_device_performance)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Baseline: Go benchstat baseline retired with the Go backend (issue #1031)." >> $GITHUB_STEP_SUMMARY
