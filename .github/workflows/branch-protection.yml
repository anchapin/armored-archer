name: Configure Branch Protection

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to protect'
        required: true
        default: 'main'
      require_reviews:
        description: 'Require pull request reviews'
        required: false
        default: 'true'
        type: boolean
      require_status_checks:
        description: 'Require status checks to pass'
        required: false
        default: 'true'
        type: boolean
      require_code_owner_reviews:
        description: 'Require code owner reviews'
        required: false
        default: 'false'
        type: boolean

jobs:
  configure-branch-protection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure branch protection
        env:
          BRANCH: ${{ github.event.inputs.branch || 'main' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REQUIRE_REVIEWS: ${{ github.event.inputs.require_reviews }}
          REQUIRE_STATUS_CHECKS: ${{ github.event.inputs.require_status_checks }}
          REQUIRE_CODE_OWNER_REVIEWS: ${{ github.event.inputs.require_code_owner_reviews }}
        run: |
          echo "Configuring branch protection for branch: $BRANCH"
          echo "Repository: $REPO"
          echo ""
          echo "Branch Protection Configuration:"
          echo "================================="
          echo "- Require pull request reviews: $REQUIRE_REVIEWS"
          echo "- Require status checks to pass: $REQUIRE_STATUS_CHECKS"
          echo "- Require code owner reviews: $REQUIRE_CODE_OWNER_REVIEWS"
          echo ""
          
          # Check if we can configure branch protection
          # Note: Branch protection requires GitHub Pro for private user repositories
          # or GitHub Team for organization repositories
          
          # Get current protection status
          PROTECTION_RESPONSE=$(gh api repos/$REPO/branches/$BRANCH/protection 2>&1)
          
          if echo "$PROTECTION_RESPONSE" | grep -q '"message".*"Upgrade to GitHub Pro"'; then
            echo "::warning::Branch protection requires GitHub Pro for private user repositories"
            echo ""
            echo "To enable branch protection:"
            echo "1. Upgrade to GitHub Pro, OR"
            echo "2. Transfer this repository to an organization"
            echo ""
            echo "Alternatively, you can manually configure branch protection at:"
            echo "https://github.com/$REPO/settings/branches"
            exit 0
          elif echo "$PROTECTION_RESPONSE" | grep -q '"message".*"Not Found"'; then
            echo "::warning::Branch not found or protection not yet configured"
          fi
          
          # Configure branch protection via API
          # Build the protection JSON
          PROTECTION_JSON='{
            "required_status_checks": null,
            "enforce_admins": true,
            "required_review_dismissal_restrictions": [],
            "require_code_owner_reviews": $REQUIRE_CODE_OWNER_REVIEWS,
            "require_up_to_date_branches": false,
            "required_linear_history": false,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_conversation_resolution": true
          }'
          
          if [ "$REQUIRE_STATUS_CHECKS" = "true" ]; then
            PROTECTION_JSON=$(echo "$PROTECTION_JSON" | jq '.required_status_checks = {
              "strict_required_status_checks": false,
              "contexts": [],
              "checks": []
            }')
          fi
          
          echo "Applying branch protection configuration..."
          echo "Configuration:"
          echo "$PROTECTION_JSON" | jq '.'
          
          # Apply the protection (this will fail without proper permissions)
          RESPONSE=$(gh api -X PUT repos/$REPO/branches/$BRANCH/protection \
            -F strict=true \
            -F required_status_checks.strict=false \
            -F require_code_owner_reviews=$REQUIRE_CODE_OWNER_REVIEWS \
            -F require_conversation_resolution=true \
            -F enforce_admins=true \
            2>&1)
          
          if echo "$RESPONSE" | grep -q '"message"'; then
            echo "::warning::Could not apply branch protection"
            echo "Response: $RESPONSE"
          else
            echo "✓ Branch protection configured successfully"
          fi
      
      - name: Create branch protection documentation
        run: |
          cat > BRANCH_PROTECTION.md << 'EOF'
          # Branch Protection Rules

          This document describes the branch protection rules configured for this repository.

          ## Protected Branches

          - `main` (default branch)

          ## Protection Requirements

          ### Pull Request Reviews
          - Require at least 1 pull request review before merging
          - Dismiss stale reviews when new commits are pushed
          - Require review from code owners (optional, configurable)

          ### Status Checks
          - Require all status checks to pass before merging
          - Require branches to be up to date with base branch

          ### Other Protections
          - Require conversation resolution before merging
          - Include administrators in protection rules
          - Prevent force pushes
          - Prevent branch deletion

          ## Manual Configuration

          If automatic configuration is not available (e.g., requires GitHub Pro),
          you can configure branch protection manually at:
          
          https://github.com/${{ github.repository }}/settings/branches

          ## Configuration Workflow

          This repository includes a GitHub Actions workflow (`branch-protection.yml`)
          that can be run manually to configure branch protection rules.
          
          To run the workflow:
          1. Go to the Actions tab
          2. Select "Configure Branch Protection"
          3. Click "Run workflow"
          4. Select the branch to protect and configuration options
          5. Click "Run workflow"

          ## Requirements

          - **Public repositories**: Free (all features available)
          - **Private repositories**: Requires GitHub Pro or higher
          - **Organization repositories**: Requires GitHub Team or higher
          EOF
          
          echo "Branch protection documentation created: BRANCH_PROTECTION.md"

      - name: Show configuration status
        run: |
          echo ""
          echo "============================================"
          echo "Branch Protection Configuration Summary"
          echo "============================================"
          echo ""
          echo "Repository: ${{ github.repository }}"
          echo "Branch: main"
          echo ""
          echo "Required Settings:"
          echo "  ✓ Require pull request reviews before merging"
          echo "  ✓ Require status checks to pass"
          echo "  ✓ Require code owner reviews (configurable)"
          echo "  ✓ Require conversation resolution"
          echo "  ✓ Prevent force pushes"
          echo "  ✓ Include administrators in protection"
          echo ""
          echo "For manual configuration, visit:"
          echo "https://github.com/${{ github.repository }}/settings/branches"
