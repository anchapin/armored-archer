name: Branch Protection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Block direct pushes to main - require PR
  check-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Block direct push to main
        run: |
          echo "❌ Direct push to 'main' is not allowed."
          echo "Please create a pull request instead."
          echo "Learn more: https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests"
          exit 1

  # Require PR reviews
  require-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR exists
        run: |
          if [ -z "${{ github.event.pull_request.number }}" ]; then
            echo "❌ No PR associated with this event"
            exit 1
          fi
          echo "✅ PR detected: #${{ github.event.pull_request.number }}"
          
      - name: Check PR has reviews (approvals)
        run: |
          echo "Note: This workflow helps enforce PR reviews but cannot fully replace GitHub's native branch protection."
          echo "For full branch protection, consider upgrading to GitHub Pro or making the repository public."
          echo "✅ PR workflow triggered - ensure your PR is reviewed before merging"

  # Run CI checks on PRs
  ci-check:
    if: github.event_name == 'pull_request'
    needs: require-pr
    runs-on: ubuntu-latest
    steps:
      - name: CI check placeholder
        run: |
          echo "Running CI checks..."
          # The main CI workflow (ci.yml) will run automatically
          # This job ensures PR checks are enforced
