# Dead Feature Flag Detection Workflow
# 
# This workflow runs dead feature flag detection to identify unused or deprecated feature flags.
# Dead feature flags increase maintenance burden and can indicate technical debt.

name: Dead Feature Flag Detection

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays
  workflow_dispatch:
    inputs:
      ci_mode:
        description: 'Run in CI mode (strict)'
        required: false
        default: 'false'
        type: boolean

jobs:
  detect-dead-flags:
    name: Detect Dead Feature Flags
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd backend
          npm ci
      
      - name: Run Dead Feature Flag Detection
        id: detection
        run: |
          cd backend
          
          # Run the detection script
          if [ "${{ github.event.inputs.ci_mode }}" == "true" ]; then
            npm run detect-dead-flags:ci
          else
            npm run detect-dead-flags
          fi
        continue-on-error: true
      
      - name: Generate Report
        if: always()
        run: |
          cd backend
          
          # Create markdown report
          cat > dead-flags-report.md << 'EOF'
          # Dead Feature Flag Detection Report
          
          ## Summary
          
          This report identifies unused or deprecated feature flags in the codebase.
          
          ## Detection Results
          
          | Flag Name | Status | Last Used |
          |-----------|--------|-----------|
          EOF
          
          # Check if results exist
          if [ -f .dead-flags-results.json ]; then
            cat .dead-flags-results.json >> dead-flags-report.md
          else
            echo "No dead flags detected or results file not found" >> dead-flags-report.md
          fi
          
          cat dead-flags-report.md
      
      - name: Post results to GitHub
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const detectionResults = fs.existsSync('backend/.dead-flags-results.json') 
              ? JSON.parse(fs.readFileSync('backend/.dead-flags-results.json', 'utf8'))
              : { deadFlags: [], totalFlags: 0 };
            
            const deadCount = detectionResults.deadFlags?.length || 0;
            const totalCount = detectionResults.totalFlags || 0;
            
            // Create PR comment
            const body = '## 🔍 Dead Feature Flag Detection Results\n\n' +
              '**Total Flags:** ' + totalCount + '\n' +
              '**Dead Flags:** ' + deadCount + '\n\n' +
              (deadCount > 0 ? '⚠️ Dead feature flags detected - review and clean up unused flags' : '✅ No dead feature flags detected') + '\n\n' +
              'Run this workflow manually to force re-scan.';
            
            console.log(body);
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dead-flags-report
          path: |
            backend/dead-flags-report.md
            backend/.dead-flags-results.json
          retention-days: 30
      
      - name: Fail if dead flags found (CI mode)
        if: github.event.inputs.ci_mode == 'true' && steps.detection.outcome == 'failure'
        run: exit 1
