name: Deployment Observability

on:
  workflow_run:
    workflows: [CD]
    types: [completed]
    branches: [main]
  schedule:
    # Run health checks every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

# Permissions for deployment monitoring
permissions:
  contents: read
  issues: write
  # Required for Datadog integration
  deployments: write

# secrets.GITHUB_TOKEN is automatically available
# Add these secrets in your repository settings:
# DATADOG_API_KEY - Datadog API key for metrics submission
# DATADOG_APP_KEY - Datadog Application key

jobs:
  monitor-deployment:
    name: Monitor Deployment Health
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    outputs:
      deployment_status: ${{ steps.health_check.outputs.status }}
      services_healthy: ${{ steps.health_check.outputs.services_healthy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get deployment info
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            // Get the most recent successful deployment
            const deployments = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'production',
              per_page: 1
            });
            
            if (deployments.data.length > 0) {
              const deployment = deployments.data[0];
              core.setOutput('deployment_id', deployment.id);
              core.setOutput('deployment_sha', deployment.sha);
              core.setOutput('created_at', deployment.created_at);
              console.log('Latest deployment:', deployment.id, 'at', deployment.created_at);
            } else {
              console.log('No deployments found');
            }

      - name: Check deployment status
        id: health_check
        run: |
          echo "=== Deployment Health Check ==="
          echo "Environment: production"
          echo "Deployment ID: ${{ steps.deployment.outputs.deployment_id }}"
          echo "Commit: ${{ steps.deployment.outputs.deployment_sha }}"
          echo ""
          
          # Check if this is a recent deployment (within last hour)
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            WORKFLOW_CREATED="${{ github.event.workflow_run.created_at }}"
            echo "Workflow run created: $WORKFLOW_CREATED"
          fi
          
          # Mock health check (in production, would check actual endpoints)
          echo "status=healthy" >> $GITHUB_OUTPUT
          echo "services_healthy=true" >> $GITHUB_OUTPUT

      - name: Record deployment metrics
        run: |
          mkdir -p .deployment-metrics
          
          # Create deployment health record
          TIMESTAMP=$(date -Iseconds)
          
          cat > .deployment-metrics/health-$(date +%Y%m%d).json << EOF
          {
            "timestamp": "$TIMESTAMP",
            "environment": "production",
            "deployment_id": "${{ steps.deployment.outputs.deployment_id }}",
            "commit": "${{ steps.deployment.outputs.deployment_sha }}",
            "status": "${{ steps.health_check.outputs.status }}",
            "services_healthy": ${{ steps.health_check.outputs.services_healthy }},
            "workflow_run_id": "${{ github.event.workflow_run.id }}"
          }
          EOF
          
          echo "Health check recorded for $(date)"

      - name: Commit health metrics
        run: |
          git config --local user.email "openhands@all-hands.dev"
          git config --local user.name "OpenHands"
          git add .deployment-metrics/
          git diff --staged --quiet || git commit -m "docs: Update deployment health metrics"

      - name: Submit metrics to Datadog
        if: success()
        run: |
          # Submit deployment metrics to Datadog if API key is available
          if [ -n "${{ secrets.DATADOG_API_KEY }}" ]; then
            echo "Submitting deployment metrics to Datadog..."
            
            # Submit custom metric for deployment status
            curl -s -X POST "https://api.datadoghq.com/api/v1/series" \
              -H "Content-Type: application/json" \
              -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
              -H "DD-APPLICATION-KEY: ${{ secrets.DATADOG_APP_KEY }}" \
              -d @- << EOF
            {
              "series": [
                {
                  "metric": "deployment.health.status",
                  "points": [[$(date +%s), 1]],
                  "type": "gauge",
                  "tags": ["environment:production", "deployment_id:${{ steps.deployment.outputs.deployment_id }}"]
                }
              ]
            }
            EOF
            echo "Metrics submitted to Datadog"
          else
            echo "Datadog API key not configured - skipping metrics submission"
          fi

  scheduled-health-check:
    name: Scheduled Health Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run health check
        id: health
        run: |
          echo "=== Scheduled Health Check ==="
          echo "Time: $(date)"
          echo "Environment: Production"
          
          # In production, this would check:
          # - API endpoint availability
          # - Database connectivity
          # - External service status
          # - SSL certificate validity
          
          # For now, simulate checks
          CHECKS_PASSED=true
          
          # Simulated checks
          echo "✓ API Health: OK"
          echo "✓ Database: OK" 
          echo "✓ External Services: OK"
          echo "✓ SSL Certificate: Valid"
          
          if [ "$CHECKS_PASSED" == "true" ]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          fi

      - name: Update health status
        if: always()
        run: |
          mkdir -p .deployment-metrics
          
          STATUS="${{ steps.health.outputs.status }}"
          if [ -z "$STATUS" ]; then
            STATUS="unknown"
          fi
          
          # Record health check result
          echo "{\"timestamp\": \"$(date -Iseconds)\", \"status\": \"$STATUS\"}" >> .deployment-metrics/scheduled-health.log
          
          # Create status badge (would be used in production)
          echo "# Deployment Health" > .deployment-metrics/HEALTH.md
          echo "" >> .deployment-metrics/HEALTH.md
          echo "Last Check: $(date)" >> .deployment-metrics/HEALTH.md
          echo "" >> .deployment-metrics/HEALTH.md
          echo "| Service | Status |" >> .deployment-metrics/HEALTH.md
          echo "|---------|--------|" >> .deployment-metrics/HEALTH.md
          echo "| API | $STATUS |" >> .deployment-metrics/HEALTH.md
          echo "| Database | $STATUS |" >> .deployment-metrics/HEALTH.md
          echo "| External Services | $STATUS |" >> .deployment-metrics/HEALTH.md
          
          cat .deployment-metrics/HEALTH.md

      - name: Alert on unhealthy status
        if: steps.health.outputs.status == 'unhealthy'
        run: |
          echo "::warning::Scheduled health check failed!"
          
          # Create issue for unhealthy deployment
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d '{
              "title": "[Health Alert] Deployment unhealthy",
              "body": "## Deployment Health Alert\n\nScheduled health check detected issues.\n\n- **Time:** $(date)\n- **Environment:** Production\n- **Status:** Unhealthy\n\nPlease investigate immediately.",
              "labels": ["deployment", "health", "alert"]
            }'

  deployment-metrics-aggregation:
    name: Aggregate Deployment Metrics
    needs: monitor-deployment
    runs-on: ubuntu-latest
    if: |
      needs.monitor-deployment.outputs.deployment_status == 'healthy' ||
      github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aggregate metrics
        run: |
          mkdir -p .deployment-metrics
          
          # Calculate uptime from health logs
          if [ -f .deployment-metrics/scheduled-health.log ]; then
            TOTAL_CHECKS=$(wc -l < .deployment-metrics/scheduled-health.log)
            HEALTHY_CHECKS=$(grep -c '"healthy"' .deployment-metrics/scheduled-health.log || echo 0)
            
            if [ "$TOTAL_CHECKS" -gt 0 ]; then
              UPTIME=$(echo "scale=2; $HEALTHY_CHECKS / $TOTAL_CHECKS * 100" | bc)
              echo "Deployment Uptime: ${UPTIME}%"
              
              # Create uptime report
              cat > .deployment-metrics/UPTIME.md << EOF
              # Deployment Uptime Report
              
              ## Summary
              
              | Metric | Value |
              |--------|-------|
              | Total Checks | $TOTAL_CHECKS |
              | Healthy Checks | $HEALTHY_CHECKS |
              | Uptime | ${UPTIME}% |
              
              ## Status
              
              EOF
              
              if (( $(echo "$UPTIME >= 99.9" | bc -l) )); then
                echo "✅ **Excellent** - Above 99.9% uptime target" >> .deployment-metrics/UPTIME.md
              elif (( $(echo "$UPTIME >= 99.0" | bc -l) )); then
                echo "⚠️ **Good** - Meeting minimum 99% target" >> .deployment-metrics/UPTIME.md
              else
                echo "❌ **Needs Attention** - Below 99% uptime" >> .deployment-metrics/UPTIME.md
              fi
              
              cat .deployment-metrics/UPTIME.md
            fi
          else
            echo "No health check data available yet"
          fi

      - name: Commit aggregated metrics
        run: |
          git config --local user.email "openhands@all-hands.dev"
          git config --local user.name "OpenHands"
          git add .deployment-metrics/
          git diff --staged --quiet || git commit -m "docs: Update deployment metrics"

  generate-deployment-dashboard:
    name: Generate Deployment Dashboard
    needs: [monitor-deployment, scheduled-health-check, deployment-metrics-aggregation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate dashboard
        run: |
          mkdir -p .deployment-metrics
          
          # Get current status
          DEPLOYMENT_STATUS="${{ needs.monitor-deployment.outputs.deployment_status }}"
          if [ -z "$DEPLOYMENT_STATUS" ]; then
            DEPLOYMENT_STATUS="unknown"
          fi
          
          # Generate dashboard
          cat > .deployment-metrics/OBSERVABILITY.md << EOF
          # Deployment Observability Dashboard
          
          ## Current Status
          
          | Environment | Status | Last Check |
          |-------------|--------|------------|
          | Production | $DEPLOYMENT_STATUS | $(date) |
          | Staging | healthy | $(date) |
          
          ## Deployment Metrics
          
          ### Recent Deployments
          
          | Date | Commit | Environment | Status |
          |------|--------|-------------|--------|
          EOF
          
          # Add recent deployments (would query GitHub API in production)
          echo "| $(date +%Y-%m-%d) | $(git rev-parse --short HEAD) | production | $DEPLOYMENT_STATUS |" >> .deployment-metrics/OBSERVABILITY.md
          
          cat >> .deployment-metrics/OBSERVABILITY.md << 'EOF'
          
          ## Health Checks
          
          - ✅ API Endpoint
          - ✅ Database Connection
          - ✅ External Services
          - ✅ SSL Certificate
          
          ## Alerts
          
          No active alerts.
          
          ---
          *Updated: $(date)*
          EOF
          
          cat .deployment-metrics/OBSERVABILITY.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-observability
          path: .deployment-metrics/
          retention-days: 30

      - name: Update Grafana Dashboard
        if: always()
        run: |
          # Update Grafana dashboard if credentials are available
          if [ -n "${{ secrets.GRAFANA_API_KEY }}" ] && [ -n "${{ secrets.GRAFANA_URL }}" ]; then
            echo "Updating Grafana dashboard..."
            
            # In production, this would use Grafana API to update dashboard annotations
            # POST to /api/annotations with deployment info
            
            curl -s -X POST "${{ secrets.GRAFANA_URL }}/api/annotations" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
              -d @- << EOF
            {
              "time": $(date +%s)000,
              "timeEnd": $(($(date +%s) + 300))000,
              "tags": ["deployment", "github-actions"],
              "text": "Deployment status: ${{ needs.monitor-deployment.outputs.deployment_status }}"
            }
            EOF
            echo "Grafana dashboard updated"
          else
            echo "Grafana credentials not configured - skipping dashboard update"
          fi

  manual-health-check:
    name: Manual Health Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Run manual health check
        run: |
          echo "=== Manual Health Check ==="
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Time: $(date)"
          
          # In production, perform actual health checks
          # - API endpoint: GET /health
          # - Database: Test connection
          # - External services: Check availability
          
          echo ""
          echo "Running health checks for ${{ github.event.inputs.environment }}..."
          
          # Mock results
          echo "✅ API: Healthy"
          echo "✅ Database: Healthy"
          echo "✅ Cache: Healthy"
          echo "✅ Queue: Healthy"
          echo "✅ External APIs: Healthy"
          
          echo ""
          echo "All systems operational"

      - name: Create health check report
        run: |
          mkdir -p .deployment-metrics
          
          cat > .deployment-metrics/health-check-${{ github.event.inputs.environment }}-$(date +%Y%m%d-%H%M%S).json << EOF
          {
            "timestamp": "$(date -Iseconds)",
            "environment": "${{ github.event.inputs.environment }}",
            "status": "healthy",
            "checks": {
              "api": "healthy",
              "database": "healthy",
              "cache": "healthy",
              "queue": "healthy",
              "external_apis": "healthy"
            }
          }
          EOF
          
          echo "Health check report created"
