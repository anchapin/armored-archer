name: DAST

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Nakama and PostgreSQL
        working-directory: ./backend
        run: |
          docker-compose up -d postgres
          
      - name: Wait for PostgreSQL
        working-directory: ./backend
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          until docker-compose exec -T postgres pg_isready -U postgres -d nakama; do
            echo "PostgreSQL is not ready yet..."
            sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Build TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Start Nakama server
        working-directory: ./backend
        run: |
          docker-compose up -d nakama
          
      - name: Wait for Nakama
        run: |
          echo "Waiting for Nakama to be ready..."
          until curl -s http://localhost:7350 > /dev/null; do
            echo "Nakama is not ready yet..."
            sleep 2
          done
          echo "Nakama is ready!"

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:7350'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: OWASP ZAP Full Scan
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: 'http://localhost:7350'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop services
        if: always()
        working-directory: ./backend
        run: docker-compose down
