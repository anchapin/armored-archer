name: DAST

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Nakama and PostgreSQL
        working-directory: ./backend
        run: |
          docker-compose up -d postgres
          
      - name: Wait for PostgreSQL
        working-directory: ./backend
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker-compose exec -T postgres pg_isready -U postgres -d nakama 2>/dev/null; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            echo "PostgreSQL is not ready yet (attempt $i/30)..."
            sleep 2
          done
          echo "PostgreSQL failed to start, showing logs:"
          docker-compose logs postgres
          exit 1

      - name: Build TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Start Nakama server
        working-directory: ./backend
        run: |
          docker-compose up -d nakama
          
      - name: Wait for Nakama
        run: |
          echo "Waiting for Nakama to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:7350 > /dev/null 2>&1; then
              echo "Nakama is ready!"
              exit 0
            fi
            echo "Nakama is not ready yet (attempt $i/60)..."
            sleep 2
          done
          echo "Nakama failed to start, showing logs:"
          docker-compose logs nakama
          exit 1

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:7350'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: OWASP ZAP Full Scan
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: 'http://localhost:7350'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop services
        if: always()
        working-directory: ./backend
        run: docker-compose down
