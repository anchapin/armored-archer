name: Secret Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Merge parents must not be shallow roots: that turns a diff scan
          # into an apparent addition of the second parent's entire file tree.
          fetch-depth: 0

      # When this workflow runs on a push to the default branch, `base`
      # (default_branch) and `head` (HEAD) collapse to the same SHA and
      # TruffleHog exits with an error. Resolve the diff range explicitly:
      # use HEAD~1 as base on push-to-default-branch, leave TruffleHog's
      # default resolution in place for PRs and other pushes.
      - name: Resolve diff range
        id: diff-range
        run: |
          if [ "${{ github.event_name }}" = "push" ] && \
             [ "${{ github.event.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
              echo "head=HEAD" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Root commit detected; skipping secret scan (no diff range)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "base=refs/remotes/origin/${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          fi

      # Metadata only. Never print patch contents or scanner candidate values.
      - name: Record scan range metadata
        if: steps.diff-range.outputs.skip != 'true'
        env:
          SCAN_BASE: ${{ steps.diff-range.outputs.base }}
          SCAN_HEAD: ${{ steps.diff-range.outputs.head }}
        run: |
          base_sha=$(git rev-parse --verify "${SCAN_BASE}^{commit}")
          head_sha=$(git rev-parse --verify "${SCAN_HEAD}^{commit}")
          merge_base=$(git merge-base "$base_sha" "$head_sha")
          printf 'shallow=%s\nbase=%s\nhead=%s\nmerge_base=%s\n' \
            "$(git rev-parse --is-shallow-repository)" "$base_sha" "$head_sha" "$merge_base"
          printf 'range_commits=%s\n' "$(git rev-list --count "$head_sha" "^$merge_base")"
          printf 'range_changed_paths=%s\n' \
            "$(git diff --name-only -z "$merge_base" "$head_sha" | tr -cd '\0' | wc -c)"

      - name: Run TruffleHog
        if: steps.diff-range.outputs.skip != 'true'
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          # The pinned action otherwise defaults its runtime image to latest.
          # The action constructs IMAGE:VERSION; tag@digest pins that image.
          version: '3.99.9@sha256:2ec535840f860aa27f11fee20222fb790326ecd66325c96bd49d02ec6af46eca'
          base: ${{ steps.diff-range.outputs.base }}
          head: ${{ steps.diff-range.outputs.head }}
