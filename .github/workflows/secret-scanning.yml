name: Secret Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # When this workflow runs on a push to the default branch, `base`
      # (default_branch) and `head` (HEAD) collapse to the same SHA and
      # TruffleHog exits with an error. Resolve the diff range explicitly:
      # use HEAD~1 as base on push-to-default-branch, leave TruffleHog's
      # default resolution in place for PRs and other pushes.
      - name: Resolve diff range
        id: diff-range
        run: |
          if [ "${{ github.event_name }}" = "push" ] && \
             [ "${{ github.event.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
              echo "head=HEAD" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Root commit detected; skipping secret scan (no diff range)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "base=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TruffleHog
        if: steps.diff-range.outputs.skip != 'true'
        uses: trufflesecurity/trufflehog@6bd2d14f7a4bc1e569fa3550efa7ec632a4fa67b # main
        with:
          base: ${{ steps.diff-range.outputs.base }}
          head: ${{ steps.diff-range.outputs.head }}
