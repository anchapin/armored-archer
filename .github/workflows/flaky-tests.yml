name: Flaky Test Detection

on:
  schedule:
    # Run flaky test detection weekly on Sunday at 3 AM
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Number of runs per test'
        required: false
        default: '3'
        type: string
      target:
        description: 'Target to test (backend, godot, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - godot

permissions:
  contents: read

jobs:
  flaky-tests-backend:
    name: Backend Flaky Tests (Jest)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'backend') || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run flaky test detection
        working-directory: ./backend
        run: npm run test:flaky
        env:
          FLAKY_RUNS: ${{ github.event.inputs.runs || '3' }}
      
      - name: Generate report
        working-directory: ./backend
        run: npm run test:report
      
      - name: Upload flaky test history
        uses: actions/upload-artifact@v4
        with:
          name: backend-flaky-history
          path: backend/data/flaky-test-history.json
          retention-days: 30
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: backend-flaky-report
          path: docs/flaky-tests-report.md
          retention-days: 30

  flaky-tests-godot:
    name: Godot Flaky Tests (GDScript)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'godot') || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      # Issue #1375: notifiarr/godot-action was removed from GitHub
      # (##[error]Unable to resolve action notifiarr/godot-action, repository not found).
      # Download the 4.6-stable headless binary directly and put it on PATH —
      # matches the convention used by coverage.yml / test.yml / benchmark-regression.yml
      # / visual-regression.yml. detect_godot_flaky_tests.py defaults to `godot4`
      # from PATH, so no flag changes are needed in the run step below.
      - name: Setup Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          mv Godot_v4.6-stable_linux.x86_64 godot4
          rm godot.zip
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run flaky test detection
        run: |
          python3 scripts/detect_godot_flaky_tests.py --runs=${{ github.event.inputs.runs || '3' }}
        shell: bash
      
      - name: Upload flaky test history
        uses: actions/upload-artifact@v4
        with:
          name: godot-flaky-history
          path: data/godot-flaky-test-history.json
          retention-days: 30

  flaky-tests-summary:
    name: Flaky Test Summary
    runs-on: ubuntu-latest
    needs: [flaky-tests-backend, flaky-tests-godot]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Generate summary
        run: |
          echo "## Flaky Test Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check backend results
          if [ -f "artifacts/backend-flaky-report/flaky-tests-report.md" ]; then
            echo "### Backend (Jest)" >> $GITHUB_STEP_SUMMARY
            cat "artifacts/backend-flaky-report/flaky-tests-report.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "Backend: No report available" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Godot (GDScript)" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "artifacts/godot-flaky-history/godot-flaky-test-history.json" ]; then
            FLAKY_COUNT=$(python3 -c "import json; data=json.load(open('artifacts/godot-flaky-history/godot-flaky-test-history.json')); print(sum(1 for t in data.values() if t.get('failureRate', 0) > 0))")
            echo "Flaky tests found: $FLAKY_COUNT" >> $GITHUB_STEP_SUMMARY
          else
            echo "No flaky tests detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed reports in the artifacts."
