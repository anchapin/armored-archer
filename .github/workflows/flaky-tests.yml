# Flaky Test Detection
# Detects flaky tests via 3x retry logic and notifies developers
name: Flaky Test Detection
on:
  schedule:
    - cron: '0 3 * * 0'  # Sunday 3 AM
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  flaky-tests-backend:
    name: Backend (Go) Flaky Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run flaky test detection
        working-directory: ./backend
        run: |
          bash ../scripts/detect-go-flaky-tests.sh 3 0.33
      - name: Upload flaky test results
        uses: actions/upload-artifact@v4
        with:
          name: go-flaky-tests
          path: data/go-flaky-tests.json
          retention-days: 30

  flaky-tests-godot:
    name: Frontend (Godot) Flaky Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v1
        with:
          version: '4.3'
          platform: 'linux'
      - name: Run flaky test detection
        run: |
          python3 scripts/detect-godot-flaky-tests.py --runs=3 --threshold=0.33
      - name: Upload flaky test results
        uses: actions/upload-artifact@v4
        with:
          name: godot-flaky-tests
          path: data/godot-flaky-tests.json
          retention-days: 30

  notify-flaky-prs:
    name: Notify Flaky Tests
    runs-on: ubuntu-latest
    needs: [flaky-tests-backend, flaky-tests-godot]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          path: data
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let goFlaky = [];
            let godotFlaky = [];
            try {
              const goData = JSON.parse(fs.readFileSync('data/go-flaky-tests/go-flaky-tests.json', 'utf8'));
              goFlaky = goData.flaky_tests || [];
            } catch(e) {
              console.log('No Go flaky tests found');
            }
            try {
              const godotData = JSON.parse(fs.readFileSync('data/godot-flaky-tests/godot-flaky-tests.json', 'utf8'));
              godotFlaky = Object.keys(godotData.flaky_tests || {});
            } catch(e) {
              console.log('No Godot flaky tests found');
            }
            if (goFlaky.length === 0 && godotFlaky.length === 0) {
              console.log('No flaky tests detected');
              return;
            }
            let body = '## ⚠️ Flaky Tests Detected\n\n';
            body += 'The following tests were identified as flaky (failure rate >= 33%):\n\n';
            if (goFlaky.length > 0) {
              body += '### Backend (Go)\n';
              goFlaky.forEach(t => {
                body += `- \`${t.name}\`: ${(t.failure_rate * 100).toFixed(0)}% failure rate (${t.failures}/${t.runs} runs)\n`;
              });
              body += '\n';
            }
            if (godotFlaky.length > 0) {
              body += '### Frontend (Godot)\n';
              const godotData = JSON.parse(fs.readFileSync('data/godot-flaky-tests/godot-flaky-tests.json', 'utf8'));
              godotFlaky.forEach(t => {
                const info = godotData.flaky_tests[t];
                body += `- \`${t}\`: ${(info.failure_rate * 100).toFixed(0)}% failure rate (${info.failures}/${info.runs} runs)\n`;
              });
              body += '\n';
            }
            body += '---\n';
            body += '### Next Steps\n';
            body += '1. Investigate the root cause of test flakiness\n';
            body += '2. Fix the test or the underlying issue\n';
            body += '3. Run detection again to verify the fix\n';
            body += '\n';
            body += '---\n';
            body += '### Quarantine Status\n\n';
            body += 'Flaky tests will be automatically quarantined on main branch push.\n';
            body += 'Quarantine registry: data/flaky-test-quarantine.json\n';
            body += '\n';
            body += '_This comment was automatically generated by the flaky test detection workflow._';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  generate-dashboard:
    name: Generate Flaky Test Dashboard
    runs-on: ubuntu-latest
    needs: [flaky-tests-backend, flaky-tests-godot]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          path: data
      - name: Generate dashboard
        run: |
          python3 scripts/generate-flaky-dashboard.py
      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: flaky-dashboard
          path: docs/flaky-tests-dashboard.md
          retention-days: 30

  auto-quarantine:
    name: Auto-Quarantine Flaky Tests
    runs-on: ubuntu-latest
    needs: [flaky-tests-backend, flaky-tests-godot]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc

      - name: Download flaky test results
        uses: actions/download-artifact@v4
        with:
          path: data

      - name: Auto-quarantine flaky tests
        run: |
          bash scripts/mark-flaky-tests.sh

      - name: Commit quarantine changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/**/*_test.go data/flaky-test-quarantine.json
          git diff --staged --quiet || git commit -m "chore: quarantine flaky tests

Auto-quarantined by flaky test detection workflow.
Tests that failed >33% of runs in 3 attempts are marked."
          git push
