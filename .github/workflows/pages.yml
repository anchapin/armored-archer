name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Skip until GitHub Pages is properly configured to build from this
    # repo via Actions. The "Get Pages site failed" error means Pages is
    # not yet enabled / not yet wired to the GitHub Actions source. The
    # Pages configuration must be done at the repo or org level (Settings
    # → Pages → Build and deployment → GitHub Actions) before this
    # workflow can succeed. See issue tracking the Pages follow-up.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# --- CI Fixes Wave C ---
# REMOVED vars.PAGES_DEPLOY_ENABLED skip-gate on 2026-09-25 (issue #1198).

