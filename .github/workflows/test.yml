name: Test Coverage CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  godot-tests:
    name: Run Godot Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        godot-version: ['4.6']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Godot
        run: |
          # Download Godot headless binary directly
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          mv Godot_v4.6-stable_linux.x86_64 godot4
      
      - name: Run Godot Tests
        run: |
          # Run headless tests using the test runner scene
          # Note: This requires a test scene or headless mode
          # Capture output and check for test failures
          TEST_OUTPUT=$(./godot4 --headless --script test/run_all_tests.gd 2>&1)
          echo "$TEST_OUTPUT"
          
          # Check for test failures in output
          if echo "$TEST_OUTPUT" | grep -q "Failed: [1-9]"; then
            echo "❌ Godot tests failed!"
            exit 1
          fi
          echo "✅ All Godot tests passed"
          
      - name: Check test coverage
        run: |
          # Count test files and estimate coverage
          echo "=== Test Coverage Summary ==="
          echo "Test files: $(ls -1 test/test_*.gd | wc -l)"
          echo "NetworkManager tests: $(grep -c 'func test_' test/test_network_manager.gd)"
          echo "CombatManager tests: $(grep -c 'func test_' test/test_combat_manager.gd)"
          echo "PlayerStatsManager tests: $(grep -c 'func test_' test/test_player_stats_manager.gd)"

  godot-coverage-gate:
    name: Coverage Gate (80% Target)
    runs-on: ubuntu-latest
    needs: godot-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Calculate test coverage
        id: coverage
        run: |
          # Calculate test coverage for critical systems
          # This is a simplified coverage calculation based on function coverage
          
          echo "=== Coverage Analysis for Critical Systems ==="
          
          # Count test functions for each manager
          NETWORK_TESTS=$(grep -c 'func test_' test/test_network_manager.gd 2>/dev/null || echo "0")
          COMBAT_TESTS=$(grep -c 'func test_' test/test_combat_manager.gd 2>/dev/null || echo "0")
          PLAYER_STATS_TESTS=$(grep -c 'func test_' test/test_player_stats_manager.gd 2>/dev/null || echo "0")
          
          echo "NetworkManager tests: $NETWORK_TESTS"
          echo "CombatManager tests: $COMBAT_TESTS"
          echo "PlayerStatsManager tests: $PLAYER_STATS_TESTS"
          
          # Calculate total test count for critical systems
          TOTAL_CRITICAL_TESTS=$((NETWORK_TESTS + COMBAT_TESTS + PLAYER_STATS_TESTS))
          echo "Total critical system tests: $TOTAL_CRITICAL_TESTS"
          
          # Estimate coverage based on number of test functions vs. source code functions
          # This is a rough estimate - actual line coverage would require instrumentation
          NETWORK_SOURCE_FUNCTIONS=$(grep -c 'func ' autoloads/NetworkManager.gd 2>/dev/null || echo "0")
          COMBAT_SOURCE_FUNCTIONS=$(grep -c 'func ' autoloads/CombatManager.gd 2>/dev/null || echo "0")
          PLAYER_STATS_SOURCE_FUNCTIONS=$(grep -c 'func ' autoloads/PlayerStatsManager.gd 2>/dev/null || echo "0")
          
          TOTAL_SOURCE_FUNCTIONS=$((NETWORK_SOURCE_FUNCTIONS + COMBAT_SOURCE_FUNCTIONS + PLAYER_STATS_SOURCE_FUNCTIONS))
          echo "Total source functions in critical systems: $TOTAL_SOURCE_FUNCTIONS"
          
          # Calculate estimated function coverage
          if [ "$TOTAL_SOURCE_FUNCTIONS" -gt "0" ]; then
            COVERAGE_PERCENT=$((TOTAL_CRITICAL_TESTS * 100 / TOTAL_SOURCE_FUNCTIONS))
            echo "Estimated function coverage: $COVERAGE_PERCENT%"
            echo "coverage=$COVERAGE_PERCENT" >> $GITHUB_OUTPUT
          else
            echo "coverage=100" >> $GITHUB_OUTPUT
          fi
      
      - name: Fail if coverage below 80%
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          echo "Current coverage: $COVERAGE%"
          
          if [ "$COVERAGE" -lt 80 ]; then
            echo "❌ Coverage $COVERAGE% is below 80% target!"
            exit 1
          else
            echo "✅ Coverage $COVERAGE% meets 80% target"
          fi

  backend-tests:
    name: Backend Tests with Coverage Gate
    runs-on: ubuntu-latest
    needs: godot-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run tests with coverage
        working-directory: ./backend
        run: |
          # Create test-results directory
          mkdir -p test-results
          
          # Run tests with timing output to JSON
          npm run test:coverage -- --outputFile=test-results/test-results.json
          
          # Display timing summary
          echo ""
          echo "=== Test Performance Summary ==="
          node -e "
            const fs = require('fs');
            try {
              if (fs.existsSync('test-results/test-results.json')) {
                const data = JSON.parse(fs.readFileSync('test-results/test-results.json', 'utf8'));
                const suites = data.testResults || [];
                
                // Collect all test results
                const allTests = suites.flatMap(s => s.assertionResults || []);
                
                // Sort by duration (slowest first)
                const sorted = allTests
                  .filter(t => t.duration)
                  .sort((a, b) => b.duration - a.duration);
                
                console.log('\\nTop 10 Slowest Tests:');
                sorted.slice(0, 10).forEach((t, i) => {
                  console.log(\`  \${i+1}. \${t.fullName}: \${t.duration}ms\`);
                });
                
                const totalTime = sorted.reduce((sum, t) => sum + t.duration, 0);
                const avgTime = sorted.length > 0 ? Math.round(totalTime / sorted.length) : 0;
                console.log(\`\\nTest Execution Statistics:\`);
                console.log(\`  Total tests: \${sorted.length}\`);
                console.log(\`  Total execution time: \${totalTime}ms\`);
                console.log(\`  Average test time: \${avgTime}ms\`);
              }
            } catch (e) {
              console.log('Could not parse test results');
            }
          "
      
      - name: Generate coverage report summary
        id: coverage-summary
        run: |
          echo "=== Backend Coverage Analysis ==="
          
          # Parse coverage from JSON
          if [ -f coverage/coverage-final.json ]; then
            # Get overall coverage percentages
            echo "Overall Coverage:"
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('coverage/coverage-final.json', 'utf8'));
              const totals = data.total;
              console.log('  Statements: ' + totals.stmts.pct + '%');
              console.log('  Branches: ' + totals.branches.pct + '%');
              console.log('  Functions: ' + totals.functions.pct + '%');
              console.log('  Lines: ' + totals.lines.pct + '%');
            "
            
            echo ""
            echo "Critical Systems Coverage:"
            
            # Check combat_system.ts
            if [ -f coverage/src/modules/combat_system.ts ]; then
              echo "  combat_system: $(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('coverage/src/modules/combat_system.ts'));console.log(d.stmts.pct+'%')")"
            else
              echo "  combat_system: (not tracked)"
            fi
            
            # Check rpg_system.ts (PlayerStatsManager backend)
            if [ -f coverage/src/modules/rpg_system.ts ]; then
              echo "  rpg_system (PlayerStats): $(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('coverage/src/modules/rpg_system.ts'));console.log(d.stmts.pct+'%')")"
            fi
            
            # Check matchmaker.ts (Network auth related)
            if [ -f coverage/src/modules/matchmaker.ts ]; then
              echo "  matchmaker (Network): $(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('coverage/src/modules/matchmaker.ts'));console.log(d.stmts.pct+'%')")"
            fi
          fi
      
      - name: Check coverage thresholds
        working-directory: ./backend
        run: |
          echo "=== Coverage Threshold Check ==="
          
          # Use the configured thresholds from jest.config.js
          # The Jest config has been set up with appropriate thresholds for this codebase
          # This runs npm run test:coverage which will fail if thresholds aren't met
          
          # Parse coverage from JSON for reporting
          if [ -f coverage/coverage-final.json ]; then
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('coverage/coverage-final.json', 'utf8'));
              const totals = data.total;
              
              console.log('Coverage Report:');
              console.log('  Statements: ' + totals.stmts.pct + '%');
              console.log('  Branches: ' + totals.branches.pct + '%');
              console.log('  Functions: ' + totals.functions.pct + '%');
              console.log('  Lines: ' + totals.lines.pct + '%');
              console.log('');
              
              // Check critical systems
              console.log('Critical Systems:');
              
              if (data['src/modules/combat_system.ts']) {
                const cs = data['src/modules/combat_system.ts'];
                console.log('  combat_system: ' + cs.stmts.pct + '% (target: 70%+)');
              }
              
              if (data['src/modules/rpg_system.ts']) {
                const rs = data['src/modules/rpg_system.ts'];
                console.log('  rpg_system: ' + rs.stmts.pct + '% (target: 85%+)');
              }
              
              if (data['src/modules/matchmaker.ts']) {
                const mm = data['src/modules/matchmaker.ts'];
                console.log('  matchmaker: ' + mm.stmts.pct + '% (target: 90%+)');
              }
            "
            echo ""
            echo "✅ Coverage thresholds configured in jest.config.js"
          fi
      
      - name: Upload coverage to Codecov
        if: success()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/
          retention-days: 30

  require-tests:
    name: All Tests Must Pass
    runs-on: ubuntu-latest
    needs: [godot-tests, godot-coverage-gate, backend-tests]
    if: always()
    steps:
      - name: Check if all tests passed
        run: |
          GODOT_RESULT=${{ needs.godot-tests.result }}
          COVERAGE_RESULT=${{ needs.godot-coverage-gate.result }}
          BACKEND_RESULT=${{ needs.backend-tests.result }}
          
          echo "Godot tests: $GODOT_RESULT"
          echo "Coverage gate: $COVERAGE_RESULT"
          echo "Backend tests: $BACKEND_RESULT"
          
          if [ "$GODOT_RESULT" != "success" ] && [ "$GODOT_RESULT" != "skipped" ]; then
            echo "❌ Godot tests failed"
            exit 1
          fi
          
          if [ "$COVERAGE_RESULT" != "success" ] && [ "$COVERAGE_RESULT" != "skipped" ]; then
            echo "❌ Coverage gate failed"
            exit 1
          fi
          
          if [ "$BACKEND_RESULT" != "success" ] && [ "$BACKEND_RESULT" != "skipped" ]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          
          echo "✅ All tests passed!"

  # Optional: Run flaky test detection on main branch pushes
  flaky-tests:
    name: Flaky Test Detection (Optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [require-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run quick flaky test detection (2 runs)
        working-directory: ./backend
        run: npx ts-node scripts/detect-flaky-tests.ts --runs=2 --threshold=0.5 || true
        continue-on-error: true
      
      - name: Generate report
        working-directory: ./backend
        run: npm run test:report
        continue-on-error: true
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: flaky-test-report
          path: docs/flaky-tests-report.md
          retention-days: 7
