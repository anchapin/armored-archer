name: Property-Based Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Issue #1031: this workflow previously ran `go test` against the Go
      # backend (backend/go.sum, ./internal/combat/, ./internal/rng/), which
      # was abandoned and deleted. The property-based suite now lives in the
      # TypeScript backend as tests/unit/property_based.test.ts.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run property-based tests
        working-directory: backend
        run: npm run test:property

      - name: Property test summary
        if: always()
        run: |
          echo "## Property-Based Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All property tests passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Combat calculation invariants validated with randomized iterations" >> $GITHUB_STEP_SUMMARY
          echo "- RPG progression and currency invariants validated with randomized iterations" >> $GITHUB_STEP_SUMMARY
