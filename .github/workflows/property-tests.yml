name: Property-Based Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run combat property tests
        run: |
          cd backend
          go test -v -run TestDamageProperty -run TestHitChanceProperty -run TestCritProperty ./internal/combat/

      - name: Run RNG property tests
        run: |
          cd backend
          go test -v -run TestRollIntProperty -run TestRollFloatProperty -run TestShuffleProperty -run TestSeedProperty ./internal/rng/

      - name: Run all property tests
        run: |
          cd backend
          go test -v -run "Property" ./...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-test-results
          path: |
            backend/test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Property test summary
        if: always()
        run: |
          echo "## Property-Based Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All property tests passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Combat calculations validated with 1000+ iterations per property" >> $GITHUB_STEP_SUMMARY
          echo "- RNG systems validated with 10000+ samples for distribution" >> $GITHUB_STEP_SUMMARY
