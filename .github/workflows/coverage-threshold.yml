name: Coverage Threshold Enforcement

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: nakama
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      nakama:
        image: heroiclabs/nakama:3.21.1
        env:
          NAKAMA_SERVER_KEY: defaultkey
          NAKAMA_SERVER_PORT: 7350
          DATABASE_ADDRESS: postgres://postgres:changeme@localhost:5432/nakama?sslmode=disable
        ports:
          - 7350:7350
        options: >-
          --health-cmd "/nakama/nakama healthcheck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        volumes:
          - ./backend/nakama.yml:/nakama/data/nakama.yml:ro

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run database migrations
        working-directory: ./backend/data
        run: |
          for migration in $(ls -1 *.sql 2>/dev/null | sort); do
            echo "Running migration: $migration"
            PGPASSWORD=changeme psql -h localhost -U postgres -d nakama -f "$migration" || true
          done

      - name: Wait for Nakama to be ready
        run: |
          echo "Waiting for Nakama to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:7350/ 2>/dev/null || curl -s http://localhost:7351/ 2>/dev/null; then
              echo "Nakama is ready"
              break
            fi
            echo "Waiting for Nakama... ($i/60)"
            sleep 2
          done

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          NAKAMA_HOST: localhost
          NAKAMA_PORT: 7350
          NAKAMA_SERVER_KEY: defaultkey
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: changeme
          TEST_DB_NAME: nakama
        run: npm run test:coverage

      - name: Extract coverage metrics
        id: coverage
        working-directory: ./backend
        run: |
          # Parse Jest JSON coverage summary
          if [ -f coverage/coverage-summary.json ]; then
            OVERALL=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
            BRANCHES=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.branches.pct)")
            FUNCTIONS=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.functions.pct)")
            STATEMENTS=$(node -e "const c=require('./coverage/coverage-summary.json'); console.log(c.total.statements.pct)")

            echo "overall=$OVERALL" >> $GITHUB_OUTPUT
            echo "branches=$BRANCHES" >> $GITHUB_OUTPUT
            echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
            echo "statements=$STATEMENTS" >> $GITHUB_OUTPUT

            # Extract per-file coverage for critical modules
            CRITICAL=$(node -e "
              const c = require('./coverage/coverage-summary.json');
              const files = Object.entries(c)
                .filter(([k]) => k !== 'total' && (k.includes('combat') || k.includes('matchmaker') || k.includes('rpg') || k.includes('gear')))
                .map(([k, v]) => k.split('/').pop() + '|' + v.lines.pct);
              console.log(files.join('\n'));
            ")
            echo "critical<<EOF" >> $GITHUB_OUTPUT
            echo "$CRITICAL" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "Coverage: Overall=$OVERALL%, Branches=$BRANCHES%, Functions=$FUNCTIONS%, Statements=$STATEMENTS%"
          else
            echo "::warning::coverage-summary.json not found"
            echo "overall=0" >> $GITHUB_OUTPUT
          fi

      - name: Check coverage thresholds - Stage 3 at 60%
        working-directory: ./backend
        run: |
          OVERALL=${{ steps.coverage.outputs.overall }}
          echo "Overall coverage: ${OVERALL}%"
          echo "Threshold: 60%"

          if (( $(echo "$OVERALL < 60" | bc -l) )); then
            echo "::error::Coverage ${OVERALL}% is below the 60% threshold (Stage 3 gate)"
            exit 1
          else
            echo "Coverage gate passed: ${OVERALL}% >= 60%"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            backend/coverage/
          retention-days: 30

      - name: Comment PR with coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const overall = '${{ steps.coverage.outputs.overall }}';
            const branches = '${{ steps.coverage.outputs.branches }}';
            const functions = '${{ steps.coverage.outputs.functions }}';
            const statements = '${{ steps.coverage.outputs.statements }}';
            const critical = `${{ steps.coverage.outputs.critical }}`;

            const overallStatus = parseFloat(overall) >= 60 ? '✅' : '❌';
            const branchesStatus = parseFloat(branches) >= 60 ? '✅' : '❌';
            const functionsStatus = parseFloat(functions) >= 60 ? '✅' : '❌';
            const statementsStatus = parseFloat(statements) >= 60 ? '✅' : '❌';

            const criticalFiles = critical.split('\n')
              .filter(line => line.trim())
              .map(line => {
                const [file, cov] = line.split('|');
                const status = parseFloat(cov) >= 80 ? '✅' : parseFloat(cov) >= 50 ? '⚠️' : '❌';
                return `${status} \`${file}\`: ${cov}%`;
              })
              .join('\n');

            const comment = `
            ## Coverage Report

            ### Summary
            | Metric | Coverage | Threshold | Status |
            |--------|----------|-----------|--------|
            | Lines | **${overall}%** | 60% | ${overallStatus} |
            | Branches | **${branches}%** | 60% | ${branchesStatus} |
            | Functions | **${functions}%** | 60% | ${functionsStatus} |
            | Statements | **${statements}%** | 60% | ${statementsStatus} |

            ### Critical Modules
            ${criticalFiles || 'No critical module data available'}

            ### Result
            ${overallStatus === '✅' ? '✅ Coverage thresholds passed' : '❌ Coverage below 60% threshold — add tests to improve coverage'}
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Fail if thresholds not met
        if: failure()
        run: |
          echo "::error::Coverage thresholds not met. Please add tests to improve coverage."
          exit 1

  regression-check:
    name: Coverage Regression Check
    runs-on: ubuntu-latest
    needs: coverage-check
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (current)
        working-directory: ./backend
        run: npm ci

      - name: Run tests on current branch
        working-directory: ./backend
        run: npm run test:coverage -- --coverageReporters=json-summary || true

      - name: Save current coverage
        run: cp backend/coverage/coverage-summary.json /tmp/current-coverage.json || true

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          clean: false
          path: baseline

      - name: Install dependencies (baseline)
        working-directory: ./baseline/backend
        run: npm ci

      - name: Run tests on baseline
        working-directory: ./baseline/backend
        run: npm run test:coverage -- --coverageReporters=json-summary || true

      - name: Compare coverage
        run: |
          if [ -f /tmp/current-coverage.json ] && [ -f baseline/backend/coverage/coverage-summary.json ]; then
            CURRENT=$(node -e "console.log(require('/tmp/current-coverage.json').total.lines.pct)")
            BASELINE=$(node -e "console.log(require('baseline/backend/coverage/coverage-summary.json').total.lines.pct)")
            DIFF=$(echo "$CURRENT - $BASELINE" | bc -l)
            echo "Current: ${CURRENT}%, Baseline: ${BASELINE}%, Diff: ${DIFF}%"

            if (( $(echo "$DIFF < -5" | bc -l) )); then
              echo "::error::Coverage regression detected: ${DIFF}% drop (current: ${CURRENT}%, baseline: ${BASELINE}%)"
              exit 1
            else
              echo "No significant coverage regression"
            fi
          else
            echo "Skipping regression check - coverage data not available"
          fi
