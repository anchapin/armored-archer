name: Coverage & Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-coverage:
    name: Backend Coverage (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Generate Go coverage
        working-directory: ./backend
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce 60% overall threshold
        working-directory: ./backend
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Go coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "::error::Go coverage ${COVERAGE}% is below 60% threshold"
            exit 1
          fi
          echo "✅ Overall coverage ${COVERAGE}% meets 60% threshold"

      - name: Enforce 80% critical path threshold
        working-directory: ./backend
        run: |
          CRITICAL=$(go tool cover -func=coverage.out | grep -E "combat|matchmaking|rpg" | awk '{sum+=$3; n++} END {printf "%.1f", n>0 ? sum/n : 0}')
          echo "Critical path coverage: ${CRITICAL}%"
          if (( $(echo "$CRITICAL < 80" | bc -l) )); then
            echo "::error::Critical path coverage ${CRITICAL}% is below 80% threshold"
            exit 1
          fi
          echo "✅ Critical path coverage ${CRITICAL}% meets 80% threshold"

      - name: Generate HTML report
        working-directory: ./backend
        run: |
          mkdir -p coverage/html
          go tool cover -html=coverage.out -o coverage/html/index.html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: backend/coverage/html/
          retention-days: 30

  godot-coverage:
    name: Frontend Coverage (Godot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          mv Godot_v4.6-stable_linux.x86_64 godot4

      - name: Run GUT tests with JUnit output
        run: |
          mkdir -p test/results
          ./godot4 --headless --script test/run_all_tests.gd

      - name: Calculate coverage via Python script
        id: coverage
        run: |
          RESULT=$(python3 scripts/calculate_godot_coverage.py test/results/gut-results.xml)
          echo "$RESULT"
          PASS_RATE=$(echo "$RESULT" | jq -r '.pass_rate')
          echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
          echo "Godot pass rate (coverage proxy): ${PASS_RATE}%"

      - name: Enforce 60% pass rate threshold
        run: |
          PASS_RATE=${{ steps.coverage.outputs.pass_rate }}
          if (( $(echo "$PASS_RATE < 60" | bc -l) )); then
            echo "::error::Godot pass rate ${PASS_RATE}% is below 60% threshold"
            exit 1
          fi
          echo "✅ Pass rate ${PASS_RATE}% meets 60% threshold"

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-results
          path: test/results/
          retention-days: 30

  coverage-gate:
    name: Coverage Gate (Block PR on Failure)
    runs-on: ubuntu-latest
    needs: [backend-coverage, godot-coverage]
    if: always()

    steps:
      - name: Check coverage results
        run: |
          BACKEND_RESULT=${{ needs.backend-coverage.result }}
          GODOT_RESULT=${{ needs.godot-coverage.result }}

          echo "Backend coverage: $BACKEND_RESULT"
          echo "Godot coverage: $GODOT_RESULT"

          if [ "$BACKEND_RESULT" != "success" ]; then
            echo "::error::Backend coverage checks failed"
            exit 1
          fi

          if [ "$GODOT_RESULT" != "success" ]; then
            echo "::error::Godot coverage checks failed"
            exit 1
          fi

          echo "✅ All coverage checks passed"
