name: Coverage & Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      coverage_stage:
        description: 'Coverage gate stage (1=45%, 2=52.5%, 3=60%)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-coverage:
    name: Backend Coverage (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Generate Go coverage
        working-directory: ./backend
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          mkdir -p coverage
          cp coverage.out coverage/coverage.out

      - name: Check assertions
        run: |
          echo "=== Checking assertions in test files ==="
          cd backend
          bash tests/quality/check_assertions.sh

      - name: Analyze coverage gaps
        run: |
          echo "=== Analyzing coverage gaps ==="
          cd backend
          bash tests/quality/analyze_gaps.sh

      - name: Upload gaps report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gaps
          path: backend/coverage/gaps.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Extract coverage metrics
        id: coverage
        run: |
          cd backend
          OVERALL=$(go tool cover -func=coverage/coverage.out | grep "^total:" | awk '{print $3}' | sed 's/%//')
          echo "overall=$OVERALL" >> $GITHUB_OUTPUT
          echo "Overall coverage: $OVERALL%"

      - name: Enforce coverage gates
        run: |
          echo "=== Enforcing coverage thresholds ==="
          cd backend
          bash tests/quality/coverage_gates.sh
        env:
          COVERAGE_GATE_STAGE: ${{ github.event.inputs.coverage_stage }}

      - name: Generate HTML report
        working-directory: ./backend
        run: |
          mkdir -p coverage/html
          go tool cover -html=coverage/coverage.out -o coverage/html/index.html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: backend/coverage/html/
          retention-days: 30
          if-no-files-found: ignore

      - name: Track coverage history
        run: |
          bash scripts/track-coverage-history.sh

  godot-coverage:
    name: Frontend Coverage (Godot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          mv Godot_v4.6-stable_linux.x86_64 godot4

      - name: Run GUT tests with JUnit output
        run: |
          mkdir -p test/results
          ./godot4 --headless --script test/run_all_tests.gd

      - name: Generate HTML coverage report
        run: |
          if [ -f test/coverage/json/coverage.json ]; then
            python3 scripts/parse_godot_coverage.py \
              --input=test/coverage/json/coverage.json \
              --output=test/coverage/html/index.html
          else
            echo "Warning: coverage.json not found, skipping HTML report generation"
          fi

      - name: Upload Godot coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-coverage-html
          path: test/coverage/html/
          retention-days: 30
          if-no-files-found: ignore

  gap-analysis:
    name: Coverage Gap Analysis
    runs-on: ubuntu-latest
    needs: backend-coverage
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/

      - name: Run gap analysis
        run: |
          echo "=== Running gap analysis ==="
          cd backend
          bash scripts/gap-analysis.sh

      - name: Upload gaps artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gaps
          path: backend/coverage/gaps.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Comment PR with gaps
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const gaps = JSON.parse(fs.readFileSync('backend/coverage/gaps.json', 'utf8'));
            const highPriority = gaps.gaps.filter(g => g.priority === 'HIGH').slice(0, 5);
            const mediumPriority = gaps.gaps.filter(g => g.priority === 'MEDIUM').slice(0, 3);
            const summary = gaps.summary;

            const comment = `
              ## Coverage Report
              **Gate Stage:** ${{ github.event.inputs.coverage_stage || 'Active (Current Milestone)' }}

              ### Gap Summary
              - Total gaps: ${summary.total_gaps}
              - High priority (critical path): ${summary.high_priority}
              - Medium priority (business logic): ${summary.medium_priority}
              - Low priority (utilities): ${summary.low_priority}

              ### Top High-Priority Gaps
              ${highPriority.length > 0 ? highPriority.map(g => `- **${g.package}**: \`${g.function}\` (${g.complexity} complexity)`).join('\n') : 'No high-priority gaps found! 🎉'}

              ### Top Medium-Priority Gaps
              ${mediumPriority.length > 0 ? mediumPriority.map(g => `- **${g.package}**: \`${g.function}\` (${g.complexity} complexity)`).join('\n') : 'No medium-priority gaps found! 🎉'}

              ### Next Steps
              1. Review high-priority gaps in critical packages (combat, matchmaking, rpg)
              2. Use suggested fixtures from testhelpers package
              3. Run \`bash scripts/gap-analysis.sh\` for full gap list
              4. Generate coverage: \`go test -coverprofile=coverage/coverage.out ./...\`

              ---
              📊 View detailed coverage report in artifacts
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              body: comment
            });

      - name: Enforce 50% line coverage threshold
        run: |
          if [ -f test/coverage/json/coverage.json ]; then
            LINE_COVERAGE=$(python3 scripts/parse_godot_coverage.py --input=test/coverage/json/coverage.json --json-output 2>/dev/null || echo "{}" | jq -r '.overall_percentage // 0')
            if [ -z "$LINE_COVERAGE" ] || [ "$LINE_COVERAGE" = "null" ]; then
              LINE_COVERAGE=0
            fi
            if (( $(echo "$LINE_COVERAGE < 50" | bc -l) )); then
              echo "::error::Godot line coverage ${LINE_COVERAGE}% is below 50% threshold"
              exit 1
            fi
            echo "✅ Line coverage ${LINE_COVERAGE}% meets 50% threshold"
          else
            echo "Warning: coverage.json not found, skipping line coverage threshold check"
          fi

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-results
          path: test/results/
          retention-days: 30
          if-no-files-found: ignore

  coverage-gate:
    name: Coverage Gate (Block PR on Failure)
    runs-on: ubuntu-latest
    needs: [backend-coverage, godot-coverage]
    if: always()

    steps:
      - name: Check coverage results
        run: |
          BACKEND_RESULT=${{ needs.backend-coverage.result }}
          GODOT_RESULT=${{ needs.godot-coverage.result }}

          echo "Backend coverage: $BACKEND_RESULT"
          echo "Godot coverage: $GODOT_RESULT"

          if [ "$BACKEND_RESULT" != "success" ]; then
            echo "::error::Backend coverage checks failed"
            exit 1
          fi

          if [ "$GODOT_RESULT" != "success" ]; then
            echo "::error::Godot coverage checks failed"
            exit 1
          fi

          echo "✅ All coverage checks passed"
