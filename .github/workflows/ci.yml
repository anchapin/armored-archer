name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

# Prevent concurrent CI runs to avoid intermittent failures
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

  backend-complexity:
    name: Cyclomatic Complexity Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run ESLint complexity analysis
        working-directory: ./backend
        run: npm run complexity

  backend-n-plus-one:
    name: N+1 Query Detection (Non-Blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run N+1 query detection
        working-directory: ./backend
        run: npm run detect-n-plus-one:ci || true

  backend-dead-flags:
    name: Dead Feature Flag Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run dead feature flag detection
        working-directory: ./backend
        run: npm run detect-dead-flags:ci || true

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run TypeScript type check
        working-directory: ./backend
        run: npm run typecheck

  backend-test:
    name: Backend Tests with Coverage
    runs-on: ubuntu-latest
    services:
      # PostgreSQL database service
      # Note: Using port 5432 (container) mapped to host port 5432
      # For act local testing, use: act -j backend-test --job-timeout=30m
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: nakama
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
      # Note: no Nakama service container here (issue #858). The retired
      # `armored-archer/nakama-postgres:3.21.1` image was never published to a
      # registry, so both act and GitHub-hosted runners failed at job setup
      # ("pull access denied"). These jobs run unit tests only (jest roots=src),
      # which never connect to Nakama — integration coverage runs in the
      # `backend-integration-test` job below (issue #1070), which boots the
      # real heroiclabs/nakama:3.21.1 + postgres:14-alpine pair as service
      # containers and executes `npm run test:integration`.

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Wait for PostgreSQL to be ready
        run: |
          # For act local testing, use direct pg_isready connection
          # For GitHub Actions, this also works with the service container
          for i in {1..30}; do
            if PGPASSWORD=changeme pg_isready -h localhost -p 5432 -U postgres 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run database migrations
        working-directory: ./backend/data
        run: |
          # For act local testing, use direct psql connection
          # For GitHub Actions, this also works with the service container
          for migration in $(ls -1 *.sql 2>/dev/null | sort -V); do
            echo "Running migration: $migration"
            PGPASSWORD=changeme psql -h localhost -p 5432 -U postgres -d nakama -f "$migration" || true
          done

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          NAKAMA_HOST: localhost
          NAKAMA_PORT: 7350
          NAKAMA_SERVER_KEY: ci-test-server-key-do-not-use-in-production
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: changeme
          TEST_DB_NAME: nakama
        run: npm run test:coverage

      - name: Detect git worktree environment
        id: detect-worktree
        if: success()
        run: |
          # Detect if we're in a git worktree (e.g., /var/tmp/vibe-kanban/worktrees/)
          GIT_DIR=$(git rev-parse --git-dir 2>/dev/null || echo "")
          IS_WORKTREE=0

          if [[ "$GIT_DIR" == *"/.git/worktrees/"* ]] || [[ "$PWD" == *"/worktrees/"* ]]; then
            echo "::warning title=Git Worktree Detected::Running in a git worktree. Codecov has issues with worktrees."
            IS_WORKTREE=1
          fi

          # Also check for act environment variable
          if [ "${{ env.ACT }}" == "true" ]; then
            echo "::warning title=Act Environment Detected::Running with act. Skipping Codecov upload."
            IS_WORKTREE=1
          fi

          echo "is_worktree=$IS_WORKTREE" >> $GITHUB_OUTPUT
          echo "Git directory: $GIT_DIR"
          echo "Working directory: $PWD"

      - name: Upload coverage to Codecov
        if: success() && steps.detect-worktree.outputs.is_worktree == '0'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false
          git_service_name: github
          verbose: true

      - name: Skip Codecov (worktree/act detected)
        if: success() && steps.detect-worktree.outputs.is_worktree == '1'
        run: |
          echo "⚠️  Skipping Codecov upload due to git worktree or act environment"
          echo "This is expected behavior - Codecov has issues with worktrees and local testing"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run npm audit
        working-directory: ./backend
        run: npm audit --audit-level=high
      
      - name: Run npm audit with production flag
        working-directory: ./backend
        run: npm audit --production --audit-level=high

  log-scrubbing:
    name: Log Scrubbing Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run log scrubbing tests
        working-directory: ./backend
        run: npm test -- --testPathPatterns=log_scrubbing

  n-plus-one-detection:
    name: N+1 Query Detection (Blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run N+1 query detection
        working-directory: ./backend
        run: npm run detect-n-plus-one:ci

  duplicate-code-detection:
    name: Duplicate Code Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run duplicate code detection on TypeScript (backend)
        working-directory: ./backend
        run: npx jscpd --config .jscpd.json --threshold 3

      - name: Run duplicate code detection on GDScript and Python
        working-directory: ./backend
        run: npx jscpd --config .jscpd.json --threshold 3 ../autoloads/ ../scripts/ ../scenes/ || true

  dependency-check:
    name: Unused Dependency Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm install
      
      - name: Run depcheck
        working-directory: ./backend
        run: npm run depcheck
      
      - name: Count dependencies
        id: dep-count
        working-directory: ./backend
        run: |
          TOTAL=$(node -e "console.log(Object.keys(require('./package.json').dependencies).length + Object.keys(require('./package.json').devDependencies).length)")
          PROD=$(node -e "console.log(Object.keys(require('./package.json').dependencies).length)")
          DEV=$(node -e "console.log(Object.keys(require('./package.json').devDependencies).length)")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "prod=$PROD" >> $GITHUB_OUTPUT
          echo "dev=$DEV" >> $GITHUB_OUTPUT
          echo "Dependency count: Total=$TOTAL, Prod=$PROD, Dev=$DEV"
      
      - name: Print dependency summary
        run: |
          echo "Dependencies: ${{ steps.dep-count.outputs.total }} total (${{ steps.dep-count.outputs.prod }} prod, ${{ steps.dep-count.outputs.dev }} dev)"

  bundle-size-check:
    name: Bundle Size Tracking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Build backend
        working-directory: ./backend
        run: npm run build
      
      - name: Run bundle analysis
        working-directory: ./backend
        run: node scripts/bundle-analysis.js --ci-mode --json
        env:
          GIT_COMMIT: ${{ github.sha }}
      
      - name: Upload bundle report
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: |
            backend/.bundle-size-history.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Skip upload (act detected)
        if: always() && env.ACT == 'true'
        run: echo "Skipping artifact upload in act environment"

  godot-validate:
    name: Godot Project Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate project.godot
        run: |
          if [ ! -f project.godot ]; then
            echo "Error: project.godot not found"
            exit 1
          fi
          echo "project.godot found and valid"
      
      - name: Check autoload scripts exist
        run: |
          if grep -q "NetworkManager=" project.godot && ! [ -f autoloads/NetworkManager.gd ]; then
            echo "Error: NetworkManager autoload defined but file missing"
            exit 1
          fi
          if grep -q "GameManager=" project.godot && ! [ -f autoloads/GameManager.gd ]; then
            echo "Error: GameManager autoload defined but file missing"
            exit 1
          fi
          echo "Autoload scripts validated"

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  gdscript-lint:
    name: GDScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install gdlint
        run: pip install gdtoolkit

      - name: Run gdlint
        run: gdlint .

  tech-debt-tracking:
    name: Tech Debt Tracking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Generate Tech Debt Report
        working-directory: ./backend
        run: npm run tech-debt:report
      
      - name: Check for critical tech debt
        working-directory: ./backend
        run: npm run tech-debt:report:ci
      
      - name: Upload Tech Debt Report
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tech-debt-report
          path: |
            backend/tech-debt-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Skip upload (act detected)
        if: always() && env.ACT == 'true'
        run: echo "Skipping artifact upload in act environment"

  dead-code-detection:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Install gdlint
        run: pip install gdtoolkit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run dead code detection (CI mode)
        run: make dead-code-check-ci

  sonarcloud:
    name: SonarCloud Code Quality
    runs-on: ubuntu-latest
    # Only run on push/PR events to avoid duplicate scans
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    services:
      # PostgreSQL database service
      # Note: Using unique port 5434 to avoid conflicts with backend-test job (5432) when running act in parallel
      # For act local testing, use: act -j sonarcloud --job-timeout=30m
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: nakama
          POSTGRES_PASSWORD: changeme
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
      # Note: no Nakama service container here (issue #858) — the
      # `armored-archer/nakama-postgres:3.21.1` image was never published to a
      # registry and failed job setup everywhere. This job runs unit tests only
      # (jest roots=src); NAKAMA_* env vars below are inert config defaults.

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clone should be disabled for SonarCloud

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Skip SonarCloud for act environment
        if: env.ACT == 'true'
        run: |
          echo "⚠️  Skipping SonarCloud scan when running locally with act"
          echo "This job requires GitHub context variables that are not available locally"

      - name: Wait for PostgreSQL to be ready
        run: |
          # For act local testing, use direct pg_isready connection
          # For GitHub Actions, this also works with the service container
          for i in {1..30}; do
            if PGPASSWORD=changeme pg_isready -h localhost -p 5434 -U postgres 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run database migrations
        working-directory: ./backend/data
        run: |
          # For act local testing, use direct psql connection
          # For GitHub Actions, this also works with the service container
          for migration in $(ls -1 *.sql 2>/dev/null | sort -V); do
            echo "Running migration: $migration"
            PGPASSWORD=changeme psql -h localhost -p 5434 -U postgres -d nakama -f "$migration" || true
          done

      - name: Run tests for coverage
        working-directory: ./backend
        env:
          NAKAMA_HOST: localhost
          NAKAMA_PORT: 7351
          NAKAMA_SERVER_KEY: ci-test-server-key-do-not-use-in-production
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5434
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: changeme
          TEST_DB_NAME: nakama
        run: npm run test:coverage

      - name: Skip SonarCloud for act environment
        if: env.ACT == 'true'
        run: |
          echo "⚠️  Skipping SonarCloud scan when running locally with act"
          echo "This job requires GitHub context variables and secrets that are not available locally"
          echo "Skipping remaining steps in this job..."

      - name: Run SonarCloud Scanner for Backend (TypeScript/Node.js)
        if: env.ACT != 'true'
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.testExecutionReportPaths=coverage/coverage-final.json
            -Dsonar.coverage.exclusions=**/node_modules/**,**/*.d.ts,**/*.config.js
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.ts,**/*.spec.ts
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.newCode.referenceBranch=main
            -Dsonar.projectKey=armored-archer_backend
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.sq.newCode.overallCoverageGoal=70
            -Dsonar.sq.newCode.overallNewTechnicalDebt=5

      - name: Run SonarCloud Scanner for Game Scripts
        # Note: GDScript requires SonarQube server with community plugin
        if: env.ACT != 'true'
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.sources=autoloads,scenes,scripts
            -Dsonar.language=js
            -Dsonar.javascript.lcov.reportPaths=
            -Dsonar.exclusions=**/node_modules/**,**/backend/**,**/tests/**,**/test/**,.git
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.newCode.referenceBranch=main
            -Dsonar.projectKey=armored-archer_game
            -Dsonar.organization=${{ secrets.SONAR_ORG }}

  schema-validation:
    name: Database Schema Validation
    runs-on: ubuntu-latest
    services:
      # PostgreSQL database service
      # Note: host port 5437 — unique per CI job (5432/5434/5435/5436 are used
      # by other DB-dependent jobs) and deliberately NOT 5433, which the local
      # dev stack (backend/docker-compose.yml) binds permanently; reusing it
      # made parallel act runs fail with "port already allocated" (#858).
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: nakama
          POSTGRES_PASSWORD: localdbpassword
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # act's runner image (catthehacker/ubuntu:act-latest) ships without
      # postgresql-client, which silently no-ops the migration steps below and
      # makes the schema assertions fail. Install it only under act; hosted
      # ubuntu-latest runners already have psql/pg_isready preinstalled.
      - name: Install postgresql-client (act only)
        if: env.ACT == 'true'
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Wait for PostgreSQL to be ready
        run: |
          # For act local testing, use direct pg_isready connection
          # For GitHub Actions, this also works with the service container
          for i in {1..30}; do
            if PGPASSWORD=localdbpassword pg_isready -h localhost -p 5437 -U postgres 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run migrations
        working-directory: ./backend/data
        run: |
          # For act local testing, use direct psql connection
          # For GitHub Actions, this also works with the service container
          for migration in $(ls -1 *.sql 2>/dev/null | sort -V); do
            echo "Running migration: $migration"
            PGPASSWORD=localdbpassword psql -h localhost -p 5437 -U postgres -d nakama -f "$migration" || true
          done

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run schema validation tests
        working-directory: ./backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5437
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: localdbpassword
          TEST_DB_NAME: nakama
        run: npm run test:schema

      - name: Upload schema test results
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: schema-test-results
          path: backend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Skip upload (act detected)
        if: always() && env.ACT == 'true'
        run: echo "Skipping artifact upload in act environment"

  agents-md-validation:
    name: AGENTS.md Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Validate AGENTS.md
        working-directory: ./backend
        run: npm run validate:agents-md:ci
      
      - name: Upload validation report
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: agents-md-validation-report
          path: |
            backend/agents-md-validation-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Skip upload (act detected)
        if: always() && env.ACT == 'true'
        run: echo "Skipping artifact upload in act environment"

  tracked-ignored-files:
    name: Tracked-but-ignored Files Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      # Fails when `git ls-files -i -c --exclude-standard` is non-empty —
      # i.e. a file is both tracked and gitignored (secrets-leak vector,
      # issue #1032). The validator only lists file paths, never contents.
      - name: Fail if any tracked file matches .gitignore
        working-directory: ./backend
        run: npm run validate:tracked-ignored:ci

  # Issue #1112: the alerting/prometheus configs once lived in two divergent
  # copies (backend/prometheus.yml vs backend/config/prometheus.yml, etc.);
  # compose only mounted the root copies, so the backend/config/ set was dead
  # config that claimed to be authoritative and drifted. The dead copies were
  # deleted — this guard fails if they reappear, if any backend/config/*.yml
  # is unmounted by backend/docker-compose.yml, or if a compose yml mount
  # dangles. Pure file/paths check: no build or services required.
  observability-config-check:
    name: Observability Config Consolidation Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on duplicated or unmounted observability configs
        run: bash scripts/check-observability-configs.sh

  # Issue #1070: gate PRs with the 17 real-stack integration suites under
  # backend/tests/integration/ (combat_system, matchmaker, authentication,
  # gear_system, season_system, store, network_resilience, error_handling,
  # spend_gems, vertical_slice_smoke, …) that exercise live RPC dispatch,
  # DB persistence, and transactionality against Nakama + PostgreSQL. Until
  # this job existed, settlement/purchase regressions merged green because
  # only mocked unit tests ran in CI. Companion to backend-test (which runs
  # `npm run test:coverage` against the unit suite only).
  #
  # Docker-compose ports — 5432 (postgres), 7350 (Nakama API), 7351 (console)
  # (console) — are deliberately distinct from 5432/5434/5435/5436/5437 and
  # 7350/7351 used by other jobs and the local dev stack (#858), so this
  # job can run in parallel with backend-test / schema-validation under
  # `act` without "port already allocated" failures.
  #
  # Bundle mount: real RPCs (combat / loot) require the Nakama game bundle
  # built from backend/src. We build it via `npm run build:full` and mount
  # the resulting backend/data/modules/ into the nakama container at
  # /nakama/data/modules (Nakama's default module load path). NOTE: the
  # .github/docker-compose.yml used by `make ci-services-*` does not mount
  # this volume — leaving that as a follow-up keeps this PR diff small.
  backend-integration-test:
    name: Backend Integration Tests (Nakama + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Issue #1144: the signal steps below post a PR comment (issues API) and
    # create a check run (dorny/test-reporter). Scoped to this job only; the
    # workflow-wide default stays `contents: read`.
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      # HMAC_SECRET is embedded into the Nakama bundle at build time by
      # transpile-bundle.js (APP_ENV snapshot). The same value must be passed
      # to the Nakama container at runtime so anti_cheat accepts it.
      HMAC_SECRET: ci-test-secret-do-not-use-in-production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      # Rolling 30-day flake history (issue #1144). restore-keys prefix-match
      # picks up the most recent prior run's file; the summary step below
      # appends this run's per-test pass/fail and prunes entries older than
      # 30 days; the save step stores it under a fresh immutable key. Skipped
      # under act (hosted cache API), where the seeded {}
      # data/backend-flaky-test-history.json from the checkout is used instead.
      - name: Restore flaky-test history
        if: env.ACT != 'true'
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/backend-flaky-test-history.json
          key: backend-flaky-test-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            backend-flaky-test-history-

      # Builds the Nakama game bundle into backend/data/modules/, which the
      # docker-compose started Nakama container mounts as a volume (see the
      # Start Nakama and Postgres step below). Without this, custom RPCs
      # (combat / loot / season) 500 and every integration test fails.
      - name: Inject required env vars into .env for CI bundle build
        working-directory: ./backend
        run: |
          # transpile-bundle.js snapshots .env at build time (file is the allowlist).
          # The bundle's process.env is STATIC and baked at build time — Nakama's JS
          # runtime does NOT read runtime env vars for config. Both NAKAMA_SERVER_KEY
          # and HMAC_SECRET must be in .env BEFORE the build so they are embedded.
          # (docker-compose --socket.server_key does NOT reach the JS runtime's
          # process.env — the bundle's config reads process.env.NAKAMA_SERVER_KEY.)
          # Use [ ! -f .env ] || prefix so the grep is only run when .env EXISTS.
          # Without this, `grep -q "^HMAC_SECRET=" .env` exits 1 when .env is absent,
          # and `set -e` (shell option) aborts the script before the echo runs.
          if [ ! -f .env ] || ! grep -q "^HMAC_SECRET=" .env; then
            echo "HMAC_SECRET=ci-test-secret-do-not-use-in-production" >> .env
          fi
          if [ ! -f .env ] || ! grep -q "^NAKAMA_SERVER_KEY=" .env; then
            # Use a non-default key so validateRequiredConfig() does not throw
            # in the baked-in 'production' environment (webpack mode:production
            # bakes process.env.NODE_ENV || 'development' as 'production' since
            # the shell NODE_ENV is unset at build time; transpile-bundle.js
            # excludes NODE_ENV from the embedded env so the runtime value does
            # not override the baked constant).
            echo "NAKAMA_SERVER_KEY=ci-test-server-key-do-not-use-in-production" >> .env
          fi
          # Session encryption keys must also be non-default in production.
          # validateSessionKeys() in src/config/index.ts throws when any of
          # SESSION_ENCRYPTION_KEY, REFRESH_ENCRYPTION_KEY, or TOKEN_ENCRYPTION_KEY
          # retains a default value ('default-token-key', 'default-refresh-key')
          # and config.environment === 'production' (which the bundle is, due to
          # webpack mode:production baking process.env.NODE_ENV='production').
          if [ ! -f .env ] || ! grep -q "^SESSION_ENCRYPTION_KEY=" .env; then
            echo "SESSION_ENCRYPTION_KEY=ci-test-session-encryption-key-do-not-use-in-production" >> .env
          fi
          if [ ! -f .env ] || ! grep -q "^REFRESH_ENCRYPTION_KEY=" .env; then
            echo "REFRESH_ENCRYPTION_KEY=ci-test-refresh-encryption-key-do-not-use-in-production" >> .env
          fi
          if [ ! -f .env ] || ! grep -q "^TOKEN_ENCRYPTION_KEY=" .env; then
            echo "TOKEN_ENCRYPTION_KEY=ci-test-token-encryption-key-do-not-use-in-production" >> .env
          fi

      - name: Build Nakama bundle
        working-directory: ./backend
        run: npm run build:full

      # act's runner image (catthehacker/ubuntu:act-latest) ships without
      # postgresql-client — silent no-op on the migration step. Install only
      # under act; hosted ubuntu-latest already has psql/pg_isready.
      - name: Install postgresql-client (act only)
        if: env.ACT == 'true'
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq postgresql-client
          fi
          psql --version

      # Use docker-compose to start Nakama + Postgres since GitHub Actions
      # service containers don't support custom entrypoint/command needed to
      # pass --database.address to Nakama. The .github/docker-compose.yml
      # has the correct entrypoint scripts for Nakama (like the local dev stack).
      - name: Start Nakama and Postgres via docker-compose
        run: |
          # Start postgres and nakama using the CI docker-compose file
          docker compose -f .github/docker-compose.yml up -d
          # Wait for both services to be healthy
          echo "Waiting for services to be healthy..."
          for i in {1..60}; do
            if docker compose -f .github/docker-compose.yml ps | grep -q "healthy"; then
              echo "Services are healthy"
              break
            fi
            echo "Waiting for services... ($i/60)"
            sleep 2
          done

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if PGPASSWORD=changeme pg_isready -h localhost -p 5432 -U postgres 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Debug Nakama startup (container logs + port check)
        run: |
          echo "=== OOM Killer check (dmesg) ==="
          sudo dmesg | grep -iE "killed|oom|memory" | tail -10 || echo "Cannot read dmesg"
          echo ""
          echo "=== Nakama container resource usage ==="
          docker stats ci_nakama --no-stream 2>/dev/null || echo "Cannot get container stats"
          echo ""
          echo "=== Nakama container memory info ==="
          docker exec ci_nakama sh -c 'cat /proc/meminfo 2>/dev/null | head -10' || echo "Cannot read meminfo"
          echo ""
          echo "=== Nakama container logs (combined stdout+stderr) ==="
          docker logs ci_nakama --tail 200 2>&1 || echo "No logs available"
          echo ""
          echo "=== Nakama process list (PIDs) ==="
          docker exec ci_nakama sh -c 'ls -la /proc/ | grep -E "^d|^l" | head -20' 2>/dev/null || echo "Cannot list /proc"
          docker exec ci_nakama sh -c 'ls -la /proc/*/exe 2>/dev/null | head -10' 2>/dev/null || echo "Cannot get process executables"
          echo ""
          echo "=== Nakama network connections ==="
          docker exec ci_nakama sh -c 'cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | head -30' || echo "Cannot read /proc/net/tcp"
          echo ""
          echo "=== Nakama port binding (ss -tlnp) ==="
          docker exec ci_nakama ss -tlnp 2>/dev/null || echo "ss not available"
          echo ""
          echo "=== Nakama environment (HMAC_SECRET check) ==="
          docker exec ci_nakama sh -c 'env | grep -i hmac' 2>/dev/null || echo "Cannot get env"
          echo ""
          echo "=== Nakama nakama.yaml config ==="
          docker exec ci_nakama sh -c 'cat /nakama/data/modules/nakama.yml 2>/dev/null || cat /nakama/nakama.yml 2>/dev/null || echo "No nakama.yml found"' || echo "Cannot read config"
          echo ""
          echo "=== Nakama bundle files ==="
          docker exec ci_nakama sh -c 'ls -la /nakama/data/modules/ 2>/dev/null || echo "No modules dir"' || echo "Cannot list modules"
          echo ""
          echo "=== curl HTTP API ==="
          curl -v http://127.0.0.1:7350/ 2>&1 | head -30 || echo "curl failed"
          echo ""
          echo "=== curl HTTP API (console) ==="
          curl -v http://127.0.0.1:7351/ 2>&1 | head -10 || echo "curl failed"

      - name: Wait for Nakama to be ready
        run: |
          # /nakama/nakama healthcheck requires its own CLI subcommand and a
          # reachable :7350 inside the container. From the runner we only
          # need the HTTP API to respond; the game-bundle load is best-
          # effort because Nakama's healthcheck doesn't reflect it.
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7350/ 2>/dev/null)
            if [ "$code" = "200" ]; then
              echo "Nakama API reachable (HTTP $code)"
              break
            fi
            echo "Waiting for Nakama... ($i/60)"
            sleep 2
          done
          # Exit if Nakama never became ready
          if [ "$i" = "60" ]; then
            echo "ERROR: Nakama did not become ready after 120 seconds"
            exit 1
          fi
          # Give Nakama additional time to fully initialize the JS runtime
          echo "Nakama healthcheck passed, waiting 30s for JS runtime initialization..."
          sleep 30

      - name: Run game schema migrations
        working-directory: ./backend/data
        run: |
          # Nakama's own startup created its internal tables (users,
          # storage, …). Our 000_* migration is `CREATE TABLE IF NOT EXISTS`
          # so it is a no-op when users already exists, and 001+ add the
          # game schema on top. `|| true` mirrors backend-test's tolerance
          # for re-applied migrations in cache-warm runners.
          for migration in $(ls -1 *.sql 2>/dev/null | sort -V); do
            echo "Running migration: $migration"
            PGPASSWORD=changeme psql -h localhost -p 5432 -U postgres -d nakama -f "$migration" || true
          done

      # Jest's own exit code is deliberately NOT the job gate (issue #1144):
      # continue-on-error lets the jest-junit reporter finish writing
      # backend/test-results/junit.xml so every downstream signal step has
      # data even on red runs. The authoritative status check is the
      # "Summarize integration results" step below, which parses the junit
      # XML and fails the job on any failure — the gate therefore consumes
      # the junit results, not the unconstrained jest exit code.
      - name: Run integration tests
        id: integration-tests
        working-directory: ./backend
        continue-on-error: true
        env:
          NAKAMA_HOST: localhost
          NAKAMA_PORT: '7350'
          NAKAMA_SERVER_KEY: ci-test-server-key-do-not-use-in-production
          TEST_DB_HOST: localhost
          TEST_DB_PORT: '5432'
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: changeme
          TEST_DB_NAME: nakama
          CI: 'true'
        run: npm run test:integration

      # Pass-rate + flake signal surface and the job's status gate (issue
      # #1144). Parses the junit XML, computes pass/fail/skip counts and
      # pass-rate, appends per-test results to the 30-day flake history,
      # writes $GITHUB_STEP_SUMMARY + backend/test-results/*.md for the PR
      # comment step, and exits non-zero on any junit failure (exit 2 when
      # the junit is missing — a crashed run can never look green).
      - name: Summarize integration results (pass-rate, flakes, gate)
        id: integration-summary
        if: always()
        working-directory: ./backend
        run: npx ts-node scripts/integration-test-summary.ts --junit=test-results/junit.xml --ci-mode

      # Inline PR annotations from the same junit (issue #1144). Annotation
      # only — gating is owned by the summary step above so there is exactly
      # one authority for the status check.
      - name: Annotate PR with test results (dorny/test-reporter)
        if: always() && env.ACT != 'true'
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: Backend Integration Tests (Nakama + Postgres)
          path: backend/test-results/junit.xml
          reporter: jest-junit
          list-tests: failed
          fail-on-error: 'false'

      - name: Skip PR annotations (act detected)
        if: always() && env.ACT == 'true'
        run: echo "Skipping dorny/test-reporter in act environment"

      # Upsert the summary comment on the PR (issue #1144): pass/fail/skip
      # counts, pass-rate, top-5 failing test ids, 30-day flake signal. The
      # hidden marker makes the comment idempotent — re-runs update in place
      # instead of stacking new comments.
      - name: Post PR comment with integration test summary
        if: always() && github.event_name == 'pull_request' && env.ACT != 'true' && steps.integration-summary.outputs.pr_comment_written == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- backend-integration-test-summary -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `**Backend Integration Tests** — [run #${context.runNumber}](${runUrl})`,
              '',
              fs.readFileSync('backend/test-results/integration-pr-comment.md', 'utf8'),
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated summary comment ${existing.html_url}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info(`Created summary comment ${created.html_url}`);
            }

      # Persist the updated 30-day flake history (issue #1144). Saved only
      # when the summary step succeeded so a missing-junit run cannot
      # overwrite history with an empty file.
      - name: Save flaky-test history
        if: always() && env.ACT != 'true' && steps.integration-summary.conclusion == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: data/backend-flaky-test-history.json
          key: backend-flaky-test-history-${{ github.run_id }}-${{ github.run_attempt }}

      # Machine-readable signal surface (issue #1144): the junit XML plus the
      # rendered summaries, kept 90 days so trend analysis can join across
      # weekly runs. Distinct from the short-lived raw output below.
      - name: Upload integration junit results
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: integration-test-junit
          path: |
            backend/test-results/junit.xml
            backend/test-results/integration-summary.md
            backend/test-results/integration-pr-comment.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload integration test results
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: integration-test-results
          path: backend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Skip upload (act detected)
        if: always() && env.ACT == 'true'
        run: echo "Skipping artifact upload in act environment"
