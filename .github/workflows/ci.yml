name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Prevent concurrent CI runs to avoid intermittent failures
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint -- --no-ignore

  backend-complexity:
    name: Cyclomatic Complexity Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run ESLint complexity analysis
        working-directory: ./backend
        run: npm run complexity

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run TypeScript type check
        working-directory: ./backend
        run: npm run typecheck

  backend-test:
    name: Backend Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run tests with coverage
        working-directory: ./backend
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        if: success()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run npm audit
        working-directory: ./backend
        run: npm audit --audit-level=high
      
      - name: Run npm audit with production flag
        working-directory: ./backend
        run: npm audit --production --audit-level=high

  n-plus-one-detection:
    name: N+1 Query Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run N+1 query detection
        working-directory: ./backend
        run: npm run detect-n-plus-one:ci

  dependency-check:
    name: Unused Dependency Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm install
      
      - name: Run depcheck
        working-directory: ./backend
        run: npm run depcheck
      
      - name: Count dependencies
        id: dep-count
        working-directory: ./backend
        run: |
          TOTAL=$(node -e "console.log(Object.keys(require('./package.json').dependencies).length + Object.keys(require('./package.json').devDependencies).length)")
          PROD=$(node -e "console.log(Object.keys(require('./package.json').dependencies).length)")
          DEV=$(node -e "console.log(Object.keys(require('./package.json').devDependencies).length)")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "prod=$PROD" >> $GITHUB_OUTPUT
          echo "dev=$DEV" >> $GITHUB_OUTPUT
          echo "Dependency count: Total=$TOTAL, Prod=$PROD, Dev=$DEV"
      
      - name: Print dependency summary
        run: |
          echo "Dependencies: ${{ steps.dep-count.outputs.total }} total (${{ steps.dep-count.outputs.prod }} prod, ${{ steps.dep-count.outputs.dev }} dev)"

  bundle-size-check:
    name: Bundle Size Tracking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Build backend
        working-directory: ./backend
        run: npm run build
      
      - name: Run bundle analysis
        working-directory: ./backend
        run: node scripts/bundle-analysis.js --ci-mode
        env:
          GIT_COMMIT: ${{ github.sha }}

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: |
            backend/.bundle-size-history.json
            backend/bundle-report.html
          retention-days: 30

  deployment-readiness:
    name: Backend Deployment Readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run deployment readiness tests
        working-directory: ./backend
        run: npm test -- --testPathPatterns=deployment_ready
      
      - name: Build backend
        working-directory: ./backend
        run: npm run build
      
      - name: Verify build output
        run: |
          if [ ! -d "backend/build" ]; then
            echo "Error: build output not found"
            exit 1
          fi
          echo "Build output verified"

  bundle-size-tracking:
    name: Bundle Size Tracking
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Build backend
        working-directory: ./backend
        run: npm run build
      
      - name: Run bundle analysis
        working-directory: ./backend
        run: node scripts/bundle-analysis.js --ci-mode
        env:
          GIT_COMMIT: ${{ github.sha }}

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: |
            backend/.bundle-size-history.json
            backend/bundle-report.html
          retention-days: 30

  godot-validate:
    name: Godot Project Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate project.godot
        run: |
          if [ ! -f project.godot ]; then
            echo "Error: project.godot not found"
            exit 1
          fi
          echo "project.godot found and valid"
      
      - name: Check autoload scripts exist
        run: |
          if grep -q "NetworkManager=" project.godot && ! [ -f autoloads/NetworkManager.gd ]; then
            echo "Error: NetworkManager autoload defined but file missing"
            exit 1
          fi
          if grep -q "GameManager=" project.godot && ! [ -f autoloads/GameManager.gd ]; then
            echo "Error: GameManager autoload defined but file missing"
            exit 1
          fi
          echo "Autoload scripts validated"

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  gdscript-lint:
    name: GDScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install gdlint
        run: pip install gdtoolkit

      - name: Run gdlint
        run: gdlint .

  schema-validation:
    name: Database Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Start PostgreSQL
        uses: harmon758/postgresql-action@v1
        with:
          postgresql version: '15'
          postgresql db: nakama
          postgresql user: postgres
          postgresql password: localdbpassword
      
      - name: Wait for PostgreSQL to be ready
        run: sleep 10
      
      - name: Install Nakama
        run: |
          # Download and extract Nakama server
          curl -sL https://github.com/heroiclabs/nakama/releases/download/v3.23.0/nakama-v3.23.0-linux-amd64.tar.gz -o nakama.tar.gz
          tar xzf nakama.tar.gz
          chmod +x nakama
      
      - name: Configure Nakama
        run: |
          # Create nakama config with database connection
          cat > nakama.yml << EOF
          database:
            address: "postgres:localdbpassword@localhost:5432/nakama?sslmode=disable"
          EOF
      
      - name: Run migrations
        working-directory: ./backend/data
        run: |
          for migration in $(ls -1 *.sql | sort); do
            echo "Running migration: $migration"
            PGPASSWORD=localdbpassword psql -h localhost -U postgres -d nakama -f "$migration"
          done
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run schema validation tests
        working-directory: ./backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: localdbpassword
          TEST_DB_NAME: nakama
        run: npm run test:schema
      
      - name: Upload schema test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-test-results
          path: backend/test-results/
          retention-days: 7
