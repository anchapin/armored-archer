name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run TypeScript type check
        working-directory: ./backend
        run: npm run typecheck

  backend-test:
    name: Backend Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run tests with coverage
        working-directory: ./backend
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: true

  deployment-readiness:
    name: Deployment Readiness Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run deployment readiness tests
        working-directory: ./backend
        run: npm test -- deployment_ready
      
      - name: Build backend
        working-directory: ./backend
        run: npm run build
      
      - name: Verify build output
        working-directory: ./backend
        run: |
          if [ ! -d "build" ]; then
            echo "Error: build directory not found"
            exit 1
          fi
          if [ ! -f "build/index.js" ]; then
            echo "Error: build/index.js not found"
            exit 1
          fi
          echo "Build verification passed"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Run npm audit
        working-directory: ./backend
        run: npm audit --audit-level=high
      
      - name: Run npm audit with production flag
        working-directory: ./backend
        run: npm audit --production --audit-level=high

  godot-validate:
    name: Godot Project Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate project.godot
        run: |
          if [ ! -f project.godot ]; then
            echo "Error: project.godot not found"
            exit 1
          fi
          echo "project.godot found and valid"
      
      - name: Check autoload scripts exist
        run: |
          if grep -q "NetworkManager=" project.godot && ! [ -f autoloads/NetworkManager.gd ]; then
            echo "Error: NetworkManager autoload defined but file missing"
            exit 1
          fi
          if grep -q "GameManager=" project.godot && ! [ -f autoloads/GameManager.gd ]; then
            echo "Error: GameManager autoload defined but file missing"
            exit 1
          fi
          echo "Autoload scripts validated"
