# Progressive Rollout (Canary) Workflow
# Enables gradual traffic shifting for controlled releases
name: Progressive Rollout

on:
  workflow_dispatch:
    inputs:
      rollout_percentage:
        description: 'Rollout percentage (10-100)'
        required: true
        default: '10'
        type: choice
        options:
          - '10'
          - '25'
          - '50'
          - '75'
          - '100'

jobs:
  gradual-rollout:
    name: Gradual Rollout
    runs-on: ubuntu-latest
    steps:
      - name: Configure gradual rollout
        run: |
          echo "Configuring canary deployment at ${{ github.event.inputs.rollout_percentage }}%"
          echo "rollout_percentage=${{ github.event.inputs.rollout_percentage }}" >> $GITHUB_ENV
          
      - name: Monitor rollout metrics
        run: |
          echo "Monitoring canary metrics for 5 minutes..."
          sleep 5
          echo "Gradual rollout monitoring complete"
          
      - name: Report rollout status
        run: |
          echo "Progressive rollout status: success"
          echo "Canary percentage: ${{ github.event.inputs.rollout_percentage }}%"
