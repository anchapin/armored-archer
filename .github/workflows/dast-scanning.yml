name: DAST Security Scan

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM
  workflow_dispatch:
  push:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  zap-scan:
    name: OWASP ZAP Scan
    # Skip when no real staging hostname is configured. The earlier default
    # of `https://staging.armored-archer.example.com` does not resolve and
    # made this job red on every push. Configure the workflow with a
    # real staging URL via vars.STAGING_URL (or repo/org Variables) to
    # re-enable the scan. See issue tracking the staging infra follow-up.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.STAGING_URL }}
          # Disable auto-issue creation: zaproxy/action-baseline defaults to
          # allow_issue_writing: true and would POST to /repos/.../issues for
          # every WARN-NEW/FAIL-NEW finding. GITHUB_TOKEN only carries
          # `contents: read` + `security-events: write` (least-privilege), so
          # the POST fails with "Resource not accessible by integration" and
          # turns the workflow red on every push. The HTML report is still
          # uploaded as an artifact for manual triage. Fix for #1357.
          allow_issue_writing: false
      
      - name: Run OWASP ZAP Full Scan
        if: github.ref == 'refs/heads/main'
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ vars.PRODUCTION_URL }}
          # See comment on the baseline step above. Same rationale — keep
          # the report artifact, skip the per-push noise issue. Fix for #1357.
          allow_issue_writing: false
      
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v6
        with:
          name: zap-report
          path: zap_report.html
          retention-days: 30

# --- CI Fixes Wave C ---
# REMOVED vars.STAGING_URL skip-gate on 2026-09-25 (issue #1088).

