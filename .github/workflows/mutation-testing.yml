name: Mutation Testing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Optional module filter (comma-separated, e.g., "combat_system,matchmaker")'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-testing:
    name: Mutation Testing (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: nakama
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run mutation testing
        id: mutation
        working-directory: ./backend
        run: |
          echo "Running Stryker mutation testing..."
          npm run mutation:test:ci 2>&1 | tee mutation-output.txt
          echo "status=complete" >> $GITHUB_OUTPUT

      - name: Extract mutation score
        if: always()
        working-directory: ./backend
        run: |
          if [ -f reports/mutation/mutation-report.json ]; then
            SCORE=$(node -e "
              const r = require('./reports/mutation/mutation-report.json');
              const killed = r.killed || 0;
              const survived = r.survived || 0;
              const total = killed + survived;
              const score = total > 0 ? ((killed / total) * 100).toFixed(1) : 'N/A';
              console.log(score);
            ")
            echo "Mutation score: ${SCORE}%"
            echo "mutation_score=$SCORE" >> $GITHUB_OUTPUT
          else
            echo "Mutation report not found"
            echo "mutation_score=N/A" >> $GITHUB_OUTPUT
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            backend/reports/mutation/
            backend/mutation-output.txt
          retention-days: 30

      - name: Comment on PR with mutation results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Mutation Testing Results\n\n';
            const score = '${{ steps.mutation.outputs.mutation_score }}';

            if (score && score !== 'N/A') {
              const scoreNum = parseFloat(score);
              const icon = scoreNum >= 80 ? '✅' : scoreNum >= 60 ? '⚠️' : '❌';
              body += `${icon} **Overall Mutation Score: ${score}%**\n\n`;
            }

            body += 'Mutation testing validates test quality by introducing code changes and checking if tests catch them.\n\n';
            body += 'View detailed results in the workflow artifacts.\n';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Mutation Testing Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
