# k6 load tests against the Nakama backend (issue #1347).
#
# Runs nightly and on PRs that touch the scenarios or this workflow (so a PR
# editing the load suite proves itself green before merge). The Nakama +
# Postgres environment is provisioned with the same recipe as the
# backend-integration-test job in ci.yml: bundle built from the checked-out
# code, docker-compose service stack, migrations, CI admin identity.
#
# Player stats live in Nakama STORAGE, so the seed step creates device-linked
# users plus storage rows (see backend/tests/load/README.md).

name: Load Tests

on:
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    paths:
      - 'backend/tests/load/**'
      - '.github/workflows/load-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  k6-load-test:
    name: k6 Load Tests (Nakama + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HMAC_SECRET: ci-test-secret-do-not-use-in-production

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Inject required env vars into .env for CI bundle build
        working-directory: ./backend
        run: |
          if [ ! -f .env ] || ! grep -q "^HMAC_SECRET=" .env; then
            echo "HMAC_SECRET=ci-test-secret-do-not-use-in-production" >> .env
          fi
          if [ ! -f .env ] || ! grep -q "^NAKAMA_SERVER_KEY=" .env; then
            echo "NAKAMA_SERVER_KEY=ci-test-server-key-do-not-use-in-production" >> .env
          fi
          if [ ! -f .env ] || ! grep -q "^TEST_FIXTURE_RPCS_ENABLED=" .env; then
            echo "TEST_FIXTURE_RPCS_ENABLED=true" >> .env
          fi
          echo 'CI_RECEIPT_FIXTURE=true' >> .env
          if [ ! -f .env ] || ! grep -q "^SESSION_ENCRYPTION_KEY=" .env; then
            echo "SESSION_ENCRYPTION_KEY=ci-test-session-encryption-key-do-not-use-in-production" >> .env
          fi
          if [ ! -f .env ] || ! grep -q "^REFRESH_ENCRYPTION_KEY=" .env; then
            echo "REFRESH_ENCRYPTION_KEY=ci-test-refresh-encryption-key-do-not-use-in-production" >> .env
          fi
          if [ ! -f .env ] || ! grep -q "^TOKEN_ENCRYPTION_KEY=" .env; then
            echo "TOKEN_ENCRYPTION_KEY=ci-test-token-encryption-key-do-not-use-in-production" >> .env
          fi
          if [ ! -f .env ] || ! grep -q "^REVENUECAT_SECRET_KEY=" .env; then
            echo "REVENUECAT_SECRET_KEY=ci-test-revenuecat-secret-key-do-not-use-in-production" >> .env
          fi
          if [ ! -f .env ] || ! grep -q "^REVENUECAT_WEBHOOK_SECRET=" .env; then
            echo "REVENUECAT_WEBHOOK_SECRET=ci-test-revenuecat-webhook-secret-do-not-use-in-production" >> .env
          fi
          if [ ! -f .env ] || ! grep -q "^DATABASE_ADDRESS=" .env; then
            echo "DATABASE_ADDRESS=postgres://postgres:changeme@postgres:5432/nakama" >> .env
          fi
          if [ ! -f .env ] || ! grep -q "^FIREBASE_ENABLED=" .env; then
            echo "FIREBASE_ENABLED=false" >> .env
          fi

      - name: Build Nakama bundle
        working-directory: ./backend
        run: npm run build:full

      - name: Start Nakama and Postgres via docker-compose
        run: |
          docker compose --parallel 1 -f .github/docker-compose.yml pull
          docker compose -f .github/docker-compose.yml up -d --pull never
          echo "Waiting for services to be healthy..."
          for i in {1..60}; do
            if docker compose -f .github/docker-compose.yml ps | grep -q "healthy"; then
              echo "Services are healthy"
              break
            fi
            echo "Waiting for services... ($i/60)"
            sleep 2
          done

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if PGPASSWORD=changeme pg_isready -h localhost -p 5432 -U postgres 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Wait for Nakama to be ready
        run: |
          MAX_WAIT=360
          INTERVAL=15
          ELAPSED=0
          CONSECUTIVE=0
          NEEDED=3
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            if docker exec ci_nakama /nakama/nakama healthcheck 2>/dev/null; then
              CONSECUTIVE=$((CONSECUTIVE + 1))
              echo "  Nakama healthy (${CONSECUTIVE}/${NEEDED}, waited ${ELAPSED}s)..."
              if [ $CONSECUTIVE -ge $NEEDED ]; then
                echo "Nakama is ready!"
                exit 0
              fi
            else
              CONSECUTIVE=0
              echo "  Nakama not ready (waited ${ELAPSED}s/${MAX_WAIT}s)..."
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "ERROR: Nakama did not become ready within ${MAX_WAIT}s."
          docker logs ci_nakama --tail 100 2>&1 | tail -50
          exit 1

      - name: Run game schema migrations
        working-directory: ./backend/data
        run: |
          for migration in $(ls -1 *.sql 2>/dev/null | sort -V); do
            echo "Running migration: $migration"
            PGPASSWORD=changeme psql -h localhost -p 5432 -U postgres -d nakama -f "$migration" || true
          done

      - name: Bootstrap CI admin identity and reload allowlisted bundle
        env:
          CI: 'true'
          NAKAMA_SERVER_KEY: ci-test-server-key-do-not-use-in-production
        run: |
          cd backend
          node scripts/ci-admin-identity.js
          npm run build:full
          cd ..
          docker compose -f .github/docker-compose.yml restart nakama
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:7350/healthcheck >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs ci_nakama --tail 50
          exit 1

      - name: Seed load-test users, device links, and player stats
        run: |
          PGPASSWORD=changeme psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d nakama <<'SQL'
          INSERT INTO users (id, username, display_name, lang_tag, metadata)
          VALUES
            ('00000000-0000-4000-8000-000000000001', 'k6_loadtest_1', 'K6 Load Test 1', 'en', '{}'),
            ('00000000-0000-4000-8000-000000000002', 'k6_loadtest_2', 'K6 Load Test 2', 'en', '{}'),
            ('00000000-0000-4000-8000-000000000003', 'k6_loadtest_3', 'K6 Load Test 3', 'en', '{}')
          ON CONFLICT DO NOTHING;

          INSERT INTO user_device (id, user_id)
          VALUES
            ('k6-loadtest-device-1', '00000000-0000-4000-8000-000000000001'),
            ('k6-loadtest-device-2', '00000000-0000-4000-8000-000000000002'),
            ('k6-loadtest-device-3', '00000000-0000-4000-8000-000000000003')
          ON CONFLICT DO NOTHING;

          INSERT INTO storage (collection, key, user_id, value, version, read, write)
          SELECT 'player_stats', u.id::text, u.id,
                 json_build_object(
                   'user_id', u.id::text,
                   'level', 1,
                   'xp', 0,
                   'ability_points', 0,
                   'stats', json_build_object('attack', 10, 'defense', 10, 'dodge', 10, 'crit_rate', 5)
                 )::jsonb,
                 replace(gen_random_uuid()::text, '-', ''), 1, 1
          FROM users u
          WHERE u.username LIKE 'k6\_loadtest\_%'
          ON CONFLICT (collection, key, user_id) DO NOTHING;
          SQL

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run smoke scenario
        working-directory: ./backend
        env:
          NAKAMA_BASE_URL: http://127.0.0.1:7350
          NAKAMA_SERVER_KEY: ci-test-server-key-do-not-use-in-production
        run: k6 run --summary-export=smoke-results.json tests/load/scenarios/smoke.js

      - name: Run player stats scenario
        working-directory: ./backend
        env:
          NAKAMA_BASE_URL: http://127.0.0.1:7350
          NAKAMA_SERVER_KEY: ci-test-server-key-do-not-use-in-production
        run: k6 run --summary-export=player-stats-results.json tests/load/scenarios/player_stats.js

      - name: Run leaderboard scenario
        working-directory: ./backend
        env:
          NAKAMA_BASE_URL: http://127.0.0.1:7350
          NAKAMA_SERVER_KEY: ci-test-server-key-do-not-use-in-production
        run: k6 run --summary-export=leaderboard-results.json tests/load/scenarios/leaderboard.js

      - name: Run mixed workload scenario
        working-directory: ./backend
        env:
          NAKAMA_BASE_URL: http://127.0.0.1:7350
          NAKAMA_SERVER_KEY: ci-test-server-key-do-not-use-in-production
        run: k6 run --summary-export=mixed-workload-results.json tests/load/scenarios/mixed_workload.js

      - name: Run hung request scenario
        working-directory: ./backend
        env:
          NAKAMA_BASE_URL: http://127.0.0.1:7350
          NAKAMA_SERVER_KEY: ci-test-server-key-do-not-use-in-production
        run: k6 run --summary-export=hung-request-results.json tests/load/scenarios/hung_request.js

      - name: Parse load test results
        if: always()
        working-directory: ./backend
        run: node tests/load/parse-load-test-results.js

      - name: Upload k6 result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            backend/*-results.json
          retention-days: 30
