name: Secrets Management Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly to catch any drift
    - cron: '0 0 * * 0'

jobs:
  secrets-documentation:
    name: Secrets Management Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SECRETS_MANAGEMENT.md exists
        run: |
          if [ ! -f "SECRETS_MANAGEMENT.md" ]; then
            echo "Error: SECRETS_MANAGEMENT.md is missing"
            exit 1
          fi
          echo "SECRETS_MANAGEMENT.md exists"

      - name: Check SECRETS_ROTATION.md exists
        run: |
          if [ ! -f "SECRETS_ROTATION.md" ]; then
            echo "Error: SECRETS_ROTATION.md is missing"
            exit 1
          fi
          echo "SECRETS_ROTATION.md exists"

      - name: Validate secrets management content
        run: |
          # Check key sections in SECRETS_MANAGEMENT.md
          REQUIRED_SECTIONS=(
            "Overview"
            "Environment Files"
            "CI/CD Secrets Management"
            "GitHub Secrets"
          )

          for section in "${REQUIRED_SECTIONS[@]}"; do
            if ! grep -q "$section" SECRETS_MANAGEMENT.md; then
              echo "Error: Missing section '$section' in SECRETS_MANAGEMENT.md"
              exit 1
            fi
          done
          echo "All required sections found in SECRETS_MANAGEMENT.md"

  environment-files:
    name: Environment File Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .env.example exists
        run: |
          if [ ! -f ".env.example" ]; then
            echo "Error: .env.example is missing"
            exit 1
          fi
          echo ".env.example exists"

      - name: Check backend .env.example exists
        run: |
          if [ ! -f "backend/.env.example" ]; then
            echo "Error: backend/.env.example is missing"
            exit 1
          fi
          echo "backend/.env.example exists"

      - name: Validate required environment variables
        run: |
          # Check for required variables in .env.example
          REQUIRED_VARS=(
            "NAKAMA_SERVER_URL"
            "NAKAMA_SERVER_PORT"
            "NAKAMA_SERVER_KEY"
            "SESSION_ENCRYPTION_KEY"
            "REFRESH_ENCRYPTION_KEY"
            "POSTGRES_PASSWORD"
          )

          for var in "${REQUIRED_VARS[@]}"; do
            if ! grep -q "$var" .env.example; then
              echo "Error: Missing '$var' in .env.example"
              exit 1
            fi
          done
          echo "All required environment variables found"

  gitignore-validation:
    name: GitIgnore Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify .env files are gitignored
        run: |
          # Check .gitignore contains .env patterns
          if ! grep -q ".env" .gitignore; then
            echo "Error: .env files not properly gitignored"
            exit 1
          fi
          echo ".env files are properly gitignored"

      - name: Verify backend .env is gitignored
        run: |
          if ! grep -q "backend/.env" .gitignore; then
            echo "Error: backend/.env not properly gitignored"
            exit 1
          fi
          echo "backend/.env is properly gitignored"

  secrets-scanning:
    name: Secrets Exposure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for potential secrets in recent commits
        run: |
          # Patterns that might indicate accidentally committed secrets
          SUSPICIOUS_PATTERNS=(
            "sk_live_[a-zA-Z0-9]"
            "AKIA[0-9A-Z]{16}"
            "ghp_[a-zA-Z0-9]{36}"
          )

          # Get list of changed files in last 10 commits
          for pattern in "${SUSPICIOUS_PATTERNS[@]}"; do
            if git log --oneline -10 | while read -r commit _; do
              git diff "$commit^..$commit" | grep -q "$pattern" && echo "Found: $pattern in $commit"
            done; then
              echo "Warning: Potential secret pattern found in recent commits"
              # Don't fail - GitHub Advanced Security handles this
            fi
          done
          echo "Secrets exposure check completed"

  secrets-rotation:
    name: Secrets Rotation Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify rotation procedures exist
        run: |
          # Check SECRETS_ROTATION.md has required content
          if ! grep -q "Rotation Procedures" SECRETS_ROTATION.md; then
            echo "Error: Missing rotation procedures"
            exit 1
          fi

          if ! grep -q "Rotation Schedule" SECRETS_ROTATION.md; then
            echo "Error: Missing rotation schedule"
            exit 1
          fi

          if ! grep -q "Emergency Rotation" SECRETS_ROTATION.md; then
            echo "Error: Missing emergency rotation procedures"
            exit 1
          fi

          echo "Secrets rotation documentation is complete"

  label-check:
    name: Secrets Management Label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets_management label exists
        run: |
          if [ ! -f ".github/labels.yml" ]; then
            echo "Error: .github/labels.yml is missing"
            exit 1
          fi

          if ! grep -q "secrets_management" .github/labels.yml; then
            echo "Error: secrets_management label is missing from labels.yml"
            exit 1
          fi

          echo "secrets_management label is defined"

  agent-documentation:
    name: Agent Documentation Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify AGENTS.md references secrets management
        run: |
          if ! grep -q "SECRETS_MANAGEMENT.md" AGENTS.md; then
            echo "Error: AGENTS.md should reference SECRETS_MANAGEMENT.md"
            exit 1
          fi

          if ! grep -q "secrets" AGENTS.md; then
            echo "Error: AGENTS.md should contain secrets management documentation"
            exit 1
          fi

          echo "AGENTS.md is updated with secrets management info"
