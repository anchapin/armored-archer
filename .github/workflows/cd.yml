name: CD

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  deployments: write

# Concurrency control for deployments
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.environment || 'push' }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.armored-archer.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          exclude: []
        continue-on-error: false

      # Deployment observability: Create deployment status
      - name: Create deployment (staging)
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'staging',
              description: 'Staging environment deployment',
              auto_merge: false,
              required_contexts: [],
            });
            core.setOutput('deployment_id', String(data.id));
            core.setOutput(
              'deployment_url',
              data.url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/deployments`
            );

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Run tests
        working-directory: ./backend
        run: npm test

      - name: Build and start Docker containers
        working-directory: ./backend
        run: |
          docker-compose up -d --build

      - name: Wait for services to be healthy
        working-directory: ./backend
        run: |
          echo "Waiting for PostgreSQL to be healthy..."
          until docker-compose exec -T postgres pg_isready -U postgres -d nakama; do
            echo "PostgreSQL is not ready yet..."
            sleep 2
          done
          echo "PostgreSQL is healthy!"

          echo "Waiting for Nakama to be healthy..."
          until docker-compose exec -T nakama /nakama/nakama healthcheck; do
            echo "Nakama is not ready yet..."
            sleep 2
          done
          echo "Nakama is healthy!"

      - name: Verify services are running
        working-directory: ./backend
        run: |
          docker-compose ps

      - name: Health check verification
        working-directory: ./backend
        run: |
          echo "Checking PostgreSQL health..."
          docker-compose exec -T postgres pg_isready -U postgres -d nakama

          echo "Checking Nakama health..."
          docker-compose exec -T nakama /nakama/nakama healthcheck

      # Deployment observability: Update deployment status to success
      - name: Update deployment status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = '${{ steps.deployment.outputs.deployment_id }}';
            if (!deploymentId) {
              core.warning('No deployment_id available; skipping status update.');
              return;
            }
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(deploymentId),
              state: 'success',
              environment: 'staging',
              environment_url: 'https://staging.armored-archer.example.com',
            });

      # Deployment observability: Update deployment status to failure
      - name: Update deployment status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = '${{ steps.deployment.outputs.deployment_id }}';
            if (!deploymentId) {
              core.warning('No deployment_id available; skipping status update.');
              return;
            }
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(deploymentId),
              state: 'failure',
              environment: 'staging',
              environment_url: 'https://staging.armored-archer.example.com',
            });

      # Deployment observability: Send deployment notification
      - name: Send deployment notification (staging)
        if: always() && env.ACT != 'true'
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          payload: |
            {
              "text": "Deployment to *Staging* ${{ job.status }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Deployment ${{ job.status == 'success' && 'Succeeded' || 'Failed' }} : Staging"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\nStaging"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ job.status }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Deployment"
                      },
                      "url": "${{ steps.deployment.outputs.deployment_url }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://armored-archer.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          exclude: []
        continue-on-error: false

      # Deployment observability: Create deployment status
      - name: Create deployment (production)
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
