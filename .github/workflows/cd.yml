              deployment_id: Number(deploymentId),
              state: 'failure',
              environment: 'production',
              environment_url: 'https://armored-archer.example.com',
            });

      # Deployment observability: Send deployment notification
      - name: Send deployment notification (production)
        if: always() && env.ACT != 'true'
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          payload: |
            {
              "text": "Deployment to *Production* ${{ job.status }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Deployment ${{ job.status == 'success' && 'Succeeded' || 'Failed' }} : Production"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\nProduction"
                    },
