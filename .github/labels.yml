# Default labels for the repository
---
labels:
  - name: "bug"
    color: "d73a49"
    description: "Something isn't working"
  - name: "enhancement"
    color: "a2eeef"
    description: "New feature or request"
  - name: "documentation"
    color: "0075ca"
    description: "Improvements or additions to documentation"
  - name: "question"
    color: "d876e3"
