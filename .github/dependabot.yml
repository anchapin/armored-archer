version: 2
updates:
  # Enable Dependabot for npm (backend)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    reviewers:
      - "anchapin"
    # Enable security updates
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      include: "scope"
    # Configure update policies
    allow:
      # Allow development dependency updates
      - dependency-type: "development"
      # Allow production dependency updates
      - dependency-type: "production"
    # Ignore certain dependency types if needed
    ignore:
      - dependency-name: "typescript"
        update-types: ["major"]
    # Auto-merge minor and patch updates
    automerged-updates:
      - dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      - dependency-type: "production"
        update-types:
          - "patch"

  # Enable Dependabot for npm (root - game client)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    reviewers:
      - "anchapin"
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      include: "scope"
    # Only automerge dev dependencies at root level
    automerged-updates:
      - dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
