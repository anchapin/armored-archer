version: 2
updates:
  # Enable Dependabot for npm (backend)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    reviewers:
      - "anchapin"
    # Enable security updates
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      include: "scope"
    # Configure update policies
    allow:
      # Allow development dependency updates
      - dependency-type: "development"
      # Allow production dependency updates
      - dependency-type: "production"
    # Ignore certain dependency types if needed
    ignore:
      - dependency-name: "typescript"
        update-types: ["major"]
