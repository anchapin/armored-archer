# CI-specific Docker Compose for local act testing
# Matches the services configuration in .github/workflows/test.yml and ci.yml
# Usage: docker compose -f .github/docker-compose.yml up -d
#
# To use with act, set ACT_SERVICES_FILE=.github/docker-compose.yml

services:
  # PostgreSQL database - matches CI port 5432 (not local dev's 5433)
  postgres:
    image: postgres:14-alpine
    container_name: ci_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ci-network

  # Nakama game server - uses custom PostgreSQL image
  nakama:
    image: armored-archer/nakama-postgres:3.21.1
    container_name: ci_nakama
    ports:
      - "7350:7350"
      - "7351:7351"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    environment:
      NAKAMA_SERVER_KEY: defaultkey
    networks:
      - ci-network

networks:
  ci-network:
    driver: bridge
