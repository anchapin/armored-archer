# CI-specific Docker Compose for local act testing
# Matches the services configuration in .github/workflows/test.yml and ci.yml
# Usage: docker compose -f .github/docker-compose.yml up -d
#
# To use with act, set ACT_SERVICES_FILE=.github/docker-compose.yml
#
# Note (#858): the retired `armored-archer/nakama-postgres:3.21.1` image was
# never published to a registry and broke job setup everywhere. Services now
# use the same standard images as backend/docker-compose.yml:
# postgres:14-alpine + heroiclabs/nakama:3.21.1.
#
# Bundle mount (pass-2 of PR #1126 follow-up): the `backend-integration-test`
# job in .github/workflows/ci.yml mounts ${PWD}/backend/data/modules into the
# nakama container at /nakama/data/modules so the compiled game bundle
# (combat / loot / season RPCs) is picked up by Nakama's default module path.
# Mirror that here so the CI stack matches the hosted runner -- otherwise
# integration tests pass under `act` only when the bundle is otherwise
# injected, which the assert script (--require-nakama-bundle) will now
# detect as a failure. PREREQUISITE: run `cd backend && npm run build:full`
# once before `make ci-services-start`; the preflight target
# (`make ci-services-preflight`) fails-fast if backend/data/modules/index.js
# is missing.

services:
  # PostgreSQL database - matches CI port 5432 (not local dev's 5433)
  postgres:
    image: postgres:14-alpine
    container_name: ci_postgres
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nakama game server - standard heroiclabs image, wired to the postgres
  # service the same way backend/docker-compose.yml does it (migrate up, then
  # serve; DSN via the compose-network service hostname).
  #
  # Config file (issue #1135 / fix/ci-infrastructure):
  #   The -config /nakama/nakama.yml uses backend/nakama.ci.yml which sets
  #   js_entrypoint: "modules/index.js" so Nakama loads the JS bundle.
  #   Without this, Nakama defaults to js_entrypoint="" and the bundle is
  #   never loaded → InitModule never runs → HTTP server never starts →
  #   "ECONNREFUSED" on port 7350.
  #
  # Network mode (issue #1331):
  #   bridge networking with port publishing (7350:7350) causes Nakama's HTTP
  #   server to be unreachable from the runner even though it starts and
  #   responds to a single curl. Using network_mode: host binds directly to
  #   the host's network stack, eliminating Docker port-mapping issues.
  nakama:
    image: heroiclabs/nakama:3.21.1
    container_name: ci_nakama
    network_mode: host
    deploy:
      resources:
        limits:
          memory: 2G
    ulimits:
      stack: 536870912
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address "postgres://postgres:changeme@127.0.0.1:5432/nakama" &&
        exec env HMAC_SECRET=ci-test-secret-do-not-use-in-production /nakama/nakama -config /nakama/nakama.yml --runtime.js_read_only_globals=false
    # Bundle mount: mirrors .github/workflows/ci.yml:888-893 (the hosted
    # runner). PREREQUISITE: backend/data/modules/index.js must exist; run
    # `cd backend && npm run build:full` first, or `make ci-services-preflight`
    # will refuse to bring the stack up.
    volumes:
      - ${PWD}/backend/nakama.ci.yml:/nakama/nakama.yml:ro
      - ${PWD}/backend/data/modules:/nakama/data/modules:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # NOTE: The JS bundle's process.env is baked at BUILD time from backend/.env.
      # Nakama runtime env vars (NAKAMA_SERVER_KEY, HMAC_SECRET) do NOT reach
      # the bundle's static process.env. Both must be in backend/.env before
      # `npm run build:full` so they are embedded. The values below match what
      # is injected by the CI workflow's "Inject required env vars into .env"
      # step so local dev matches CI behavior.
      NAKAMA_SERVER_KEY: ci-test-server-key-do-not-use-in-production
      HMAC_SECRET: ci-test-secret-do-not-use-in-production
