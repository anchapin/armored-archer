name: Android release build
description: Install Godot 4.6, export templates and the Android SDK, then build and verify the release AAB (issue #1725).
inputs:
  keystore-path:
    description: Path to the release (or throwaway) keystore file
    required: true
  keystore-alias:
    description: Key alias in the keystore
    required: true
  keystore-password:
    description: Keystore and key password (must be the same value; Godot takes one)
    required: true
runs:
  using: composite
  steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Godot headless
      shell: bash
      run: |
        wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip -O /tmp/godot.zip
        unzip -q /tmp/godot.zip -d /tmp/godot
        chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64

    - name: Cache Godot export templates
      id: templates-cache
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates
        key: godot-export-templates-4.6-stable

    - name: Install Godot export templates
      if: steps.templates-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        wget -q https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz -O /tmp/templates.tpz
        mkdir -p ~/.local/share/godot/export_templates
        unzip -q /tmp/templates.tpz -d /tmp/tpl
        mv /tmp/tpl/templates ~/.local/share/godot/export_templates/4.6.stable

    - name: Install Android SDK (platform 36)
      shell: bash
      run: |
        export ANDROID_SDK_ROOT=/tmp/android-sdk
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.1" "ndk;28.1.13356709" > /dev/null

    - name: Build and verify the AAB
      shell: bash
      env:
        GODOT_BIN: /tmp/godot/Godot_v4.6-stable_linux.x86_64
        ANDROID_SDK_ROOT: /tmp/android-sdk
        KEYSTORE_PATH: ${{ inputs.keystore-path }}
        KEYSTORE_ALIAS: ${{ inputs.keystore-alias }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
      run: bash scripts/ci/build-android-release.sh
